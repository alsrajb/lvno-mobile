                        contentPadding: EdgeInsets.zero,
                        title: const Text("الوضع الاقتصادي لتوفير الرصيد", style: TextStyle(fontWeight: FontWeight.bold)),
                        subtitle: const Text("خفض تلقائي لجودة الفيديو لإبطاء دوران عداد الاستهلاك", style: TextStyle(fontSize: 12, color: Colors.white70)),
                        value: ecoMode,
                        onChanged: (val) async {
                          await widget.engine.toggleMyEcoMode(val);
                          setState(() => _feedback = val ? "✅ تم تفعيل الوضع الاقتصادي" : "تم إيقاف الوضع الاقتصادي");
                        },
                      ),
                    ),
                  ],
                ),
              );
            }

