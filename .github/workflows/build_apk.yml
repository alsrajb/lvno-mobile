            Widget _buildChildControlCard(String childId) {
              final db = FirebaseFirestore.instance;
              final localName = _localContacts[childId] ?? "جهاز #$childId";

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('wallets').doc(childId).snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || !snap.data!.exists) return const SizedBox.shrink();
                  final c = snap.data!.data() as Map<String, dynamic>;
                  final bool locked = (c['parental_locked'] ?? false) == true;
                  final bool childEco = (c['eco_mode'] ?? false) == true;
                  final int timeLimit = ((c['daily_time_limit_mins'] ?? 0) as num).toInt();
                  final List<String> blockedCats = List<String>.from((c['blocked_categories'] as List<dynamic>?) ?? []);
                  final List<String> customDomains = List<String>.from((c['custom_blocked_domains'] as List<dynamic>?) ?? []);

                  return Container(
                    margin: const EdgeInsets.only(bottom: 14),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: const Color(0xFF1E293B),
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: Colors.white12),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text("$localName (#$childId)", style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Color(0xFF6EE7B7))),
                            Switch(
                              value: !locked,
                              activeColor: const Color(0xFF10B981),
                              onChanged: (allow) {
                                db.collection('wallets').doc(childId).update({'parental_locked': !allow});
                              },
                            ),
                          ],
                        ),
                        Text(locked ? "الحالة: مقفل بأمر الرقابة الأبوية" : "الحالة: مسموح بالاستخدام", style: const TextStyle(fontSize: 12, color: Colors.white70)),
                        const Divider(height: 20, color: Colors.white12),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          dense: true,
                          title: const Text("فرض الوضع الاقتصادي (جودة فيديو أقل)"),
                          value: childEco,
                          onChanged: (v) => db.collection('wallets').doc(childId).update({'eco_mode': v}),
                        ),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text("وقت الاستخدام اليومي: ${timeLimit == 0 ? 'مفتوح' : '$timeLimit دقيقة'}", style: const TextStyle(fontSize: 13)),
                            DropdownButton<int>(
                              value: [0, 60, 120, 180, 300].contains(timeLimit) ? timeLimit : 0,
                              items: const [
                                DropdownMenuItem(value: 0, child: Text("مفتوح")),
                                DropdownMenuItem(value: 60, child: Text("ساعة يومياً")),
                                DropdownMenuItem(value: 120, child: Text("ساعتان يومياً")),
                                DropdownMenuItem(value: 180, child: Text("3 ساعات")),
                                DropdownMenuItem(value: 300, child: Text("5 ساعات")),
                              ],
                              onChanged: (val) {
                                if (val != null) {
                                  db.collection('wallets').doc(childId).update({'daily_time_limit_mins': val});
                                }
                              },
                            ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        const Text("قوائم الحظر المرحلية:", style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold)),
                        const SizedBox(height: 6),
                        Wrap(
                          spacing: 8,
                          children: [
                            FilterChip(
                              label: const Text("حظر الألعاب"),
                              selected: blockedCats.contains('games'),
                              onSelected: (sel) {
                                final next = List<String>.from(blockedCats);
                                sel ? next.add('games') : next.remove('games');
                                db.collection('wallets').doc(childId).update({'blocked_categories': next});
                              },
                            ),
                            FilterChip(
                              label: const Text("حظر التواصل الاجتماعي"),
                              selected: blockedCats.contains('social'),
                              onSelected: (sel) {
                                final next = List<String>.from(blockedCats);
                                sel ? next.add('social') : next.remove('social');
                                db.collection('wallets').doc(childId).update({'blocked_categories': next});
                              },
                            ),
                            FilterChip(
                              label: const Text("حظر الفيديو"),
                              selected: blockedCats.contains('video'),
                              onSelected: (sel) {
                                final next = List<String>.from(blockedCats);
                                sel ? next.add('video') : next.remove('video');
                                db.collection('wallets').doc(childId).update({'blocked_categories': next});
                              },
                            ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text("روابط مخصصة محظورة (${customDomains.length})", style: const TextStyle(fontSize: 12, color: Colors.white70)),
                            TextButton.icon(
                              icon: const Icon(Icons.add_moderator, size: 16),
                              label: const Text("إدارة الروابط"),
                              onPressed: () => _showCustomDomainsDialog(childId, customDomains),
                            ),
                          ],
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            void _showCustomDomainsDialog(String childId, List<String> currentDomains) {
              final ctrl = TextEditingController();
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: Text("حظر روابط مخصصة (#$childId)", style: const TextStyle(fontSize: 16)),
                  content: SizedBox(
                    width: double.maxFinite,
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: ctrl,
                                decoration: const InputDecoration(hintText: "مثال: example.com"),
                              ),
                            ),
                            IconButton(
                              icon: const Icon(Icons.add_circle, color: Color(0xFF10B981)),
                              onPressed: () {
                                final d = ctrl.text.trim().toLowerCase();
                                if (d.isNotEmpty) {
                                  FirebaseFirestore.instance.collection('wallets').doc(childId).update({
                                    'custom_blocked_domains': FieldValue.arrayUnion([d]),
                                  });
                                  Navigator.pop(ctx);
                                }
                              },
                            ),
                          ],
                        ),
                        const SizedBox(height: 12),
                        ...currentDomains.map((dom) => ListTile(
                              dense: true,
                              title: Text(dom),
                              trailing: IconButton(
                                icon: const Icon(Icons.delete_outline, color: Colors.redAccent),
                                onPressed: () {
                                  FirebaseFirestore.instance.collection('wallets').doc(childId).update({
                                    'custom_blocked_domains': FieldValue.arrayRemove([dom]),
                                  });
                                  Navigator.pop(ctx);
                                },
                              ),
                            )),
                      ],
                    ),
                  ),
                ),
              );
            }

