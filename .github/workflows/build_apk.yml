            Future> verifyManualHostActivation(
                String hostId, {bool requirePhysicalRouter = false}) async {
              final db = FirebaseFirestore.instance;
              final hostSnap = await db.collection('hosts').doc(hostId).get();
              if (!hostSnap.exists) {
                return {'ok': false, 'reason': 'هذه الشبكة غير مسجلة في السيرفر'};
              }
              final data = hostSnap.data()!;
              final status = (data['status'] ?? 'inactive').toString();
              final bool manualApproved = (data['manual_admin_approved'] ?? false) == true;
              final String secretCode = (data['activation_secret'] ?? '').toString().trim();
              final String expectedGateway = (data['gateway_ip'] ?? '').toString().trim();
              final int customApiPort = ((data['custom_api_port'] ?? 0) as num).toInt();

              if (status != 'active' || !manualApproved || secretCode.isEmpty) {
                return {'ok': false, 'reason': '⛔ الشبكة غير مفعلة من الإدارة'};
              }
              if (expectedGateway.isEmpty || customApiPort < 1024) {
                return {'ok': false, 'reason': '⛔ الشبكة غير مهيأة (بوابة أو منفذ ناقص)'};
              }

              if (requirePhysicalRouter) {
                final String currentGateway =
                    await _vpnChannel.invokeMethod<String>('getCurrentGatewayIp') ?? '';

                if (currentGateway.trim() != expectedGateway) {
                  return {
                    'ok': false,
                    'reason': '⛔ أنت غير متصل براوتر الميكروتيك المعتمد\\n'
                              'المتوقع: $expectedGateway\\n'
                              'الحالي: ${currentGateway.isEmpty ? "غير متصل" : currentGateway}'
                  };
                }

                final Map<dynamic, dynamic> idResult = await _vpnChannel.invokeMethod(
                  'verifyMikroTikIdentity',
                  {'gatewayIp': expectedGateway, 'customApiPort': customApiPort},
                ) ?? {};

                if (idResult['isMikroTik'] != true) {
                  return {'ok': false, 'reason': '⛔ الراوتر المتصل ليس ميكروتيك'};
                }
                if (idResult['hasSpecialConfig'] != true) {
                  return {'ok': false, 'reason': '⛔ الميكروتيك غير مهيأ (المنفذ $customApiPort مغلق)'};
                }
              }

              currentHostId = hostId;
              cachedGatewayIp = expectedGateway;
              return {'ok': true, 'data': data};
            }

