                tx.set(db.collection('transactions').doc(), {
                  'sender_id': walletId,
                  'receiver_id': cleanReceiver,
                  'transfer_mode': transferMode,
                  'gross_amount_yer': amountYer,
                  'net_cash_deducted_yer': netCashDeductedFromSender,
