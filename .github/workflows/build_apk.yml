            Widget _buildChildControlCard(String childId) {
              final db = FirebaseFirestore.instance;
              final localName = _localContacts[childId] ?? "جهاز #$childId";

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('wallets').doc(childId).snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || !snap.data!.exists) return const SizedBox.shrink();
                  final c = snap.data!.data() as Map<String, dynamic>;
                  final bool locked = (c['parental_locked'] ?? false) == true;
                  final bool childEco = (c['eco_mode'] ?? false) == true;
                  final int timeLimit = ((c['daily_time_limit_mins'] ?? 0) as num).toInt();
                  final List<String> blockedCats = List<String>.from((c['blocked_categories'] as List<dynamic>?) ?? []);

                  return Container(
                    margin: const EdgeInsets.only(bottom: 14),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(color: kWhite, borderRadius: BorderRadius.circular(16), border: Border.all(color: kMidGray)),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text("$localName (#$childId)", style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: kMandarinOrange)),
                            Switch(
                              value: !locked,
                              activeColor: kMandarinOrange,
                              onChanged: (allow) {
                                db.collection('wallets').doc(childId).update({'parental_locked': !allow});
                              },
                            ),
                          ],
                        ),
                        const Divider(color: kMidGray),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero, dense: true,
                          title: const Text("الوضع الاقتصادي", style: TextStyle(color: kBlack, fontSize: 13)),
                          value: childEco,
                          activeColor: kMandarinOrange,
                          onChanged: (v) => db.collection('wallets').doc(childId).update({'eco_mode': v}),
                        ),
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text("الحد اليومي: ${timeLimit == 0 ? 'مفتوح' : '$timeLimit د'}",
                                 style: const TextStyle(fontSize: 13, color: kBlack)),
                            DropdownButton<int>(
                              value: [0, 60, 120, 180, 300].contains(timeLimit) ? timeLimit : 0,
                              dropdownColor: kWhite,
                              items: const [
                                DropdownMenuItem(value: 0, child: Text("مفتوح", style: TextStyle(color: kBlack))),
                                DropdownMenuItem(value: 60, child: Text("ساعة", style: TextStyle(color: kBlack))),
                                DropdownMenuItem(value: 120, child: Text("ساعتان", style: TextStyle(color: kBlack))),
                                DropdownMenuItem(value: 180, child: Text("3 ساعات", style: TextStyle(color: kBlack))),
                                DropdownMenuItem(value: 300, child: Text("5 ساعات", style: TextStyle(color: kBlack))),
                              ],
                              onChanged: (val) {
                                if (val != null) db.collection('wallets').doc(childId).update({'daily_time_limit_mins': val});
                              },
                            ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        Wrap(
                          spacing: 8, runSpacing: 8,
                          children: [
                            _filterChip(childId, blockedCats, 'games', 'حظر الألعاب'),
                            _filterChip(childId, blockedCats, 'social', 'حظر التواصل'),
                            _filterChip(childId, blockedCats, 'video', 'حظر الفيديو'),
                          ],
