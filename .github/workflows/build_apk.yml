            Widget _headerStat({
              required String label,
              required String value,
              required String unit,
              required IconData icon,
            }) {
              return Column(
                crossAxisAlignment: CrossAxisAlignment.center,
                children: [
                  Icon(icon, color: kBlack, size: 20),
                  const SizedBox(height: 4),
                  Text(label,
                      style: const TextStyle(fontSize: 11, color: kBlack, fontWeight: FontWeight.w500)),
                  const SizedBox(height: 2),
                  Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    crossAxisAlignment: CrossAxisAlignment.baseline,
                    textBaseline: TextBaseline.alphabetic,
                    children: [
                      Text(value,
                          style: const TextStyle(
                              fontSize: 22, fontWeight: FontWeight.w900, color: kBlack, fontFamily: 'monospace')),
                      const SizedBox(width: 3),
                      Text(unit, style: const TextStyle(fontSize: 11, color: kBlack, fontWeight: FontWeight.bold)),
                    ],
                  ),
                ],
              );
            }

            Widget _modeChip({
              required String label,
              required IconData icon,
              required bool selected,
              required VoidCallback onTap,
            }) {
              return GestureDetector(
                onTap: onTap,
                child: Container(
                  padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 8),
                  decoration: BoxDecoration(
                    color: selected ? kMandarinOrange : kWhite,
                    borderRadius: BorderRadius.circular(10),
                    border: Border.all(color: selected ? kMandarinOrange : kMidGray, width: 2),
                  ),
                  child: Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      Icon(icon, color: kBlack, size: 16),
                      const SizedBox(width: 6),
                      Text(label,
                          style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: kBlack)),
                    ],
                  ),
                ),
              );
            }

            Widget _buildFuelPumpTunnelTab(
                Map<String, dynamic> w, Map<String, dynamic> cfg, bool ecoMode) {
              final double liveBalanceYer = widget.engine.fuelPumpRealtimeBalanceYer;
              final double sessionSpentYer = widget.engine.currentSessionConsumedYer;
              final double remMb = widget.engine.remainingChunkMb;
              final double usedMb = widget.engine.consumedChunkMb;
              final double portableMb = widget.engine.portableMb;
              final int chunkMaxMb = widget.engine.serverChunkSizeMb;
              final int triggerMb = widget.engine.serverRefillTriggerMb;
              final bool isActive = widget.engine.isVpnActive;
              final bool hasSession = widget.engine.currentSessionId.isNotEmpty;

              final double tankProgress = widget.engine.activeChunkTotalBytes > 0
                  ? (remMb / chunkMaxMb).clamp(0.0, 1.0)
                  : 0.0;

              return SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        color: kWhite,
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(
                          color: isActive ? kMandarinOrange : kMidGray,
                          width: 3,
                        ),
                        boxShadow: isActive
                            ? [BoxShadow(color: kMandarinOrange.withOpacity(0.25), blurRadius: 16, offset: const Offset(0, 6))]
                            : null,
                      ),
                      child: Column(
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Row(
                                children: [
                                  Container(
                                    padding: const EdgeInsets.all(8),
                                    decoration: BoxDecoration(
                                      color: isActive ? kSuccess.withOpacity(0.15) : kLightGray,
                                      shape: BoxShape.circle,
                                    ),
                                    child: Icon(
                                      Icons.local_gas_station,
                                      color: isActive ? kSuccess : kSoftGray,
                                      size: 22,
                                    ),
                                  ),
                                  const SizedBox(width: 10),
                                  Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        isActive ? "العداد يعمل" : "العداد متوقف",
                                        style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: kBlack),
                                      ),
                                      Text(
                                        isActive ? "متصل بالشبكة" : "غير متصل",
                                        style: TextStyle(
                                          fontSize: 11,
                                          color: isActive ? kSuccess : kSoftGray,
                                          fontWeight: FontWeight.bold,
