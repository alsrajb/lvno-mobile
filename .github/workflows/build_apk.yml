            Widget _buildTrafficSourceCard(String myId) {
              final db = FirebaseFirestore.instance;
              return StreamBuilder<QuerySnapshot>(
                stream: db
                    .collection('transactions')
                    .where('wallet_id', isEqualTo: myId)
                    .where('type', whereIn: ['portable_purchase', 'consumption'])
                    .orderBy('timestamp', descending: true)
                    .limit(10)
                    .snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || snap.data!.docs.isEmpty) {
                    return Container(
                      padding: const EdgeInsets.all(16),
                      margin: const EdgeInsets.only(bottom: 16),
                      decoration: BoxDecoration(
                        color: kLightGray,
                        borderRadius: BorderRadius.circular(16),
                        border: Border.all(color: kMidGray),
                      ),
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              Icon(Icons.route, color: kMandarinOrange, size: 20),
                              SizedBox(width: 8),
                              Text("سجل العمليات",
                                  style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: kBlack)),
                            ],
                          ),
                          SizedBox(height: 8),
                          Text("لا توجد عمليات بعد",
                              style: TextStyle(fontSize: 12, color: kSoftGray)),
                        ],
                      ),
                    );
                  }

                  final docs = snap.data!.docs;
                  return Container(
                    padding: const EdgeInsets.all(16),
                    margin: const EdgeInsets.only(bottom: 16),
                    decoration: BoxDecoration(
                      color: kWhite,
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(color: kMandarinOrange, width: 2),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Row(
                          children: [
                            Icon(Icons.route, color: kMandarinOrange, size: 20),
                            SizedBox(width: 8),
                            Text("آخر العمليات",
                                style: TextStyle(fontWeight: FontWeight.bold, fontSize: 14, color: kBlack)),
                          ],
                        ),
                        const SizedBox(height: 10),
                        ...docs.map((doc) => _buildTxRow(doc.data() as Map<String, dynamic>)),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _buildTxRow(Map<String, dynamic> tx) {
              final String type = (tx['type'] ?? '').toString();
              final bool isPurchase = type == 'portable_purchase';
              final int mb = ((tx['chunk_mb'] ?? tx['mb_delta'] ?? 0) as num).toInt();
              final int cost = ((tx['chunk_cost_yer'] ?? tx['mb_cost_yer'] ?? 0) as num).toInt();
              final String src = (tx['data_source'] ?? 'host_wan').toString();
              final bool fromMyPort = src == 'my_port';
              final String trigger = (tx['trigger'] ?? '').toString();
              final DateTime? ts = (tx['timestamp'] as Timestamp?)?.toDate();
              final String timeStr = ts != null
                  ? "${ts.day}/${ts.month} ${ts.hour.toString().padLeft(2, '0')}:${ts.minute.toString().padLeft(2, '0')}"
                  : "--";

              return Container(
                margin: const EdgeInsets.only(bottom: 8),
                padding: const EdgeInsets.all(10),
                decoration: BoxDecoration(
                  color: isPurchase ? kMandarinOrange.withOpacity(0.08) : kLightGray,
                  borderRadius: BorderRadius.circular(10),
                  border: Border.all(
                    color: isPurchase ? kMandarinOrange.withOpacity(0.3) : kMidGray,
                  ),
                ),
                child: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.all(6),
                      decoration: BoxDecoration(
                        color: isPurchase ? kMandarinOrange : kSuccess.withOpacity(0.15),
                        borderRadius: BorderRadius.circular(6),
                      ),
                      child: Icon(
                        isPurchase ? Icons.shopping_cart : Icons.downloading,
                        size: 14,
                        color: isPurchase ? kBlack : kSuccess,
                      ),
                    ),
                    const SizedBox(width: 8),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            isPurchase ? "شراء $mb MB" : "استهلاك $mb MB",
                            style: const TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: kBlack),
                          ),
                          Text(
                            trigger.isNotEmpty ? trigger : timeStr,
                            style: const TextStyle(fontSize: 9, color: kSoftGray),
                          ),
                        ],
                      ),
                    ),
                    if (!isPurchase)
                      Container(
                        margin: const EdgeInsets.only(left: 6),
                        padding: const EdgeInsets.symmetric(horizontal: 6, vertical: 2),
                        decoration: BoxDecoration(
                          color: fromMyPort ? kMandarinOrange : kSuccess,
                          borderRadius: BorderRadius.circular(4),
                        ),
                        child: Text(
                          fromMyPort ? "منفذي" : "شبكة",
                          style: const TextStyle(fontSize: 8, color: kBlack, fontWeight: FontWeight.bold),
                        ),
                      ),
                    const SizedBox(width: 6),
                    Text("$cost ر",
                        style: const TextStyle(
                            fontSize: 12, color: kMandarinOrange, fontWeight: FontWeight.w900)),
                  ],
                ),
              );
            }

