            Widget _buildChildCard(String childId) {
              final db = FirebaseFirestore.instance;
              final localName = (_localContacts[childId] ?? "جهاز #$childId").toString();

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('wallets').doc(childId).snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || !snap.data!.exists) return const SizedBox.shrink();
                  final c = snap.data!.data() as Map<String, dynamic>;
                  final bool locked = (c['parental_locked'] ?? false) == true;
                  final bool childEco = (c['eco_mode'] ?? false) == true;
                  final List blockedCats = (c['blocked_categories'] as List?) ?? [];

                  return Container(
                    margin: const EdgeInsets.only(bottom: 12),
                    padding: const EdgeInsets.all(14),
                    decoration: BoxDecoration(
                      color: kDarkCard,
                      borderRadius: BorderRadius.circular(14),
                      border: Border.all(color: const Color(0xFF334155)),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        SwitchListTile(
                          activeColor: kMandarinOrange,
                          title: Text("$localName (#$childId)"),
                          subtitle: Text(locked ? "مقفل حالياً" : "مسموح بالاستخدام"),
                          value: !locked,
                          onChanged: (allow) => db.collection('wallets').doc(childId).update({'parental_locked': !allow}),
                        ),
                        SwitchListTile(
                          activeColor: kMandarinOrange,
                          title: const Text("فرض الوضع الاقتصادي"),
                          value: childEco,
                          onChanged: (v) => db.collection('wallets').doc(childId).update({'eco_mode': v}),
                        ),
                        const Padding(
                          padding: EdgeInsets.symmetric(horizontal: 16, vertical: 4),
                          child: Text("حظر الفئات عبر DNS المحلي:", style: TextStyle(fontSize: 12, color: Colors.white70)),
                        ),
                        Padding(
                          padding: const EdgeInsets.symmetric(horizontal: 12),
                          child: Wrap(
                            spacing: 8,
                            children: [
                              _catChip(childId, blockedCats, 'games', 'الألعاب'),
                              _catChip(childId, blockedCats, 'social', 'التواصل'),
                              _catChip(childId, blockedCats, 'video', 'الفيديو'),
                            ],
                          ),
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _catChip(String childId, List cats, String key, String label) {
              final bool selected = cats.contains(key);
              return FilterChip(
                label: Text(label),
                selected: selected,
                selectedColor: kMandarinOrange,
                labelStyle: TextStyle(color: selected ? Colors.black : Colors.white, fontWeight: FontWeight.bold),
                onSelected: (val) {
                  final next = List<String>.from(cats.map((e) => e.toString()));
                  val ? next.add(key) : next.remove(key);
                  FirebaseFirestore.instance.collection('wallets').doc(childId).update({'blocked_categories': next});
                },
              );
            }

