          main_clean = main_clean.replace("__API_KEY__", api_key).replace("__APP_ID__", app_id).replace("__SENDER_ID__", sender_id).replace("__PROJECT_ID__", project_id)
          open("lib/main.dart", "w", encoding="utf-8").write(main_clean)
          print("PART3_DONE_MAIN_DART_READY")
          
          for app_g in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(app_g):
                  txt = open(app_g).read()
                  txt = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", txt)
                  txt = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", txt)
                  open(app_g, "w").write(txt)

          # إضافة مستودع mobile_scanner (CameraX requirement)
          for app_g in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(app_g):
                  txt = open(app_g).read()
                  if "minSdkVersion 23" in txt or "minSdk = 23" in txt:
                      pass
                  open(app_g, "w").write(txt)

          print("PART4_DONE_BUILD_CONFIG_READY")

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: LVNO-SmartClient-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
