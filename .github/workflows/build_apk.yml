                            style: TextStyle(
                              fontWeight: FontWeight.bold,
                              fontSize: 14,
                              color: widget.engine.isVpnActive
                                  ? kMandarinOrange
                                  : (widget.engine.isReconnecting ? Colors.amber : Colors.white70),
                            ),
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 12),
                          Container(
                            padding: const EdgeInsets.symmetric(vertical: 10, horizontal: 18),
                            decoration: BoxDecoration(
                              color: kDarkBg,
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(color: kMandarinOrange.withOpacity(0.5)),
                            ),
                            child: Text(
                              "${liveBalanceYer.toStringAsFixed(4)} ريال",
                              style: const TextStyle(fontSize: 32, fontWeight: FontWeight.w900, fontFamily: 'monospace', color: kMandarinOrange),
                            ),
                          ),
                          const SizedBox(height: 12),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              Text("الصرف: ${sessionSpentYer.toStringAsFixed(4)} ريال", style: const TextStyle(color: Colors.amber, fontFamily: 'monospace', fontSize: 12)),
                              Text("مستهلك: ${usedMb.toStringAsFixed(3)} MB", style: const TextStyle(fontFamily: 'monospace', fontSize: 12)),
                              Text("متبقي: ${remMb.toStringAsFixed(3)} MB", style: const TextStyle(color: kMandarinOrange, fontFamily: 'monospace', fontSize: 12)),
                            ],
                          ),
                          const SizedBox(height: 12),
                          LinearProgressIndicator(value: tankProgress, minHeight: 8, backgroundColor: kDarkBg, color: kMandarinOrange),
                          const SizedBox(height: 6),
                          Text("الدفعة: $chunkMaxMb MB | التحقق والتجديد عند: $triggerMb MB", style: const TextStyle(fontSize: 11, color: Colors.white54)),
                          const SizedBox(height: 6),
                          Text(
