            Future<void> _animateTestFuelPump(int mbToConsume) async {
              if (!widget.engine.isVpnActive) return;
              final int stepBytes = (mbToConsume * 1024 * 1024) ~/ 20;
              for (int i = 0; i < 20; i++) {
                await Future.delayed(const Duration(milliseconds: 50));
                widget.engine.activeChunkConsumedBytes += stepBytes;
                if (widget.engine.activeChunkConsumedBytes > widget.engine.activeChunkTotalBytes) {
                  widget.engine.activeChunkConsumedBytes = widget.engine.activeChunkTotalBytes;
                }
                if (mounted) setState(() {});
              }
              await widget.engine.persistQuotaState();
              final int remBytes = widget.engine.activeChunkTotalBytes - widget.engine.activeChunkConsumedBytes;
              int lowWaterMb = widget.engine.serverChunkSizeMb - widget.engine.serverRefillTriggerMb;
              if (lowWaterMb < 5) lowWaterMb = 5;
              if (remBytes <= lowWaterMb * 1024 * 1024 && !widget.engine.isPurchasingChunk && widget.engine.serverCreditBalanceYer > 0) {
                await widget.engine.purchaseQuotaChunkFromServer();
              }
              if (widget.engine.activeChunkTotalBytes - widget.engine.activeChunkConsumedBytes <= 0) {
                await widget.engine.stopSmartConnection(userInitiated: false);
              }
              if (mounted) setState(() {});
            }

