            Future<void> syncDevicePolicyFromWalletDoc(Map<String, dynamic> wData, Map<String, dynamic> cfgData) async {
              ecoMode = (wData['eco_mode'] ?? false) == true;
              serverCreditBalanceYer = ((wData['credit_balance_yer'] ?? 0) as num).toInt();
              currentGbPriceYer = ((cfgData['gb_price_consumer_yer'] ?? 250) as num).toDouble();
              serverChunkSizeMb = ((cfgData['quota_chunk_mb'] ?? 100) as num).toInt();
              serverRefillTriggerMb = ((cfgData['quota_refill_trigger_mb'] ?? 80) as num).toInt();

              final bool locked = (wData['parental_locked'] ?? false) == true;
              final int limitMins = ((wData['daily_time_limit_mins'] ?? 0) as num).toInt();
              final int usedMins = ((wData['used_time_today_mins'] ?? 0) as num).toInt();
              final bool timeExpired = (limitMins > 0 && usedMins >= limitMins);

              final List<dynamic> cats = (wData['blocked_categories'] as List<dynamic>?) ?? [];
              final List<dynamic> customDoms = (wData['custom_blocked_domains'] as List<dynamic>?) ?? [];

              final Set<String> compiledDomains = {};
              for (final c in cats) {
                final list = presetCategoryDomains[c.toString()];
                if (list != null) compiledDomains.addAll(list);
              }
              for (final d in customDoms) {
                if (d.toString().trim().isNotEmpty) compiledDomains.add(d.toString().trim().toLowerCase());
              }

              try {
                await _vpnChannel.invokeMethod('updatePolicy', {
                  'ecoMode': ecoMode,
                  'parentalLocked': locked || timeExpired,
                  'blockedDomains': compiledDomains.toList(),
                });
                if (locked || timeExpired) {
                  await stopSmartConnection();
                }
              } catch (_) {}
            }

            Future<bool> startSmartConnection(Map<String, dynamic> wData, Map<String, dynamic> cfgData) async {
              if ((wData['parental_locked'] ?? false) == true) {
                throw Exception("تم إيقاف الاستخدام مؤقتاً من المشرف العائلي");
              }
              final int limitMins = ((wData['daily_time_limit_mins'] ?? 0) as num).toInt();
              final int usedMins = ((wData['used_time_today_mins'] ?? 0) as num).toInt();
              if (limitMins > 0 && usedMins >= limitMins) {
                throw Exception("انتهى وقت الاستخدام اليومي المخصص لهذا الجهاز");
              }

              final hostCheck = await verifyManualHostActivation(currentHostId, requirePhysicalRouter: true);
              if (hostCheck['ok'] != true) {
                throw Exception(hostCheck['reason'] ?? "لا يمكن تشغيل النفق إلا على شبكة مفعلة");
              }

              await syncDevicePolicyFromWalletDoc(wData, cfgData);

              if ((activeChunkTotalBytes - activeChunkConsumedBytes) <= 512 * 1024) {
                await purchaseQuotaChunkFromServer();
              }

              final ok = await _vpnChannel.invokeMethod<bool>('startVpn', {
                'ecoMode': ecoMode,
              });
              isVpnActive = ok ?? false;
              if (isVpnActive) {
                await _knockMikroTikGateway(unlock: true);
                _startRealtimeFuelPumpLoop();
              }
              notifyListeners();
              return isVpnActive;
            }

            Future<void> stopSmartConnection() async {
              _fuelPumpTimer?.cancel();
              _fuelPumpTimer = null;
              _mikrotikKeepAliveTimer?.cancel();
              _mikrotikKeepAliveTimer = null;
              liveSpeedKbps = 0.0;
              await persistQuotaState();
              await _knockMikroTikGateway(unlock: false);
              try {
                await _vpnChannel.invokeMethod('stopVpn');
              } catch (_) {}
              isVpnActive = false;
              notifyListeners();
            }

            void _startRealtimeFuelPumpLoop() {
              _fuelPumpTimer?.cancel();
              _mikrotikKeepAliveTimer?.cancel();
              _ticksCounter = 0;

              _mikrotikKeepAliveTimer = Timer.periodic(const Duration(seconds: 45), (_) async {
                if (!isVpnActive) return;
                final check = await verifyManualHostActivation(currentHostId, requirePhysicalRouter: true);
                if (check['ok'] != true) {
                  await stopSmartConnection();
                  return;
                }
                await _knockMikroTikGateway(unlock: true);
              });

              _fuelPumpTimer = Timer.periodic(const Duration(milliseconds: 250), (_) async {
                if (!isVpnActive) return;
                try {
                  final int deltaBytes = await _vpnChannel.invokeMethod<int>('pollRealtimeDeltaBytes') ?? 0;
                  _ticksCounter++;

                  if (deltaBytes > 0) {
                    activeChunkConsumedBytes += deltaBytes;
                    liveSpeedKbps = (deltaBytes * 4.0) / 1024.0;
                    if (activeChunkConsumedBytes > activeChunkTotalBytes) {
                      activeChunkConsumedBytes = activeChunkTotalBytes;
                    }
                    notifyListeners();
                  } else {
                    liveSpeedKbps = 0.0;
                  }

                  if (_ticksCounter % 8 == 0) {
                    await persistQuotaState();
                  }

                  final int remainingBytes = activeChunkTotalBytes - activeChunkConsumedBytes;
                  final int lowMarkBytes = ((serverChunkSizeMb - serverRefillTriggerMb).clamp(5, 50)) * 1024 * 1024;

                  if (remainingBytes <= lowMarkBytes && !isPurchasingChunk && serverCreditBalanceYer > 0) {
                    try {
                      await purchaseQuotaChunkFromServer();
                    } catch (_) {}
                  }

                  if (remainingBytes <= 0 && !isPurchasingChunk) {
                    await stopSmartConnection();
                  }
                } catch (_) {}
              });
            }

            Future<void> simulateFastFuelConsumption(int megabytesToConsume) async {
              if (!isVpnActive) {
                throw Exception("شغّل النفق أولاً لترى عداد البنزين يتحرك بالفاصلة العشرية!");
              }
              final int stepBytes = (megabytesToConsume * 1024 * 1024) ~/ 10;
              for (int i = 0; i < 10; i++) {
                await Future.delayed(const Duration(milliseconds: 80));
                activeChunkConsumedBytes += stepBytes;
                if (activeChunkConsumedBytes > activeChunkTotalBytes) {
                  activeChunkConsumedBytes = activeChunkTotalBytes;
                }
                notifyListeners();
              }
              await persistQuotaState();

              final int remainingBytes = activeChunkTotalBytes - activeChunkConsumedBytes;
              final int lowMarkBytes = ((serverChunkSizeMb - serverRefillTriggerMb).clamp(5, 50)) * 1024 * 1024;
              if (remainingBytes <= lowMarkBytes && !isPurchasingChunk && serverCreditBalanceYer > 0) {
                await purchaseQuotaChunkFromServer();
              }
              if (activeChunkTotalBytes - activeChunkConsumedBytes <= 0) {
                await stopSmartConnection();
              }
            }

