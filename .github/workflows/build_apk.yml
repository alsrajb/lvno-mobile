                                    onPressed: () async {
                                      try {
                                        await _engine.sendUsageHeartbeatDirect(extraWanBytes: 800 * 1024 * 1024, extraCacheBytes: 200 * 1024 * 1024);
                                        setState(() => _statusMessage = "✅ تم إرسال نبضة استهلاك (800MB WAN + 200MB Cache) للوحة القيادة!");
