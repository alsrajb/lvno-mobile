              if (mounted) setState(() => _localContacts = map);
            }

            Future<String?> _openQrScannerModal(String title) async {
              final manualCtrl = TextEditingController();
              if (!mounted) return null;
              return await showModalBottomSheet<String>(
                context: context,
                backgroundColor: kWhite,
                isScrollControlled: true,
                shape: const RoundedRectangleBorder(
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                builder: (ctx) => _QrScannerSheet(title: title, manualCtrl: manualCtrl),
              );
            }

            @override
            Widget build(BuildContext context) {
              final db = FirebaseFirestore.instance;
              final myId = widget.engine.walletId;

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('settings').doc('global_config').snapshots(),
                builder: (context, cfgSnap) {
                  final cfg = (cfgSnap.hasData && cfgSnap.data!.exists)
                      ? (cfgSnap.data!.data() as Map<String, dynamic>)
                      : <String, dynamic>{};

                  return StreamBuilder<DocumentSnapshot>(
                    stream: db.collection('wallets').doc(myId).snapshots(),
                    builder: (context, walletSnap) {
                      final w = (walletSnap.hasData && walletSnap.data!.exists)
                          ? (walletSnap.data!.data() as Map<String, dynamic>)
                          : <String, dynamic>{};

                      widget.engine.syncDevicePolicyFromWalletDoc(w, cfg);

                      return AnimatedBuilder(
                        animation: widget.engine,
                        builder: (context, _) {
                          final int cashBal = ((w['cash_balance_yer'] ?? 0) as num).toInt();
                          final bool ecoMode = (w['eco_mode'] ?? false) == true;
                          final bool kyc = (w['kyc_verified'] ?? false) == true;
                          final String fullName = (w['full_name'] ?? '').toString().trim();
                          final List<dynamic> linkedChildren =
                              (w['linked_children'] as List<dynamic>?) ?? [];

                          return Scaffold(
                            backgroundColor: kWhite,
                            appBar: AppBar(
                              title: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(
                                    fullName.isNotEmpty ? fullName : "حساب #$myId",
                                    style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: kBlack),
                                  ),
                                  if (fullName.isNotEmpty)
                                    Text("#$myId",
                                        style: const TextStyle(fontSize: 11, color: kBlack, fontWeight: FontWeight.normal)),
                                ],
                              ),
                              actions: [
                                if (widget.engine.isVpnActive)
                                  Container(
                                    margin: const EdgeInsets.symmetric(vertical: 12, horizontal: 6),
                                    padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 4),
                                    decoration: BoxDecoration(
                                      color: kSuccess,
                                      borderRadius: BorderRadius.circular(12),
                                    ),
                                    child: const Row(
                                      mainAxisSize: MainAxisSize.min,
                                      children: [
                                        Icon(Icons.circle, color: kWhite, size: 8),
                                        SizedBox(width: 4),
                                        Text("نشط",
                                            style: TextStyle(color: kWhite, fontSize: 11, fontWeight: FontWeight.bold)),
                                      ],
                                    ),
                                  ),
                                IconButton(
                                  icon: const Icon(Icons.qr_code_2, color: kBlack),
                                  onPressed: () => _showMyQrSheet(myId),
                                ),
                              ],
                            ),
                            body: Column(
                              children: [
                                if (_feedback.isNotEmpty)
                                  Container(
                                    width: double.infinity,
                                    margin: const EdgeInsets.fromLTRB(16, 12, 16, 0),
                                    padding: const EdgeInsets.all(12),
                                    decoration: BoxDecoration(
                                      color: _feedback.startsWith("⚠️")
                                          ? kDanger.withOpacity(0.1)
                                          : kSuccess.withOpacity(0.1),
                                      borderRadius: BorderRadius.circular(12),
                                      border: Border.all(
                                        color: _feedback.startsWith("⚠️") ? kDanger : kSuccess,
                                      ),
                                    ),
                                    child: Row(
                                      children: [
                                        Expanded(
                                          child: Text(_feedback,
                                              style: const TextStyle(fontSize: 13, color: kBlack, height: 1.4)),
                                        ),
                                        IconButton(
                                          icon: const Icon(Icons.close, size: 18, color: kBlack),
                                          onPressed: () => setState(() => _feedback = ""),
                                        ),
                                      ],
                                    ),
                                  ),
                                Expanded(
                                  child: IndexedStack(
                                    index: _currentTab,
                                    children: [
                                      _buildBalanceAndTransferTab(myId, cashBal, kyc, w, cfg),
                                      _buildFuelPumpTunnelTab(w, cfg, ecoMode),
                                      _buildParentalControlTab(myId, linkedChildren),
                                      _buildContactsAndHostWalletTab(myId, w),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                            bottomNavigationBar: NavigationBar(
                              selectedIndex: _currentTab,
                              onDestinationSelected: (idx) => setState(() => _currentTab = idx),
                              destinations: const [
                                NavigationDestination(
                                  icon: Icon(Icons.account_balance_wallet_outlined, color: kBlack),
                                  selectedIcon: Icon(Icons.account_balance_wallet, color: kMandarinOrange),
                                  label: 'الرصيد',
                                ),
                                NavigationDestination(
                                  icon: Icon(Icons.local_gas_station_outlined, color: kBlack),
                                  selectedIcon: Icon(Icons.local_gas_station, color: kMandarinOrange),
                                  label: 'النفق',
                                ),
                                NavigationDestination(
                                  icon: Icon(Icons.family_restroom_outlined, color: kBlack),
                                  selectedIcon: Icon(Icons.family_restroom, color: kMandarinOrange),
                                  label: 'التحكم',
                                ),
                                NavigationDestination(
                                  icon: Icon(Icons.manage_accounts_outlined, color: kBlack),
                                  selectedIcon: Icon(Icons.manage_accounts, color: kMandarinOrange),
                                  label: 'الإدارة',
                                ),
                              ],
                            ),
                          );
                        },
                      );
                    },
                  );
                },
              );
            }

