                        value: ecoMode,
                        activeColor: const Color(0xFF10B981),
                        onChanged: (val) async {
                          await widget.engine.toggleMyEcoMode(val);
                          setState(() => _feedback = val ? "✅ تم تفعيل الوضع الاقتصادي" : "تم إيقاف الوضع الاقتصادي");
                        },
                      ),
                    ),
                  ],
                ),
              );
            }

