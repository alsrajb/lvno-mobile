            String _feedback = "";
            Map<String, String> _localContacts = {};
            String _searchQuery = "";

            @override
            void initState() {
              super.initState();
              _loadContacts();
            }

            Future<void> _loadContacts() async {
              final map = await widget.engine.getLocalContacts();
              if (mounted) setState(() => _localContacts = map);
            }

            Future<String?> _openQrScannerModal(String title) async {
              final nativeScan = await widget.engine.tryScanQrNative();
              if (nativeScan.trim().isNotEmpty) {
                return nativeScan.trim();
              }
              final manualCtrl = TextEditingController();
              if (!mounted) return null;
              return await showDialog<String>(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: const Color(0xFF1E293B),
                  title: Text(title, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold)),
                  content: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      const Icon(Icons.qr_code_scanner, size: 54, color: Color(0xFF10B981)),
                      const SizedBox(height: 12),
                      TextField(
                        controller: manualCtrl,
                        keyboardType: TextInputType.number,
                        decoration: const InputDecoration(
                          labelText: "أدخل أو الصق رقم الرمز (مثال: 1002)",
                          filled: true,
                          fillColor: Color(0xFF0F172A),
                          border: OutlineInputBorder(),
                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text("إلغاء")),
                    ElevatedButton(
                      onPressed: () => Navigator.pop(ctx, manualCtrl.text.trim()),
                      child: const Text("تأكيد الرمز"),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final db = FirebaseFirestore.instance;
              final myId = widget.engine.walletId;

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('settings').doc('global_config').snapshots(),
                builder: (context, cfgSnap) {
                  final cfg = (cfgSnap.hasData && cfgSnap.data!.exists)
                      ? (cfgSnap.data!.data() as Map<String, dynamic>)
                      : <String, dynamic>{};

                  return StreamBuilder<DocumentSnapshot>(
                    stream: db.collection('wallets').doc(myId).snapshots(),
                    builder: (context, walletSnap) {
                      final w = (walletSnap.hasData && walletSnap.data!.exists)
                          ? (walletSnap.data!.data() as Map<String, dynamic>)
                          : <String, dynamic>{};

                      widget.engine.syncDevicePolicyFromWalletDoc(w, cfg);

                      return AnimatedBuilder(
                        animation: widget.engine,
                        builder: (context, _) {
                          final int cashBal = ((w['cash_balance_yer'] ?? 0) as num).toInt();
                          final bool ecoMode = (w['eco_mode'] ?? false) == true;
                          final bool kyc = (w['kyc_verified'] ?? false) == true;
                          final String fullName = (w['full_name'] ?? '').toString().trim();
                          final List<dynamic> linkedChildren = (w['linked_children'] as List<dynamic>?) ?? [];

                          return Scaffold(
                            appBar: AppBar(
                              backgroundColor: const Color(0xFF0F172A),
                              elevation: 0,
                              title: Text(
                                fullName.isNotEmpty ? "$fullName (#$myId)" : "حساب رقم #$myId",
                                style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 17),
                              ),
                              actions: [
                                IconButton(
                                  icon: const Icon(Icons.qr_code_2, color: Color(0xFF10B981)),
                                  onPressed: () => _showMyQrSheet(myId),
                                ),
                              ],
                            ),
                            body: Column(
                              children: [
                                if (_feedback.isNotEmpty)
                                  Container(
                                    width: double.infinity,
                                    margin: const EdgeInsets.fromLTRB(16, 12, 16, 0),
                                    padding: const EdgeInsets.all(12),
                                    decoration: BoxDecoration(
                                      color: const Color(0xFF064E3B),
                                      borderRadius: BorderRadius.circular(12),
                                    ),
                                    child: Row(
                                      children: [
                                        Expanded(child: Text(_feedback, style: const TextStyle(fontSize: 13))),
                                        IconButton(
                                          icon: const Icon(Icons.close, size: 18),
                                          onPressed: () => setState(() => _feedback = ""),
                                        ),
                                      ],
                                    ),
                                  ),
                                Expanded(
                                  child: IndexedStack(
                                    index: _currentTab,
                                    children: [
                                      _buildBalanceAndTransferTab(myId, cashBal, kyc),
                                      _buildFuelPumpTunnelTab(w, cfg, ecoMode),
                                      _buildParentalControlTab(myId, linkedChildren),
                                      _buildContactsAndHostWalletTab(myId),
                                    ],
                                  ),
                                ),
                              ],
                            ),
                            bottomNavigationBar: NavigationBar(
                              backgroundColor: const Color(0xFF0F172A),
                              selectedIndex: _currentTab,
                              onDestinationSelected: (idx) => setState(() => _currentTab = idx),
                              destinations: const [
                                NavigationDestination(icon: Icon(Icons.account_balance_wallet_outlined), selectedIcon: Icon(Icons.account_balance_wallet), label: 'الرصيد'),
                                NavigationDestination(icon: Icon(Icons.local_gas_station_outlined), selectedIcon: Icon(Icons.local_gas_station), label: 'النفق والعداد'),
                                NavigationDestination(icon: Icon(Icons.family_restroom_outlined), selectedIcon: Icon(Icons.family_restroom), label: 'التحكم'),
                                NavigationDestination(icon: Icon(Icons.manage_accounts_outlined), selectedIcon: Icon(Icons.manage_accounts), label: 'الإدارة'),
                              ],
                            ),
                          );
                        },
                      );
                    },
                  );
                },
              );
            }

