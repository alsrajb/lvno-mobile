name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Complete Project with Native Android VPN Service
        shell: python
        run: |
          import os, shutil, json, subprocess, re

          # 1. الاحتفاظ بملف google-services.json واستخراج مفاتيح Firebase
          gs_data = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  if f.startswith("google-services.json"):
                      full_p = os.path.join(root, f)
                      shutil.copy2(full_p, "/tmp/google-services.json")
                      try:
                          gs_data = json.load(open(full_p))
                      except Exception:
                          pass

          proj_info = gs_data.get("project_info", {})
          project_id = proj_info.get("project_id", "netspay-1f0fc")
          sender_id = proj_info.get("project_number", "000000000000")
          client_list = gs_data.get("client", [{}])
          first_client = client_list[0] if client_list else {}
          app_id = first_client.get("client_info", {}).get("mobilesdk_app_id", "1:000000000000:android:000000000000")
          api_key_list = first_client.get("api_key", [{}])
          api_key = api_key_list[0].get("current_key", "") if api_key_list else ""

          # 2. تنظيف المجلد وإنشاء مشروع أندرويد قياسي نظيف
          for item in os.listdir("."):
              if item not in [".git", ".github"]:
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.lvno", "--project-name", "smartclient", "--platforms=android", "."], check=True)

          if os.path.exists("/tmp/google-services.json"):
              shutil.copy2("/tmp/google-services.json", "android/app/google-services.json")

          # 3. كتابة pubspec.yaml
          pubspec_lines = [
              "name: smartclient",
              "description: LVNO SmartClient Ecosystem",
              "publish_to: 'none'",
              "version: 1.0.3+4",
              "",
              "environment:",
              "  sdk: '>=3.2.0 <4.0.0'",
              "",
              "dependencies:",
              "  flutter:",
              "    sdk: flutter",
              "  firebase_core: ^3.6.0",
              "  firebase_auth: ^5.3.1",
              "  cloud_firestore: ^5.4.4",
              "  http: ^1.2.2",
              "  crypto: ^3.0.5",
              "  qr_flutter: ^4.1.0",
              "",
              "flutter:",
              "  uses-material-design: true"
          ]
          open("pubspec.yaml", "w").write("\n".join(pubspec_lines) + "\n")

          # 4. كتابة كود VpnTunnelService.kt الأصلي للأندرويد
          kt_dir = "android/app/src/main/kotlin/com/lvno/smartclient"
          os.makedirs(kt_dir, exist_ok=True)

          vpn_service_kt = '''package com.lvno.smartclient

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          class VpnTunnelService : VpnService() {
              companion object {
                  val isRunning = AtomicBoolean(false)
                  val wanBytesCount = AtomicLong(0)
                  val cacheBytesCount = AtomicLong(0)
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == "STOP_VPN") {
                      stopVpnTunnel()
                      return START_NOT_STICKY
                  }
                  if (!isRunning.get()) {
                      startVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  try {
                      val builder = Builder()
                          .setSession("LVNO Smart Network")
                          .setMtu(1500)
                          .addAddress("10.88.0.2", 24)
                          .addDnsServer("8.8.8.8")
                          // توجيه شبكتي الكاش والمراقبة عبر النفق مع السماح لبقية التطبيقات بالعمل بسلاسة
                          .addRoute("10.99.99.0", 24)
                          .addRoute("10.88.0.0", 24)

                      vpnInterface = builder.establish()
                      if (vpnInterface != null) {
                          isRunning.set(true)
                          startPacketInspector()
                      }
                  } catch (e: Exception) {
                      isRunning.set(false)
                  }
              }

              private fun startPacketInspector() {
                  workerThread = Thread {
                      val fd = vpnInterface?.fileDescriptor ?: return@Thread
                      val inputStream = FileInputStream(fd)
                      val packet = ByteBuffer.allocate(32767)

                      while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                          try {
                              val length = inputStream.read(packet.array())
                              if (length > 20) {
                                  // قراءة عنوان الوجهة في حزمة IPv4 (البايتات 16 إلى 19)
                                  val b0 = packet.get(16).toInt() and 0xFF
                                  val b1 = packet.get(17).toInt() and 0xFF
                                  val b2 = packet.get(18).toInt() and 0xFF

                                  // إذا كانت الحزمة متجهة إلى شبكة الخازن المحلي 10.99.99.x
                                  if (b0 == 10 && b1 == 99 && b2 == 99) {
                                      cacheBytesCount.addAndGet(length.toLong())
                                  } else {
                                      wanBytesCount.addAndGet(length.toLong())
                                  }
                                  packet.clear()
                              } else {
                                  Thread.sleep(15)
                              }
                          } catch (e: Exception) {
                              break
                          }
                      }
                  }
                  workerThread?.start()
              }

              private fun stopVpnTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try {
                      vpnInterface?.close()
                  } catch (_: Exception) {}
                  vpnInterface = null
                  stopSelf()
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }
          '''
          open(os.path.join(kt_dir, "VpnTunnelService.kt"), "w").write(
              "\n".join(l[10:] if l.startswith("          ") else l for l in vpn_service_kt.splitlines())
          )

          # 5. كتابة MainActivity.kt لربط Flutter مع نافذة صلاحية الـ VPN في أندرويد
          main_activity_kt = '''package com.lvno.smartclient

          import android.app.Activity
          import android.content.Intent
          import android.net.VpnService
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.lvno.smartclient/vpn"
              private val VPN_REQUEST_CODE = 1001
              private var pendingResult: MethodChannel.Result? = null
              private var pendingWalletId: String = "consumer_01"
              private var pendingHostId: String = "host_alhuda_01"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "isVpnRunning" -> {
                              result.success(VpnTunnelService.isRunning.get())
                          }
                          "startVpn" -> {
                              pendingWalletId = call.argument<String>("walletId") ?: "consumer_01"
                              pendingHostId = call.argument<String>("hostId") ?: "host_alhuda_01"

                              val prepareIntent = VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  launchVpnService()
                                  result.success(true)
                              }
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "STOP_VPN"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          "getTrafficStats" -> {
                              val stats = mapOf(
                                  "wanBytes" to VpnTunnelService.wanBytesCount.get(),
                                  "cacheBytes" to VpnTunnelService.cacheBytesCount.get()
                              )
                              result.success(stats)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun launchVpnService() {
                  val serviceIntent = Intent(this, VpnTunnelService::class.java).apply {
                      putExtra("walletId", pendingWalletId)
                      putExtra("hostId", pendingHostId)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.error("VPN_DENIED", "تم رفض صلاحية إنشاء نفق الشبكة", null)
                      }
                      pendingResult = null
                  }
              }
          }
          '''
          open(os.path.join(kt_dir, "MainActivity.kt"), "w").write(
              "\n".join(l[10:] if l.startswith("          ") else l for l in main_activity_kt.splitlines())
          )

          # 6. تحديث AndroidManifest.xml بتصاريح الـ VPN الرسمية
          manifest_xml = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="محفظة نت سباي"
                  android:name="${applicationName}"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VpnTunnelService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>'''
          open("android/app/src/main/AndroidManifest.xml", "w").write(
              "\n".join(l[10:] if l.startswith("          ") else l for l in manifest_xml.splitlines())
          )

          # 7. كتابة محرك SmartClientEngine المتصل بـ MethodChannel الحقيقية
          core_code = '''import 'dart:async';
          import 'package:flutter/services.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class SmartClientEngine {
            String walletId;
            String currentHostId;
            bool isVpnActive = false;

            static const MethodChannel _vpnChannel = MethodChannel('com.lvno.smartclient/vpn');

            SmartClientEngine({required this.walletId, required this.currentHostId});

            Future<void> initializeEngine() async {
              try {
                final status = await _vpnChannel.invokeMethod<bool>('isVpnRunning');
                isVpnActive = status ?? false;
              } catch (_) {
                isVpnActive = false;
              }
            }

            Future<bool> startSmartConnection() async {
              try {
                final ok = await _vpnChannel.invokeMethod<bool>('startVpn', {
                  'walletId': walletId,
                  'hostId': currentHostId,
                });
                isVpnActive = ok ?? false;
                return isVpnActive;
              } catch (e) {
                isVpnActive = false;
                rethrow;
              }
            }

            Future<void> stopSmartConnection() async {
              try {
                await _vpnChannel.invokeMethod('stopVpn');
              } catch (_) {}
              isVpnActive = false;
            }

            Future<Map<String, int>> readNativeTrafficCounters() async {
              try {
                final res = await _vpnChannel.invokeMapMethod<String, dynamic>('getTrafficStats');
                return {
                  'wanBytes': ((res?['wanBytes'] ?? 0) as num).toInt(),
                  'cacheBytes': ((res?['cacheBytes'] ?? 0) as num).toInt(),
                };
              } catch (_) {
                return {'wanBytes': 0, 'cacheBytes': 0};
              }
            }

            Future<Map<String, dynamic>> executeTransferDirect({
              required String receiverId,
              required int amountYer,
            }) async {
              if (receiverId.isEmpty || amountYer <= 0) {
                throw Exception("يرجى إدخال معرف المستلم ومبلغ صحيح");
              }
              final db = FirebaseFirestore.instance;
              final senderRef = db.collection('wallets').doc(walletId);
              final receiverRef = db.collection('wallets').doc(receiverId);

              return await db.runTransaction((tx) async {
                final senderSnap = await tx.get(senderRef);
                final receiverSnap = await tx.get(receiverRef);

                if (!senderSnap.exists) throw Exception("محفظة المرسل غير موجودة");
                if (!receiverSnap.exists) throw Exception("محفظة المستلم غير موجودة");

                final sData = senderSnap.data()!;
                final rData = receiverSnap.data()!;

                final String sRole = (sData['role'] ?? 'consumer').toString();
                final int sBal = ((sData['balance_yer'] ?? 0) as num).toInt();
                final int rBal = ((rData['balance_yer'] ?? 0) as num).toInt();
                final int dailyUsed = ((sData['daily_transferred_today'] ?? 0) as num).toInt();

                final int commission = (sRole == 'agent') ? (amountYer * 0.10).round() : 0;
                final int netDeducted = amountYer - commission;

                if (sBal < netDeducted) {
                  throw Exception("الرصيد غير كافٍ لإتمام العملية");
                }

                tx.update(senderRef, {
                  'balance_yer': sBal - netDeducted,
                  'daily_transferred_today': dailyUsed + amountYer,
                  'updated_at': FieldValue.serverTimestamp(),
                });

                tx.update(receiverRef, {
                  'balance_yer': rBal + amountYer,
                  'updated_at': FieldValue.serverTimestamp(),
                });

                final txRef = db.collection('transactions').doc();
                tx.set(txRef, {
                  'sender_id': walletId,
                  'receiver_id': receiverId,
                  'sender_role': sRole,
                  'gross_amount_yer': amountYer,
                  'agent_commission_yer': commission,
                  'net_deducted_yer': netDeducted,
                  'timestamp': FieldValue.serverTimestamp(),
                });

                return {
                  'net_deducted_yer': netDeducted,
                  'agent_commission_yer': commission,
                };
              });
            }

            Future<void> sendUsageHeartbeatDirect({
              required int extraWanBytes,
              required int extraCacheBytes,
            }) async {
              final db = FirebaseFirestore.instance;
              final double wanMb = extraWanBytes / (1024 * 1024);
              final double cacheMb = extraCacheBytes / (1024 * 1024);
              final double totalMb = wanMb + cacheMb;

              final int consumerChargeYer = (totalMb * 0.25).round();
              final int hostCreditYer = (wanMb * 0.195).round();
              final int adminSecretProfitYer = consumerChargeYer - hostCreditYer;

              final batch = db.batch();
              final wRef = db.collection('wallets').doc(walletId);
              final hRef = db.collection('hosts').doc(currentHostId);
              final sRef = db.collection('admin_secret_vault').doc(currentHostId);

              batch.set(wRef, {
                'balance_yer': FieldValue.increment(-consumerChargeYer),
                'updated_at': FieldValue.serverTimestamp(),
              }, SetOptions(merge: true));

              batch.set(hRef, {
                'current_month_wan_mb': FieldValue.increment(wanMb),
                'amount_due_yer': FieldValue.increment(hostCreditYer),
                'last_heartbeat': FieldValue.serverTimestamp(),
              }, SetOptions(merge: true));

              batch.set(sRef, {
                'host_id': currentHostId,
                'wan_mb_visible_to_host': FieldValue.increment(wanMb),
                'local_cache_mb_secret': FieldValue.increment(cacheMb),
                'total_charged_to_consumers_yer': FieldValue.increment(consumerChargeYer),
                'host_payout_yer': FieldValue.increment(hostCreditYer),
                'net_admin_profit_yer': FieldValue.increment(adminSecretProfitYer),
                'updated_at': FieldValue.serverTimestamp(),
              }, SetOptions(merge: true));

              await batch.commit();
            }
          }
          '''
          open("lib/smart_client_core.dart", "w").write(
              "\n".join(l[10:] if l.startswith("          ") else l for l in core_code.splitlines())
          )

          # 8. كتابة main.dart
          main_code = '''import 'package:flutter/material.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:firebase_auth/firebase_auth.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:qr_flutter/qr_flutter.dart';
          import 'smart_client_core.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const LvnoUnifiedWalletApp());
          }

          class LvnoUnifiedWalletApp extends StatelessWidget {
            const LvnoUnifiedWalletApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'محفظة نت سباي',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0B1120),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF10B981),
                    secondary: Color(0xFF3B82F6),
                  ),
                ),
                home: const Directionality(
                  textDirection: TextDirection.rtl,
                  child: SafeBootScreen(),
                ),
              );
            }
          }

          class SafeBootScreen extends StatefulWidget {
            const SafeBootScreen({super.key});

            @override
            State<SafeBootScreen> createState() => _SafeBootScreenState();
          }

          class _SafeBootScreenState extends State<SafeBootScreen> {
            bool _isReady = false;
            String? _errorMsg;

            static const String _apiKey = "__API_KEY__";
            static const String _appId = "__APP_ID__";
            static const String _senderId = "__SENDER_ID__";
            static const String _projectId = "__PROJECT_ID__";

            @override
            void initState() {
              super.initState();
              _initCloud();
            }

            Future<void> _initCloud() async {
              try {
                if (Firebase.apps.isEmpty) {
                  if (_apiKey.isNotEmpty) {
                    await Firebase.initializeApp(
                      options: const FirebaseOptions(
                        apiKey: _apiKey,
                        appId: _appId,
                        messagingSenderId: _senderId,
                        projectId: _projectId,
                      ),
                    ).timeout(const Duration(seconds: 15));
                  } else {
                    await Firebase.initializeApp().timeout(const Duration(seconds: 15));
                  }
                }
                try {
                  if (FirebaseAuth.instance.currentUser == null) {
                    await FirebaseAuth.instance.signInAnonymously().timeout(const Duration(seconds: 10));
                  }
                } catch (_) {}
                if (mounted) setState(() => _isReady = true);
              } catch (e) {
                if (mounted) setState(() => _errorMsg = e.toString());
              }
            }

            @override
            Widget build(BuildContext context) {
              if (_errorMsg != null) {
                return Scaffold(
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.wifi_off_rounded, color: Colors.amber, size: 56),
                          const SizedBox(height: 16),
                          const Text("تنبيه اتصال بالسحابة", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 10),
                          Text(_errorMsg!, textAlign: TextAlign.center, style: const TextStyle(fontSize: 12, color: Colors.white70)),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            onPressed: () {
                              setState(() => _errorMsg = null);
                              _initCloud();
                            },
                            child: const Text("إعادة المحاولة"),
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }
              if (!_isReady) {
                return const Scaffold(
                  body: Center(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        CircularProgressIndicator(color: Color(0xFF10B981)),
                        SizedBox(height: 16),
                        Text("جاري فتح محفظة نت سباي...", style: TextStyle(fontSize: 15)),
                      ],
                    ),
                  ),
                );
              }
              return const WalletDashboardScreen();
            }
          }

          class WalletDashboardScreen extends StatefulWidget {
            const WalletDashboardScreen({super.key});

            @override
            State<WalletDashboardScreen> createState() => _WalletDashboardScreenState();
          }

          class _WalletDashboardScreenState extends State<WalletDashboardScreen> {
            String activeWalletId = "consumer_01";
            String activeHostId = "host_alhuda_01";
            late SmartClientEngine _engine;
            final TextEditingController _receiverCtrl = TextEditingController(text: "consumer_01");
            final TextEditingController _amountCtrl = TextEditingController(text: "1000");
            String _statusMessage = "";

            @override
            void initState() {
              super.initState();
              _engine = SmartClientEngine(walletId: activeWalletId, currentHostId: activeHostId);
              _engine.initializeEngine().then((_) {
                if (mounted) setState(() {});
              });
            }

            void _switchDemoProfile(String newWalletId) {
              setState(() {
                activeWalletId = newWalletId;
                _engine.walletId = newWalletId;
                _statusMessage = "تم التبديل إلى حساب: $newWalletId";
              });
            }

            @override
            Widget build(BuildContext context) {
              final db = FirebaseFirestore.instance;
              return Scaffold(
                appBar: AppBar(
                  backgroundColor: const Color(0xFF0F172A),
                  title: const Text('محفظة نت سباي الموحدة', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 17)),
                  actions: [
                    PopupMenuButton<String>(
                      icon: const Icon(Icons.switch_account, color: Color(0xFF10B981)),
                      onSelected: _switchDemoProfile,
                      itemBuilder: (context) => const [
                        PopupMenuItem(value: "consumer_01", child: Text("كمستفيد (consumer_01)")),
                        PopupMenuItem(value: "agent_01", child: Text("كبقال 10% (agent_01)")),
                        PopupMenuItem(value: "dist_01", child: Text("كموزع (dist_01)")),
                      ],
                    ),
                  ],
                ),
                body: StreamBuilder<DocumentSnapshot>(
                  stream: db.collection('wallets').doc(activeWalletId).snapshots(),
                  builder: (context, snapshot) {
                    Map<String, dynamic> wallet = {
                      'display_name': activeWalletId,
                      'role': activeWalletId.startsWith('agent') ? 'agent' : (activeWalletId.startsWith('dist') ? 'distributor' : 'consumer'),
                      'balance_yer': 5000,
                      'daily_transferred_today': 0,
                    };
                    if (snapshot.hasData && snapshot.data != null && snapshot.data!.exists) {
                      wallet = snapshot.data!.data() as Map<String, dynamic>;
                    }
                    final String role = (wallet['role'] ?? 'consumer').toString();
                    final int balance = ((wallet['balance_yer'] ?? 0) as num).toInt();
                    final int dailyUsed = ((wallet['daily_transferred_today'] ?? 0) as num).toInt();

                    return SingleChildScrollView(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          Container(
                            padding: const EdgeInsets.all(20),
                            decoration: BoxDecoration(
                              gradient: const LinearGradient(colors: [Color(0xFF065F46), Color(0xFF0F172A)]),
                              borderRadius: BorderRadius.circular(20),
