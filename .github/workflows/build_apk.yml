            Widget _buildChildControlCard(String childId) {
              final db = FirebaseFirestore.instance;
              final localName = _localContacts[childId] ?? "جهاز #$childId";

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('wallets').doc(childId).snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || !snap.data!.exists) return const SizedBox.shrink();
                  final c = snap.data!.data() as Map<String, dynamic>;
                  final bool locked = (c['parental_locked'] ?? false) == true;
                  final bool childEco = (c['eco_mode'] ?? false) == true;
                  final List<String> blockedCats = List<String>.from((c['blocked_categories'] as List<dynamic>?) ?? []);

                  return Container(
                    margin: const EdgeInsets.only(bottom: 14),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(16)),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          mainAxisAlignment: MainAxisAlignment.spaceBetween,
                          children: [
                            Text("$localName (#$childId)", style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Color(0xFF6EE7B7))),
                            Switch(
                              value: !locked,
                              onChanged: (allow) => db.collection('wallets').doc(childId).update({'parental_locked': !allow}),
                            ),
                          ],
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          dense: true,
                          title: const Text("فرض الوضع الاقتصادي"),
                          value: childEco,
                          onChanged: (v) => db.collection('wallets').doc(childId).update({'eco_mode': v}),
                        ),
                        Wrap(
                          spacing: 8,
                          children: [
                            FilterChip(
                              label: const Text("حظر الألعاب"),
                              selected: blockedCats.contains('games'),
                              onSelected: (sel) {
                                final next = List<String>.from(blockedCats);
                                sel ? next.add('games') : next.remove('games');
                                db.collection('wallets').doc(childId).update({'blocked_categories': next});
                              },
                            ),
                            FilterChip(
                              label: const Text("حظر التواصل"),
                              selected: blockedCats.contains('social'),
                              onSelected: (sel) {
                                final next = List<String>.from(blockedCats);
                                sel ? next.add('social') : next.remove('social');
                                db.collection('wallets').doc(childId).update({'blocked_categories': next});
                              },
                            ),
                            FilterChip(
                              label: const Text("حظر الفيديو"),
                              selected: blockedCats.contains('video'),
                              onSelected: (sel) {
                                final next = List<String>.from(blockedCats);
                                sel ? next.add('video') : next.remove('video');
                                db.collection('wallets').doc(childId).update({'blocked_categories': next});
                              },
                            ),
                          ],
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _buildContactsAndHostWalletTab(String myId) {
              final idCtrl = TextEditingController();
              final nameCtrl = TextEditingController();
              final db = FirebaseFirestore.instance;

              return SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    StreamBuilder<QuerySnapshot>(
                      stream: db.collection('hosts').where('owner_wallet_id', isEqualTo: myId).snapshots(),
                      builder: (context, hostSnap) {
                        if (!hostSnap.hasData || hostSnap.data!.docs.isEmpty) return const SizedBox.shrink();
                        final List<Widget> cards = [];
                        for (final doc in hostSnap.data!.docs) {
                          final h = doc.data() as Map<String, dynamic>;
                          final String hostId = doc.id;
                          final String netName = (h['network_name'] ?? hostId).toString();
                          final int dueYer = ((h['amount_due_yer'] ?? 0) as num).toInt();
                          final num wanMb = (h['current_month_wan_mb'] ?? 0) as num;
                          final bool autoTransfer = (h['auto_transfer_to_wallet'] ?? false) == true;

                          cards.add(
                            Container(
                              margin: const EdgeInsets.only(bottom: 16),
                              padding: const EdgeInsets.all(16),
                              decoration: BoxDecoration(color: const Color(0xFF1E3A8A), borderRadius: BorderRadius.circular(18)),
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text("📡 مستحقات شبكتي: $netName", style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15)),
                                  const SizedBox(height: 6),
                                  Text("إجمالي الدفعات المباعة: ${wanMb.toStringAsFixed(0)} MB", style: const TextStyle(fontSize: 12, color: Colors.white70)),
                                  Text("الرصيد المتاح للسحب: $dueYer ريال", style: const TextStyle(fontSize: 18, fontWeight: FontWeight.bold, color: Colors.amber)),
                                  SwitchListTile(
                                    contentPadding: EdgeInsets.zero,
                                    dense: true,
                                    title: const Text("تحويل المستحقات تلقائياً إلى محفظتي", style: TextStyle(fontSize: 13)),
                                    value: autoTransfer,
                                    onChanged: (val) async {
                                      await widget.engine.toggleHostAutoTransfer(hostId, val);
                                      setState(() => _feedback = val ? "✅ تم تفعيل التحويل التلقائي" : "تم ضبط السحب يدوياً");
                                    },
                                  ),
                                  ElevatedButton(
                                    onPressed: dueYer > 0
                                        ? () async {
                                            try {
                                              final pulled = await widget.engine.withdrawHostEarningsToMyWallet(hostId);
                                              setState(() => _feedback = "✅ تم سحب $pulled ريال إلى رصيدك النقدي");
                                            } catch (e) {
                                              setState(() => _feedback = "⚠️ ${e.toString().replaceAll('Exception: ', '')}");
                                            }
                                          }
                                        : null,
                                    child: const Text("سحب المستحقات الآن إلى الرصيد النقدي"),
                                  ),
                                ],
                              ),
                            ),
                          );
                        }
                        return Column(crossAxisAlignment: CrossAxisAlignment.stretch, children: cards);
                      },
                    ),
                    Container(
                      padding: const EdgeInsets.all(16),
                      decoration: BoxDecoration(color: const Color(0xFF1E293B), borderRadius: BorderRadius.circular(16)),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          const Text("حفظ جهة في القائمة المحلية", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                          const SizedBox(height: 10),
