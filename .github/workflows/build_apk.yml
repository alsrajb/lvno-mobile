            Future<Map<String, dynamic>> executeUnifiedTransfer({
              required String receiverId,
              required int amountYer,
              required String transferMode,
            }) async {
              final cleanReceiver = receiverId.replaceAll('LINK:', '').trim();
              if (cleanReceiver.isEmpty || amountYer <= 0) {
                throw Exception("يرجى إدخال رقم حساب صحيح ومبلغ أكبر من صفر");
              }
              if (cleanReceiver == walletId && transferMode == 'cash') {
                throw Exception("لتحويل النقد إلى رصيد استخدام لنفس حسابك، اختر (رصيد استخدام)");
              }

              final db = FirebaseFirestore.instance;
              final senderRef = db.collection('wallets').doc(walletId);
              final receiverRef = db.collection('wallets').doc(cleanReceiver);
              final configRef = db.collection('settings').doc('global_config');

              final result = await db.runTransaction((tx) async {
                final senderSnap = await tx.get(senderRef);
                final receiverSnap = await tx.get(receiverRef);
                final configSnap = await tx.get(configRef);

                if (!senderSnap.exists) throw Exception("حساب المرسل غير مسجل");
                if (!receiverSnap.exists) throw Exception("الحساب المستلم ($cleanReceiver) غير موجود");

                final sData = senderSnap.data()!;
                final rData = receiverSnap.data()!;
                final cfg = configSnap.data() ?? {};

                final double senderDiscPct = ((cfg['credit_sender_discount_pct'] ?? 7.0) as num).toDouble();
                final double receiverBonusPct = ((cfg['credit_receiver_bonus_pct'] ?? 3.0) as num).toDouble();
                final int genMaxBal = ((cfg['general_tier_max_balance_yer'] ?? 10000) as num).toInt();
                final int genDailyLim = ((cfg['general_tier_daily_limit_yer'] ?? 5000) as num).toInt();

                final int sCash = ((sData['cash_balance_yer'] ?? 0) as num).toInt();
                final int sDailyUsed = ((sData['daily_transferred_today'] ?? 0) as num).toInt();
                final String sTier = (sData['tier'] ?? 'general').toString();
                final bool sKyc = (sData['kyc_verified'] ?? false) == true;

                final int rCash = ((rData['cash_balance_yer'] ?? 0) as num).toInt();
                final int rCredit = ((rData['credit_balance_yer'] ?? 0) as num).toInt();
                final String rTier = (rData['tier'] ?? 'general').toString();
                final bool rKyc = (rData['kyc_verified'] ?? false) == true;
                final String rOfficialName = (rData['full_name'] ?? '').toString().trim();

                final int senderDailyMax = (sTier == 'custom' && sKyc)
                    ? ((sData['custom_daily_limit_yer'] ?? genDailyLim) as num).toInt()
                    : genDailyLim;

                final int receiverMaxHolding = (rTier == 'custom' && rKyc)
                    ? ((rData['custom_max_balance_yer'] ?? genMaxBal) as num).toInt()
                    : genMaxBal;

                if (sDailyUsed + amountYer > senderDailyMax) {
                  throw Exception("تجاوزت السقف اليومي المتاح ($senderDailyMax ريال)");
                }

                int netCashDeductedFromSender = amountYer;
                int senderDiscountEarned = 0;
                int receiverBonusAdded = 0;
                int finalCreditAddedToReceiver = 0;

                if (transferMode == 'cash') {
                  if (sCash < amountYer) throw Exception("الرصيد النقدي غير كافٍ");
                  if (rCash + rCredit + amountYer > receiverMaxHolding) {
                    throw Exception("حساب المستلم سيتجاوز السقف المسموح له ($receiverMaxHolding ريال)");
                  }
                  tx.update(senderRef, {
                    'cash_balance_yer': sCash - amountYer,
                    'daily_transferred_today': sDailyUsed + amountYer,
                    'updated_at': FieldValue.serverTimestamp(),
                  });
                  tx.update(receiverRef, {
                    'cash_balance_yer': rCash + amountYer,
                    'updated_at': FieldValue.serverTimestamp(),
                  });
                } else {
                  senderDiscountEarned = (amountYer * (senderDiscPct / 100.0)).round();
                  netCashDeductedFromSender = amountYer - senderDiscountEarned;
                  receiverBonusAdded = (amountYer * (receiverBonusPct / 100.0)).round();
                  finalCreditAddedToReceiver = amountYer + receiverBonusAdded;

                  if (sCash < netCashDeductedFromSender) {
                    throw Exception("الرصيد النقدي غير كافٍ. المطلوب: $netCashDeductedFromSender ريال");
                  }

                  if (walletId == cleanReceiver) {
                    final int newTotal = (sCash - netCashDeductedFromSender) + rCredit + finalCreditAddedToReceiver;
