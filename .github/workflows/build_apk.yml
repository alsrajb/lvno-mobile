          main_clean = textwrap.dedent(main_code).strip() + "\n"
          main_clean = main_clean.replace("__API_KEY__", api_key).replace("__APP_ID__", app_id).replace("__SENDER_ID__", sender_id).replace("__PROJECT_ID__", project_id)
          with open("lib/main.dart", "w", encoding="utf-8") as mf:
              mf.write(main_clean)
          print("PART5_DONE_MAIN_DART_FULL")

          # ============ GRADLE MODIFICATIONS ============
          for app_g in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(app_g):
                  with open(app_g, "r", encoding="utf-8") as gf:
                      txt = gf.read()
                  txt = re.sub(r"minSdk\s*=?\s*flutter\.minSdkVersion", "minSdk = 23", txt)
                  txt = re.sub(r"minSdkVersion\s+flutter\.minSdkVersion", "minSdkVersion 23", txt)
                  txt = re.sub(r"compileSdk\s*=?\s*flutter\.compileSdkVersion", "compileSdk = 34", txt)
                  txt = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 34", txt)
                  if app_g.endswith(".kts"):
                      if "multiDexEnabled = true" not in txt:
                          txt = txt.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true")
                  else:
                      if "multiDexEnabled true" not in txt:
                          txt = txt.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true")
                  with open(app_g, "w", encoding="utf-8") as gf:
                      gf.write(txt)

          print("PART6_DONE_BUILD_CONFIG_READY")
          print("===========================================")
          print("LVNO SmartClient V10 — All files generated")
          print("===========================================")

