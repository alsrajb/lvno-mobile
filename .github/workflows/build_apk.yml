            Widget _buildTrafficSourceCard(String myId) {
              final db = FirebaseFirestore.instance;
              return StreamBuilder<QuerySnapshot>(
                stream: db.collection('transactions')
                    .where('wallet_id', isEqualTo: myId)
                    .where('type', isEqualTo: 'quota_purchase')
                    .orderBy('timestamp', descending: true)
                    .limit(10)
                    .snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || snap.data!.docs.isEmpty) {
                    return Container(
                      padding: const EdgeInsets.all(16),
                      margin: const EdgeInsets.only(bottom: 16),
                      decoration: BoxDecoration(color: kLightGray, borderRadius: BorderRadius.circular(16), border: Border.all(color: kMidGray)),
                      child: const Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text("سجل مصدر الترافيك", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: kBlack)),
                          SizedBox(height: 8),
                          Text("لا توجد عمليات شراء بعد", style: TextStyle(fontSize: 12, color: kSoftGray)),
                        ],
                      ),
                    );
                  }

                  final docs = snap.data!.docs;
                  return Container(
                    padding: const EdgeInsets.all(16),
                    margin: const EdgeInsets.only(bottom: 16),
                    decoration: BoxDecoration(color: kWhite, borderRadius: BorderRadius.circular(16), border: Border.all(color: kMandarinOrange, width: 1.5)),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        const Row(
                          children: [
                            Icon(Icons.route, color: kMandarinOrange, size: 20),
                            SizedBox(width: 8),
                            Text("سجل مصدر الترافيك", style: TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: kBlack)),
                          ],
                        ),
                        const SizedBox(height: 12),
                        for (final doc in docs) _buildTxRow(doc.data() as Map<String, dynamic>),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _buildTxRow(Map<String, dynamic> tx) {
              final int mb = ((tx['chunk_mb'] ?? 0) as num).toInt();
              final int cost = ((tx['chunk_cost_yer'] ?? 0) as num).toInt();
              final String src = (tx['data_source'] ?? 'host_wan').toString();
              final bool fromMyPort = src == 'my_port';
              final DateTime? ts = (tx['timestamp'] as Timestamp?)?.toDate();
              final String timeStr = ts != null
                  ? "${ts.day}/${ts.month} ${ts.hour.toString().padLeft(2, '0')}:${ts.minute.toString().padLeft(2, '0')}"
                  : "--";

              return Padding(
                padding: const EdgeInsets.symmetric(vertical: 6),
                child: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 4),
                      decoration: BoxDecoration(
                        color: fromMyPort ? kMandarinOrange : kLightGray,
                        borderRadius: BorderRadius.circular(6),
                        border: Border.all(color: fromMyPort ? kMandarinOrange : kMidGray),
                      ),
                      child: Text(
                        fromMyPort ? "منفذي" : "شبكة المالك",
                        style: const TextStyle(fontSize: 10, color: kBlack, fontWeight: FontWeight.bold),
                      ),
                    ),
                    const SizedBox(width: 8),
                    Expanded(child: Text("$mb MB", style: const TextStyle(color: kBlack, fontSize: 13))),
                    Text("$cost ريال", style: const TextStyle(color: kBlack, fontSize: 13, fontWeight: FontWeight.bold)),
                    const SizedBox(width: 8),
                    Text(timeStr, style: const TextStyle(color: kSoftGray, fontSize: 11)),
                  ],
                ),
              );
            }

