                              icon: const Icon(Icons.speed, color: Colors.amber, size: 18),
                              label: const Text("اختبار سحب 25 MB لرؤية حركة الفاصلة والشراء عند 80 MB", style: TextStyle(fontSize: 12)),
                              onPressed: () async {
