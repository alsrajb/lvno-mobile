                      ),
                      child: Column(
                        children: [
                          Text(
                            widget.engine.isVpnActive
                                ? "متصل بشبكة: ${widget.engine.currentHostName} (${widget.engine.liveSpeedKbps.toStringAsFixed(1)} KB/s)"
