name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Clean LVNO V5 (Mandarin Theme + Camera Scanner + Network Lock)
        shell: python
        run: |
          import os, shutil, json, subprocess, re

          gs_data = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  if f.startswith("google-services.json"):
                      full_p = os.path.join(root, f)
                      shutil.copy2(full_p, "/tmp/google-services.json")
                      try:
                          gs_data = json.load(open(full_p))
                      except Exception:
                          pass

          proj_info = gs_data.get("project_info", {})
          project_id = proj_info.get("project_id", "netspay-1f0fc")
          sender_id = proj_info.get("project_number", "000000000000")
          client_list = gs_data.get("client", [{}])
          first_client = client_list[0] if client_list else {}
          app_id = first_client.get("client_info", {}).get("mobilesdk_app_id", "1:000000000000:android:000000000000")
          api_key_list = first_client.get("api_key", [{}])
          api_key = api_key_list[0].get("current_key", "") if api_key_list else ""

          for item in os.listdir("."):
              if item not in [".git", ".github"]:
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.lvno", "--project-name", "smartclient", "--platforms=android", "."], check=True)

          if os.path.exists("test"):
              shutil.rmtree("test")

          if os.path.exists("/tmp/google-services.json"):
              shutil.copy2("/tmp/google-services.json", "android/app/google-services.json")

          def write_clean(path, text):
              lines = [l[10:] if l.startswith("          ") else l for l in text.splitlines()]
              open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")

          pubspec_txt = '''name: smartclient
          description: Unified Commercial Network App V5
          publish_to: 'none'
          version: 5.1.0+15

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.6.0
            firebase_auth: ^5.3.1
            cloud_firestore: ^5.4.4
            http: ^1.2.2
            crypto: ^3.0.5
            qr_flutter: ^4.1.0
            mobile_scanner: ^5.2.3

          flutter:
            uses-material-design: true'''
          write_clean("pubspec.yaml", pubspec_txt)

          kt_dir = "android/app/src/main/kotlin/com/lvno/smartclient"
          os.makedirs(kt_dir, exist_ok=True)

          vpn_kt = '''package com.lvno.smartclient

          import android.content.Intent
          import android.net.TrafficStats
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          class VpnTunnelService : VpnService() {
              companion object {
                  val isRunning = AtomicBoolean(false)
                  val ecoModeEnabled = AtomicBoolean(false)
                  val parentalLocked = AtomicBoolean(false)
                  val tunnelInspectorBytes = AtomicLong(0L)
                  var lastOsTotalBytes: Long = 0L
                  val blockedDomains = ConcurrentHashMap.newKeySet<String>()
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == "STOP_VPN") {
                      stopVpnTunnel()
                      return START_NOT_STICKY
                  }
                  if (action == "UPDATE_POLICY") {
                      intent?.let { safeIntent ->
                          val eco = safeIntent.getBooleanExtra("ecoMode", false)
                          val locked = safeIntent.getBooleanExtra("parentalLocked", false)
                          val blockedList = safeIntent.getStringArrayListExtra("blockedDomains") ?: arrayListOf<String>()
                          ecoModeEnabled.set(eco)
                          parentalLocked.set(locked)
                          blockedDomains.clear()
                          blockedDomains.addAll(blockedList)
                          if (locked) {
                              stopVpnTunnel()
                          }
                      }
                      return START_STICKY
                  }
                  if (!isRunning.get() && !parentalLocked.get()) {
                      val eco = intent?.getBooleanExtra("ecoMode", false) ?: false
                      ecoModeEnabled.set(eco)
                      startVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  try {
                      val rx = TrafficStats.getTotalRxBytes()
                      val tx = TrafficStats.getTotalTxBytes()
                      lastOsTotalBytes = if (rx > 0L && tx > 0L) (rx + tx) else 0L
                      tunnelInspectorBytes.set(0L)

                      val mtuSize = if (ecoModeEnabled.get()) 1280 else 1500
                      val builder = Builder()
                          .setSession("النفق الموحد")
                          .setMtu(mtuSize)
                          .addAddress("10.88.0.2", 24)
                          .addDnsServer("1.1.1.3")
                          .addDnsServer("1.0.0.3")
                          .addRoute("10.99.99.0", 24)
                          .addRoute("10.88.0.0", 24)

                      vpnInterface = builder.establish()
                      if (vpnInterface != null) {
                          isRunning.set(true)
                          startPacketEngine()
                      }
                  } catch (e: Exception) {
                      isRunning.set(false)
                  }
              }

              private fun startPacketEngine() {
                  workerThread = Thread {
                      val fd = vpnInterface?.fileDescriptor ?: return@Thread
                      val inputStream = FileInputStream(fd)
                      val packet = ByteBuffer.allocate(32767)

                      while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                          try {
                              if (parentalLocked.get()) {
                                  stopVpnTunnel()
                                  break
                              }
                              val length = inputStream.read(packet.array())
                              if (length > 20) {
                                  tunnelInspectorBytes.addAndGet(length.toLong())
                                  if (ecoModeEnabled.get() && length > 1100) {
                                      Thread.sleep(6)
                                  }
                                  packet.clear()
                              } else {
                                  Thread.sleep(10)
                              }
                          } catch (e: Exception) {
                              break
                          }
                      }
                  }
                  workerThread?.start()
              }

              private fun stopVpnTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try { vpnInterface?.close() } catch (_: Exception) {}
                  vpnInterface = null
                  stopSelf()
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }'''
          write_clean(os.path.join(kt_dir, "VpnTunnelService.kt"), vpn_kt)

          main_act_kt = '''package com.lvno.smartclient

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.TrafficStats
          import android.net.VpnService
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.net.Inet4Address
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.ArrayList

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.lvno.smartclient/vpn"
              private val VPN_REQUEST_CODE = 1001
              private val QR_REQUEST_CODE = 1002
              private var pendingResult: MethodChannel.Result? = null
              private var pendingQrResult: MethodChannel.Result? = null
              private var pendingEcoMode: Boolean = false

              private fun getCurrentGatewayIp(): String {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val network = cm.activeNetwork ?: return ""
                      val linkProperties = cm.getLinkProperties(network) ?: return ""
                      val routes = linkProperties.routes ?: emptyList()
                      val defaultRoute = routes.firstOrNull { it.isDefaultRoute && it.gateway is Inet4Address }
                      defaultRoute?.gateway?.hostAddress ?: ""
                  } catch (e: Exception) {
                      ""
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val prefs = getSharedPreferences("lvno_local_store", Context.MODE_PRIVATE)
                      when (call.method) {
                          "getDeviceHardwareId" -> {
                              val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown_hw"
                              result.success(androidId)
                          }
                          "getCurrentGatewayIp" -> {
                              Thread {
                                  val gw = getCurrentGatewayIp()
                                  runOnUiThread { result.success(gw) }
                              }.start()
                          }
                          "verifyMikroTikIdentity" -> {
                              val gatewayIp = call.argument<String>("gatewayIp") ?: "192.168.88.1"
                              val customApiPort = call.argument<Int>("customApiPort") ?: 9728
                              Thread {
                                  var isMikroTik = false
                                  var hasSpecialConfig = false
                                  try {
                                      val sock = Socket()
                                      sock.connect(InetSocketAddress(gatewayIp, customApiPort), 1500)
                                      sock.soTimeout = 1500
                                      val input = sock.getInputStream()
                                      val buffer = ByteArray(64)
                                      val bytesRead = input.read(buffer)
                                      if (bytesRead > 0) {
                                          isMikroTik = true
                                          hasSpecialConfig = true
                                      }
                                      sock.close()
                                  } catch (e: Exception) {
                                      isMikroTik = false
                                      hasSpecialConfig = false
                                  }
                                  runOnUiThread {
                                      val map = HashMap<String, Any>()
                                      map["isMikroTik"] = isMikroTik
                                      map["hasSpecialConfig"] = hasSpecialConfig
                                      result.success(map)
                                  }
                              }.start()
                          }
                          "getLocalContactsJson" -> {
                              result.success(prefs.getString("contacts_json", "{}") ?: "{}")
                          }
                          "saveLocalContactsJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("contacts_json", jsonStr).apply()
                              result.success(true)
                          }
                          "getQuotaStateJson" -> {
                              result.success(prefs.getString("quota_state_json", "{}") ?: "{}")
                          }
                          "saveQuotaStateJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("quota_state_json", jsonStr).apply()
                              result.success(true)
                          }
                          "verifyMikroTikHandshake" -> {
                              val gatewayIp = call.argument<String>("gatewayIp") ?: "10.99.99.1"
                              Thread {
                                  var verified = false
                                  try {
                                      val sock = Socket()
                                      sock.connect(InetSocketAddress(gatewayIp, 53), 1200)
                                      sock.close()
                                      verified = true
                                  } catch (_: Exception) {
                                      try {
                                          val s2 = Socket()
                                          s2.connect(InetSocketAddress(gatewayIp, 80), 1200)
                                          s2.close()
                                          verified = true
                                      } catch (_: Exception) {
                                          verified = false
                                      }
                                  }
                                  runOnUiThread { result.success(verified) }
                              }.start()
                          }
                          "scanQrNative" -> {
                              try {
                                  val intent = Intent("com.google.zxing.client.android.SCAN")
                                  intent.putExtra("SCAN_MODE", "QR_CODE_MODE")
                                  pendingQrResult = result
                                  startActivityForResult(intent, QR_REQUEST_CODE)
                              } catch (e: Exception) {
                                  result.success("")
                              }
                          }
                          "isVpnRunning" -> {
                              result.success(VpnTunnelService.isRunning.get())
                          }
                          "pollRealtimeDeltaBytes" -> {
                              if (!VpnTunnelService.isRunning.get()) {
                                  result.success(0)
                                  return@setMethodCallHandler
                              }
                              var delta = VpnTunnelService.tunnelInspectorBytes.getAndSet(0L)
                              val rx = TrafficStats.getTotalRxBytes()
                              val tx = TrafficStats.getTotalTxBytes()
                              if (rx > 0L && tx > 0L) {
                                  val nowTotal = rx + tx
                                  if (VpnTunnelService.lastOsTotalBytes > 0L && nowTotal > VpnTunnelService.lastOsTotalBytes) {
                                      val osDelta = nowTotal - VpnTunnelService.lastOsTotalBytes
                                      if (osDelta > delta) {
                                          delta = osDelta
                                      }
                                  }
                                  VpnTunnelService.lastOsTotalBytes = nowTotal
                              }
                              val safeInt = if (delta > 2000000000L) 2000000000 else delta.toInt()
                              result.success(safeInt)
                          }
                          "startVpn" -> {
                              pendingEcoMode = call.argument<Boolean>("ecoMode") ?: false
                              val prepareIntent = VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  launchVpnService()
                                  result.success(true)
                              }
                          }
                          "updatePolicy" -> {
                              val eco = call.argument<Boolean>("ecoMode") ?: false
                              val locked = call.argument<Boolean>("parentalLocked") ?: false
                              val blocked = call.argument<List<String>>("blockedDomains") ?: emptyList()
                              val intent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "UPDATE_POLICY"
                                  putExtra("ecoMode", eco)
                                  putExtra("parentalLocked", locked)
                                  putStringArrayListExtra("blockedDomains", ArrayList(blocked))
                              }
                              startService(intent)
                              result.success(true)
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "STOP_VPN"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun launchVpnService() {
                  val serviceIntent = Intent(this, VpnTunnelService::class.java).apply {
                      putExtra("ecoMode", pendingEcoMode)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.error("DENIED", "يلزم الموافقة لتفعيل النفق", null)
                      }
                      pendingResult = null
                  } else if (requestCode == QR_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val contents = data.getStringExtra("SCAN_RESULT") ?: ""
                          pendingQrResult?.success(contents)
                      } else {
                          pendingQrResult?.success("")
                      }
                      pendingQrResult = null
                  }
              }
          }'''
          write_clean(os.path.join(kt_dir, "MainActivity.kt"), main_act_kt)

          manifest_xml = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>

              <application
                  android:label="نت سباي"
                  android:name="${applicationName}"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VpnTunnelService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>'''
          write_clean("android/app/src/main/AndroidManifest.xml", manifest_xml)

          print("PART1_DONE_CORE_FILES_READY")
                    core_code = '''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/foundation.dart';
          import 'package:flutter/services.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class SmartClientEngine extends ChangeNotifier {
            String walletId = "";
            String currentHostId;
            bool isVpnActive = false;
            bool ecoMode = false;
            bool isPurchasingChunk = false;
            String lastRouteType = "unknown";
            String lastDataSource = "unknown";

            int activeChunkTotalBytes = 0;
            int activeChunkConsumedBytes = 0;
            double currentChunkPriceYer = 25.0;
            double currentGbPriceYer = 250.0;
            int serverChunkSizeMb = 100;
            int serverRefillTriggerMb = 80;
            int serverCreditBalanceYer = 0;
            double liveSpeedKbps = 0.0;

            Timer? _fuelPumpTimer;
            Timer? _mikrotikKeepAliveTimer;
            int _ticksCounter = 0;

            static const MethodChannel _vpnChannel = MethodChannel('com.lvno.smartclient/vpn');

            static const Map<String, List<String>> presetCategoryDomains = {
              'games': ['roblox.com', 'pubgmobile.com', 'freefiremobile.com', 'epicgames.com', 'steampowered.com', 'supercell.com'],
              'social': ['tiktok.com', 'instagram.com', 'facebook.com', 'snapchat.com', 'twitter.com', 'x.com'],
              'video': ['youtube.com', 'googlevideo.com', 'netflix.com', 'twitch.tv', 'shahid.mbc.net'],
            };

            SmartClientEngine({required this.currentHostId});

            double get remainingChunkMb {
              final rem = activeChunkTotalBytes - activeChunkConsumedBytes;
              if (rem <= 0) return 0.0;
              return rem / (1024.0 * 1024.0);
            }

            double get consumedChunkMb {
              return activeChunkConsumedBytes / (1024.0 * 1024.0);
            }

            double get fuelPumpRealtimeBalanceYer {
              if (activeChunkTotalBytes <= 0) {
                return serverCreditBalanceYer.toDouble();
              }
              final double remRatio = (activeChunkTotalBytes - activeChunkConsumedBytes) / activeChunkTotalBytes;
              final double clampedRatio = remRatio.clamp(0.0, 1.0);
              final double remainingChunkValueYer = clampedRatio * currentChunkPriceYer;
              return serverCreditBalanceYer.toDouble() + remainingChunkValueYer;
            }

            double get currentSessionConsumedYer {
              if (activeChunkTotalBytes <= 0) return 0.0;
              final double usedRatio = (activeChunkConsumedBytes / activeChunkTotalBytes).clamp(0.0, 1.0);
              return usedRatio * currentChunkPriceYer;
            }

            Future<String> getDeviceHardwareId() async {
              try {
                final id = await _vpnChannel.invokeMethod<String>('getDeviceHardwareId');
                return (id != null && id.isNotEmpty) ? id : "dev_default_01";
              } catch (_) {
                return "dev_default_01";
              }
            }

            Future<void> loadSavedQuotaState() async {
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getQuotaStateJson') ?? '{}';
                final Map<String, dynamic> data = jsonDecode(raw);
                activeChunkTotalBytes = ((data['totalBytes'] ?? 0) as num).toInt();
                activeChunkConsumedBytes = ((data['consumedBytes'] ?? 0) as num).toInt();
                currentChunkPriceYer = ((data['chunkPriceYer'] ?? 25.0) as num).toDouble();
                notifyListeners();
              } catch (_) {}
            }

            Future<void> persistQuotaState() async {
              try {
                final payload = jsonEncode({
                  'totalBytes': activeChunkTotalBytes,
                  'consumedBytes': activeChunkConsumedBytes,
                  'chunkPriceYer': currentChunkPriceYer,
                });
                await _vpnChannel.invokeMethod('saveQuotaStateJson', {'json': payload});
              } catch (_) {}
            }

            Future<Map<String, String>> getLocalContacts() async {
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getLocalContactsJson') ?? '{}';
                final Map<String, dynamic> decoded = jsonDecode(raw);
                return decoded.map((k, v) => MapEntry(k, v.toString()));
              } catch (_) {
                return {};
              }
            }

            Future<void> saveLocalContact(String targetId, String aliasName) async {
              if (targetId.trim().isEmpty || aliasName.trim().isEmpty) return;
              try {
                final current = await getLocalContacts();
                current[targetId.trim()] = aliasName.trim();
                await _vpnChannel.invokeMethod('saveLocalContactsJson', {
                  'json': jsonEncode(current),
                });
              } catch (_) {}
            }

            Future<String> tryScanQrNative() async {
              try {
                final res = await _vpnChannel.invokeMethod<String>('scanQrNative');
                return res ?? '';
              } catch (_) {
                return '';
              }
            }

            Future<void> _knockMikroTikGateway({required bool unlock}) async {
              final int targetPort = unlock ? 9981 : 9982;
              try {
                final socket = await Socket.connect(
                  '10.99.99.1',
                  targetPort,
                  timeout: const Duration(milliseconds: 800),
                );
                socket.destroy();
              } catch (_) {}
            }

            Future<Map<String, dynamic>> getHostRoutingConfig() async {
              final db = FirebaseFirestore.instance;
              final hostSnap = await db.collection('hosts').doc(currentHostId).get();
              if (!hostSnap.exists) return {};
              final data = hostSnap.data()!;
              return {
                'use_my_port': (data['use_my_port'] ?? false) == true,
                'my_port_gateway': (data['my_port_gateway'] ?? '').toString(),
                'host_wan_gateway': (data['host_wan_gateway'] ?? '').toString(),
                'routing_preference': (data['routing_preference'] ?? 'host_wan').toString(),
                'my_port_commission_pct': ((data['my_port_commission_pct'] ?? 15.0) as num).toDouble(),
              };
            }

            Future<Map<String, dynamic>> verifyManualHostActivation(String hostId, {bool requirePhysicalRouter = false}) async {
              final db = FirebaseFirestore.instance;
              final hostSnap = await db.collection('hosts').doc(hostId).get();
              if (!hostSnap.exists) {
                return {'ok': false, 'reason': 'هذه الشبكة غير مسجلة في السيرفر'};
              }
              final data = hostSnap.data()!;
              final status = (data['status'] ?? 'inactive').toString();
              final bool manualApproved = (data['manual_admin_approved'] ?? true) == true;
              final String secretCode = (data['activation_secret'] ?? 'MK-LVNO-2026').toString().trim();
              final String expectedGateway = (data['gateway_ip'] ?? '192.168.88.1').toString().trim();

              if (status != 'active' || !manualApproved || secretCode.isEmpty) {
                return {'ok': false, 'reason': 'الشبكة غير مفعلة يدوياً من إدارة النظام'};
              }

              if (requirePhysicalRouter && (data['enforce_physical_router_check'] ?? false) == true) {
                final String currentGateway = await _vpnChannel.invokeMethod<String>('getCurrentGatewayIp') ?? '';
                if (currentGateway.trim() != expectedGateway) {
                  return {
                    'ok': false,
                    'reason': 'أنت غير متصل براوتر الميكروتك المطلوب.\\n'
                              'المتوقع: $expectedGateway\\n'
                              'الحالي: ${currentGateway.isEmpty ? "غير متصل" : currentGateway}'
                  };
                }

                final int customApiPort = ((data['custom_api_port'] ?? 9728) as num).toInt();
                final Map<dynamic, dynamic> idResult = await _vpnChannel.invokeMethod<Map>(
                  'verifyMikroTikIdentity',
                  {'gatewayIp': expectedGateway, 'customApiPort': customApiPort},
                ) ?? {};

                if ((idResult['isMikroTik'] ?? false) != true) {
                  return {'ok': false, 'reason': 'الراوتر المتصل ليس ميكروتيك أو لا يستجيب على منفذ $customApiPort'};
                }
                if ((idResult['hasSpecialConfig'] ?? false) != true) {
                  return {'ok': false, 'reason': 'الميكروتيك لا يحتوي على إعدادات النظام الخاصة (منفذ $customApiPort غير مُعد)'};
                }
              }

              currentHostId = hostId;
              return {'ok': true, 'data': data};
            }

