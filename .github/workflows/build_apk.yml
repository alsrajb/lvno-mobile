            Future<bool> purchaseQuotaChunkFromServer() async {
              if (isPurchasingChunk) return false;
              isPurchasingChunk = true;
              notifyListeners();

              try {
                final routingCfg = await getHostRoutingConfig();
                final String routedVia = (routingCfg['routing_preference'] ?? 'host_wan').toString();
                final String dataSource = routedVia == 'my_port' ? 'my_port' : 'host_wan';
                final double myPct = ((routingCfg['my_port_commission_pct'] ?? 15.0) as num).toDouble();

                final db = FirebaseFirestore.instance;
                final wRef = db.collection('wallets').doc(walletId);
                final hRef = db.collection('hosts').doc(currentHostId);
                final cfgRef = db.collection('settings').doc('global_config');

                final Map<String, dynamic> res = await db.runTransaction((tx) async {
                  final wSnap = await tx.get(wRef);
                  final hSnap = await tx.get(hRef);
                  final cfgSnap = await tx.get(cfgRef);

                  if (!wSnap.exists) throw Exception("الحساب غير موجود");
                  if (!hSnap.exists) throw Exception("الشبكة غير مسجلة");

                  final wData = wSnap.data()!;
                  final hData = hSnap.data()!;
                  final cfg = cfgSnap.data() ?? {};

                  final String ownerWalletId = (hData['owner_wallet_id'] ?? '').toString().trim();
                  final bool autoSettle = (hData['auto_transfer_to_wallet'] ?? false) == true;

                  if ((hData['status'] ?? 'inactive') != 'active' || (hData['manual_admin_approved'] ?? true) != true) {
                    throw Exception("الشبكة غير مفعلة يدوياً من النظام");
                  }

                  final double gbPrice = ((cfg['gb_price_consumer_yer'] ?? 250) as num).toDouble();
                  final int chunkMb = ((cfg['quota_chunk_mb'] ?? 100) as num).toInt();
                  final int triggerMb = ((cfg['quota_refill_trigger_mb'] ?? 80) as num).toInt();
                  final double sysProfitPct = ((cfg['system_profit_pct'] ?? 10.0) as num).toDouble();

                  final double rawChunkPrice = (chunkMb / 1000.0) * gbPrice;
                  final int chunkCostYer = rawChunkPrice.round() < 1 ? 1 : rawChunkPrice.round();

                  final int currentCredit = ((wData['credit_balance_yer'] ?? 0) as num).toInt();
                  if (currentCredit < chunkCostYer) {
                    throw Exception("رصيد الاستخدام ($currentCredit ريال) لا يكفي لشراء دفعة جديدة ($chunkCostYer ريال / $chunkMb ميجا)");
                  }

                  final int myCommissionYer = routedVia == 'my_port'
                      ? chunkCostYer
                      : (chunkCostYer * myPct / 100.0).round();
                  final int hostShareYer = routedVia == 'my_port'
                      ? 0
                      : (chunkCostYer - myCommissionYer);
                  final int sysProfitYer = (chunkCostYer * (sysProfitPct / 100.0)).round();

                  tx.update(wRef, {
                    'credit_balance_yer': currentCredit - chunkCostYer,
                    'updated_at': FieldValue.serverTimestamp(),
                  });

                  if (autoSettle && ownerWalletId.isNotEmpty) {
                    final ownerRef = db.collection('wallets').doc(ownerWalletId);
                    tx.set(ownerRef, {
                      'cash_balance_yer': FieldValue.increment(hostShareYer),
                      'updated_at': FieldValue.serverTimestamp(),
                    }, SetOptions(merge: true));
                    tx.set(hRef, {
                      'current_month_wan_mb': FieldValue.increment(chunkMb),
                      'total_settled_to_wallet_yer': FieldValue.increment(hostShareYer),
                      'last_heartbeat': FieldValue.serverTimestamp(),
                    }, SetOptions(merge: true));
                  } else {
                    tx.set(hRef, {
                      'current_month_wan_mb': FieldValue.increment(chunkMb),
                      'amount_due_yer': FieldValue.increment(hostShareYer),
                      'last_heartbeat': FieldValue.serverTimestamp(),
                    }, SetOptions(merge: true));
                  }

                  final vaultRef = db.collection('admin_secret_vault').doc(currentHostId);
                  tx.set(vaultRef, {
                    'host_id': currentHostId,
                    'wan_mb_visible_to_host': FieldValue.increment(chunkMb),
                    'total_charged_to_consumers_yer': FieldValue.increment(chunkCostYer),
                    'host_payout_yer': FieldValue.increment(hostShareYer),
                    'my_commission_yer': FieldValue.increment(myCommissionYer),
                    'net_admin_profit_yer': FieldValue.increment(sysProfitYer),
                    'updated_at': FieldValue.serverTimestamp(),
                  }, SetOptions(merge: true));

                  final txRec = db.collection('transactions').doc();
                  tx.set(txRec, {
                    'type': 'quota_purchase',
                    'wallet_id': walletId,
                    'host_id': currentHostId,
                    'chunk_mb': chunkMb,
                    'chunk_cost_yer': chunkCostYer,
                    'data_source': dataSource,
                    'routed_via': routedVia,
                    'my_commission_yer': myCommissionYer,
                    'host_share_yer': hostShareYer,
                    'timestamp': FieldValue.serverTimestamp(),
                  });

                  return <String, dynamic>{
                    'chunkMb': chunkMb,
                    'triggerMb': triggerMb,
                    'chunkCostYer': chunkCostYer,
                    'gbPrice': gbPrice,
                    'newServerCredit': currentCredit - chunkCostYer,
                    'routed_via': routedVia,
                    'data_source': dataSource,
                    'my_commission_yer': myCommissionYer,
                    'host_share_yer': hostShareYer,
                  };
                });

                final int addedBytes = ((res['chunkMb'] as num).toInt() * 1024 * 1024);
                final int prevRemainingBytes = (activeChunkTotalBytes - activeChunkConsumedBytes) > 0
                    ? (activeChunkTotalBytes - activeChunkConsumedBytes)
                    : 0;

                activeChunkTotalBytes = prevRemainingBytes + addedBytes;
                activeChunkConsumedBytes = 0;

                serverChunkSizeMb = (res['chunkMb'] as num).toInt();
                serverRefillTriggerMb = (res['triggerMb'] as num).toInt();
                currentGbPriceYer = (res['gbPrice'] as num).toDouble();
                currentChunkPriceYer = (activeChunkTotalBytes / (1024.0 * 1024.0 * 1000.0)) * currentGbPriceYer;
                serverCreditBalanceYer = (res['newServerCredit'] as num).toInt();
                lastRouteType = (res['routed_via'] ?? 'host_network').toString();
                lastDataSource = (res['data_source'] ?? 'host_wan').toString();

                await persistQuotaState();
                isPurchasingChunk = false;
                notifyListeners();
                return true;
              } catch (e) {
                isPurchasingChunk = false;
                notifyListeners();
                rethrow;
              }
            }

            Future<int> withdrawHostEarningsToMyWallet(String hostId) async {
              final db = FirebaseFirestore.instance;
              final hRef = db.collection('hosts').doc(hostId);
              final wRef = db.collection('wallets').doc(walletId);

              return await db.runTransaction((tx) async {
                final hSnap = await tx.get(hRef);
                final wSnap = await tx.get(wRef);
                if (!hSnap.exists) throw Exception("الشبكة غير موجودة");
                if (!wSnap.exists) throw Exception("المحفظة غير موجودة");

                final hData = hSnap.data()!;
                final String ownerId = (hData['owner_wallet_id'] ?? '').toString().trim();
                if (ownerId != walletId) {
                  throw Exception("هذه الشبكة غير مربوطة برقم محفظتك (#$walletId)");
                }

                final int dueYer = ((hData['amount_due_yer'] ?? 0) as num).toInt();
                if (dueYer <= 0) {
                  throw Exception("لا توجد مستحقات معلقة للسحب حالياً");
                }

                tx.update(hRef, {
                  'amount_due_yer': 0,
                  'total_settled_to_wallet_yer': FieldValue.increment(dueYer),
                  'updated_at': FieldValue.serverTimestamp(),
                });

                tx.update(wRef, {
                  'cash_balance_yer': FieldValue.increment(dueYer),
                  'updated_at': FieldValue.serverTimestamp(),
                });

                return dueYer;
              });
            }

