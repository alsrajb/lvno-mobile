            Widget _filterChip(String childId, List<String> cats, String key, String label) {
              return FilterChip(
                label: Text(label, style: const TextStyle(color: kBlack, fontSize: 12)),
                selected: cats.contains(key),
                selectedColor: kMandarinOrange,
                backgroundColor: kLightGray,
                onSelected: (sel) {
                  final next = List<String>.from(cats);
                  sel ? next.add(key) : next.remove(key);
                  FirebaseFirestore.instance.collection('wallets').doc(childId).update({'blocked_categories': next});
                },
              );
            }

