name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate LVNO SmartClient V10 (Full + Security + DNS)
        shell: python
        run: |
          import os, shutil, json, subprocess, re, textwrap

          gs_data = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  if f.startswith("google-services.json"):
                      full_p = os.path.join(root, f)
                      shutil.copy2(full_p, "/tmp/google-services.json")
                      try:
                          with open(full_p, "r", encoding="utf-8") as gf:
                              gs_data = json.load(gf)
                      except Exception:
                          pass

          proj_info = gs_data.get("project_info", {})
          project_id = proj_info.get("project_id", "netspay-1f0fc")
          sender_id = proj_info.get("project_number", "000000000000")
          client_list = gs_data.get("client", [{}])
          first_client = client_list[0] if client_list else {}
          app_id = first_client.get("client_info", {}).get("mobilesdk_app_id", "1:000000000000:android:000000000000")
          api_key_list = first_client.get("api_key", [{}])
          api_key = api_key_list[0].get("current_key", "") if api_key_list else ""

          for item in os.listdir("."):
              if item not in [".git", ".github"]:
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.lvno", "--project-name", "smartclient", "--platforms=android", "."], check=True)

          if os.path.exists("test"):
              shutil.rmtree("test")

          if os.path.exists("/tmp/google-services.json"):
              shutil.copy2("/tmp/google-services.json", "android/app/google-services.json")

          def write_clean(path, text):
              cleaned = textwrap.dedent(text).strip() + "\n"
              with open(path, "w", encoding="utf-8") as f:
                  f.write(cleaned)

          pubspec_txt = '''
          name: smartclient
          description: LVNO SmartClient V10 - Portable Quota + Sessions + Security
          publish_to: 'none'
          version: 6.0.0+20

          environment:
            sdk: '>=3.3.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.6.0
            firebase_auth: ^5.3.1
            cloud_firestore: ^5.4.4
            http: ^1.2.2
            crypto: ^3.0.5
            qr_flutter: ^4.1.0
            mobile_scanner: ^5.2.3

          flutter:
            uses-material-design: true
          '''
          write_clean("pubspec.yaml", pubspec_txt)

          kt_dir = "android/app/src/main/kotlin/com/lvno/smartclient"
          os.makedirs(kt_dir, exist_ok=True)

          vpn_kt = '''
          package com.lvno.smartclient

          import android.content.Intent
          import android.net.TrafficStats
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          class VpnTunnelService : VpnService() {
              companion object {
                  val isRunning = AtomicBoolean(false)
                  val ecoModeEnabled = AtomicBoolean(false)
                  val parentalLocked = AtomicBoolean(false)
                  val tunnelInspectorBytes = AtomicLong(0L)
                  var lastOsTotalBytes: Long = 0L
                  val blockedDomains = ConcurrentHashMap.newKeySet<String>()
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var workerThread: Thread? = null
              private var pendingDns1: String = "94.140.14.14"
              private var pendingDns2: String = "94.140.15.15"

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == "STOP_VPN") {
                      stopVpnTunnel()
                      return START_NOT_STICKY
                  }
                  if (action == "UPDATE_POLICY") {
                      intent?.let { safeIntent ->
                          val eco = safeIntent.getBooleanExtra("ecoMode", false)
                          val locked = safeIntent.getBooleanExtra("parentalLocked", false)
                          val blockedList = safeIntent.getStringArrayListExtra("blockedDomains") ?: arrayListOf<String>()
                          ecoModeEnabled.set(eco)
                          parentalLocked.set(locked)
                          blockedDomains.clear()
                          blockedDomains.addAll(blockedList)
                          if (locked) stopVpnTunnel()
                      }
                      return START_STICKY
                  }
                  if (!isRunning.get() && !parentalLocked.get()) {
                      val eco = intent?.getBooleanExtra("ecoMode", false) ?: false
                      ecoModeEnabled.set(eco)
                      pendingDns1 = intent?.getStringExtra("dnsPrimary") ?: "94.140.14.14"
                      pendingDns2 = intent?.getStringExtra("dnsFallback") ?: "94.140.15.15"
                      startVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  try {
                      val rx = TrafficStats.getTotalRxBytes()
                      val tx = TrafficStats.getTotalTxBytes()
                      lastOsTotalBytes = if (rx > 0L && tx > 0L) (rx + tx) else 0L
                      tunnelInspectorBytes.set(0L)

                      val mtuSize = if (ecoModeEnabled.get()) 1280 else 1500
                      val builder = Builder()
                          .setSession("النفق الموحد")
                          .setMtu(mtuSize)
                          .addAddress("10.88.0.2", 24)
                          .addDnsServer(pendingDns1)
                          .addDnsServer(pendingDns2)
                          .addRoute("10.99.99.0", 24)
                          .addRoute("10.88.0.0", 24)

                      vpnInterface = builder.establish()
                      if (vpnInterface != null) {
                          isRunning.set(true)
                          startPacketEngine()
                      }
                  } catch (e: Exception) {
                      isRunning.set(false)
                  }
              }

              private fun startPacketEngine() {
                  workerThread = Thread {
                      val fd = vpnInterface?.fileDescriptor ?: return@Thread
                      val inputStream = FileInputStream(fd)
                      val packet = ByteBuffer.allocate(32767)

                      while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                          try {
                              if (parentalLocked.get()) {
                                  stopVpnTunnel()
                                  break
                              }
                              val length = inputStream.read(packet.array())
                              if (length > 20) {
                                  tunnelInspectorBytes.addAndGet(length.toLong())
                                  if (ecoModeEnabled.get() && length > 1100) {
                                      Thread.sleep(6)
                                  }
                                  packet.clear()
                              } else {
                                  Thread.sleep(10)
                              }
                          } catch (e: Exception) {
                              break
                          }
                      }
                  }
                  workerThread?.start()
              }

              private fun stopVpnTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try { vpnInterface?.close() } catch (_: Exception) {}
                  vpnInterface = null
                  stopSelf()
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }
          '''
          write_clean(os.path.join(kt_dir, "VpnTunnelService.kt"), vpn_kt)

          main_act_kt = '''
          package com.lvno.smartclient

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.ConnectivityManager
          import android.net.TrafficStats
          import android.net.VpnService
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.net.Inet4Address
          import java.net.InetSocketAddress
          import java.net.Socket
          import java.util.ArrayList

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.lvno.smartclient/vpn"
              private val VPN_REQUEST_CODE = 1001
              private val QR_REQUEST_CODE = 1002
              private var pendingResult: MethodChannel.Result? = null
              private var pendingQrResult: MethodChannel.Result? = null
              private var pendingEcoMode: Boolean = false
              private var pendingDns1: String = "94.140.14.14"
              private var pendingDns2: String = "94.140.15.15"

              private fun getCurrentGatewayIp(): String {
                  return try {
                      val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val network = cm.activeNetwork ?: return ""
                      val linkProperties = cm.getLinkProperties(network) ?: return ""
                      val routes = linkProperties.routes ?: emptyList()
                      val defaultRoute = routes.firstOrNull { it.isDefaultRoute && it.gateway is Inet4Address }
                      defaultRoute?.gateway?.hostAddress ?: ""
                  } catch (e: Exception) { "" }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val prefs = getSharedPreferences("lvno_local_store", Context.MODE_PRIVATE)
                      when (call.method) {
                          "getDeviceHardwareId" -> {
                              val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown_hw"
                              result.success(androidId)
                          }
                          "getDeviceInfo" -> {
                              val map = HashMap<String, String>()
                              map["model"] = Build.MODEL ?: "unknown"
                              map["manufacturer"] = Build.MANUFACTURER ?: "unknown"
                              map["brand"] = Build.BRAND ?: "unknown"
                              map["device"] = Build.DEVICE ?: "unknown"
                              map["os_version"] = Build.VERSION.RELEASE ?: "unknown"
                              map["sdk_int"] = Build.VERSION.SDK_INT.toString()
                              result.success(map)
                          }
                          "getCurrentGatewayIp" -> {
                              Thread {
                                  val gw = getCurrentGatewayIp()
                                  runOnUiThread { result.success(gw) }
                              }.start()
                          }
                          "verifyMikroTikIdentity" -> {
                              val gatewayIp = call.argument<String>("gatewayIp") ?: "192.168.88.1"
                              val customApiPort = call.argument<Int>("customApiPort") ?: 9728
                              Thread {
                                  var isMikroTik = false
                                  var hasSpecialConfig = false
                                  try {
                                      val sock = Socket()
                                      sock.connect(InetSocketAddress(gatewayIp, customApiPort), 1500)
                                      sock.soTimeout = 1500
                                      val input = sock.getInputStream()
                                      val buffer = ByteArray(64)
                                      val bytesRead = input.read(buffer)
                                      if (bytesRead > 0) {
                                          isMikroTik = true
                                          hasSpecialConfig = true
                                      }
                                      sock.close()
                                  } catch (e: Exception) {
                                      isMikroTik = false
                                      hasSpecialConfig = false
                                  }
                                  runOnUiThread {
                                      val map = HashMap<String, Any>()
                                      map["isMikroTik"] = isMikroTik
                                      map["hasSpecialConfig"] = hasSpecialConfig
                                      result.success(map)
                                  }
                              }.start()
                          }
                          "getLocalContactsJson" -> {
                              result.success(prefs.getString("contacts_json", "{}") ?: "{}")
                          }
                          "saveLocalContactsJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("contacts_json", jsonStr).apply()
                              result.success(true)
                          }
                          "getQuotaStateJson" -> {
                              result.success(prefs.getString("quota_state_json", "{}") ?: "{}")
                          }
                          "saveQuotaStateJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("quota_state_json", jsonStr).apply()
                              result.success(true)
                          }
                          "verifyMikroTikHandshake" -> {
                              val gatewayIp = call.argument<String>("gatewayIp") ?: "10.99.99.1"
                              Thread {
                                  var verified = false
                                  try {
                                      val sock = Socket()
                                      sock.connect(InetSocketAddress(gatewayIp, 53), 1200)
                                      sock.close()
                                      verified = true
                                  } catch (_: Exception) {
                                      try {
                                          val s2 = Socket()
                                          s2.connect(InetSocketAddress(gatewayIp, 80), 1200)
                                          s2.close()
                                          verified = true
                                      } catch (_: Exception) { verified = false }
                                  }
                                  runOnUiThread { result.success(verified) }
                              }.start()
                          }
                          "scanQrNative" -> {
                              try {
                                  val intent = Intent("com.google.zxing.client.android.SCAN")
                                  intent.putExtra("SCAN_MODE", "QR_CODE_MODE")
                                  pendingQrResult = result
                                  startActivityForResult(intent, QR_REQUEST_CODE)
                              } catch (e: Exception) { result.success("") }
                          }
                          "isVpnRunning" -> { result.success(VpnTunnelService.isRunning.get()) }
                          "pollRealtimeDeltaBytes" -> {
                              if (!VpnTunnelService.isRunning.get()) {
                                  result.success(0)
                                  return@setMethodCallHandler
                              }
                              var delta = VpnTunnelService.tunnelInspectorBytes.getAndSet(0L)
                              val rx = TrafficStats.getTotalRxBytes()
                              val tx = TrafficStats.getTotalTxBytes()
                              if (rx > 0L && tx > 0L) {
                                  val nowTotal = rx + tx
                                  if (VpnTunnelService.lastOsTotalBytes > 0L && nowTotal > VpnTunnelService.lastOsTotalBytes) {
                                      val osDelta = nowTotal - VpnTunnelService.lastOsTotalBytes
                                      if (osDelta > delta) delta = osDelta
                                  }
                                  VpnTunnelService.lastOsTotalBytes = nowTotal
                              }
                              val safeInt = if (delta > 2000000000L) 2000000000 else delta.toInt()
                              result.success(safeInt)
                          }
                          "startVpn" -> {
                              pendingEcoMode = call.argument<Boolean>("ecoMode") ?: false
                              pendingDns1 = call.argument<String>("dnsPrimary") ?: "94.140.14.14"
                              pendingDns2 = call.argument<String>("dnsFallback") ?: "94.140.15.15"
                              val prepareIntent = VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  launchVpnService()
                                  result.success(true)
                              }
                          }
                          "updatePolicy" -> {
                              val eco = call.argument<Boolean>("ecoMode") ?: false
                              val locked = call.argument<Boolean>("parentalLocked") ?: false
                              val blocked = call.argument<List<String>>("blockedDomains") ?: emptyList()
                              val intent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "UPDATE_POLICY"
                                  putExtra("ecoMode", eco)
                                  putExtra("parentalLocked", locked)
                                  putStringArrayListExtra("blockedDomains", ArrayList(blocked))
                              }
                              startService(intent)
                              result.success(true)
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "STOP_VPN"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun launchVpnService() {
                  val serviceIntent = Intent(this, VpnTunnelService::class.java).apply {
                      putExtra("ecoMode", pendingEcoMode)
                      putExtra("dnsPrimary", pendingDns1)
                      putExtra("dnsFallback", pendingDns2)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.error("DENIED", "يلزم الموافقة لتفعيل النفق", null)
                      }
                      pendingResult = null
                  } else if (requestCode == QR_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val contents = data.getStringExtra("SCAN_RESULT") ?: ""
                          pendingQrResult?.success(contents)
                      } else {
                          pendingQrResult?.success("")
                      }
                      pendingQrResult = null
                  }
              }
          }
          '''
          write_clean(os.path.join(kt_dir, "MainActivity.kt"), main_act_kt)

          manifest_xml = '''
