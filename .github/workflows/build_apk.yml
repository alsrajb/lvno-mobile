                                final res = await widget.engine.executeUnifiedTransfer(
                                  receiverId: _receiverCtrl.text.trim(),
                                  amountYer: amt,
                                  transferMode: _transferMode,
                                );
                                await _loadContacts();
                                setState(() {
                                  if (_transferMode == 'cash') {
                                    _feedback = "✅ تم تحويل $amt ريال نقدي";
                                  } else {
                                    _feedback = "✅ خُصم ${res['net_deducted']} ريال وأُضيف ${res['credit_delivered']} رصيد استخدام";
                                  }
                                });
                              } catch (e) {
                                setState(() => _feedback = "⚠️ ${e.toString().replaceAll('Exception: ', '')}");
