name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Ensure MinSdk 23 for Firebase
        shell: python
        run: |
          import os, re
          for root, dirs, files in os.walk("android"):
              for f in files:
                  if f == "build.gradle" or f == "build.gradle.kts":
                      path = os.path.join(root, f)
                      txt = open(path).read()
                      txt = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', txt)
                      txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', txt)
                      open(path, "w").write(txt)

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: LVNO-SmartClient-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
