name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Backup Custom Files & Generate Android Skeleton
        run: |
          mkdir -p /tmp/backup/kotlin
          cp -r lib/* /tmp/backup/
          cp pubspec.yaml /tmp/backup/
          cp android/app/src/main/AndroidManifest.xml /tmp/backup/
          cp android/app/src/main/kotlin/com/lvno/smartclient/* /tmp/backup/kotlin/
          cp android/app/google-services.json /tmp/backup/

          flutter create --org com.lvno --project-name smartclient .

          cp /tmp/backup/pubspec.yaml pubspec.yaml
          cp /tmp/backup/*.dart lib/
          cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/kotlin/com/lvno/smartclient
          cp /tmp/backup/kotlin/* android/app/src/main/kotlin/com/lvno/smartclient/
          cp /tmp/backup/google-services.json android/app/google-services.json

      - name: Inject Firebase Google Services & MinSdk 23 into Gradle
        run: |
          python3 - << 'EOF'
          import os, re

          for p in ["android/settings.gradle", "android/settings.gradle.kts"]:
              if os.path.exists(p):
                  txt = open(p).read()
                  if "com.google.gms.google-services" not in txt:
                      txt = txt.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false')
                      open(p, "w").write(txt)

          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              txt = open(app_gradle).read()
              if "com.google.gms.google-services" not in txt:
                  txt = txt.replace('plugins {', 'plugins {\n    id "com.google.gms.google-services"')
              txt = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', txt)
              txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', txt)
              open(app_gradle, "w").write(txt)
          EOF

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: LVNO-SmartClient-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
