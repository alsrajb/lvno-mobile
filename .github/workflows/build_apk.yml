                                  Text("إجمالي الدفعات المباعة: ${wanMb.toStringAsFixed(0)} MB", style: const TextStyle(fontSize: 12, color: Colors.white70)),
                                  const SizedBox(height: 4),
                                  Text("الرصيد المتاح للسحب الفوري: $dueYer ريال", style: const TextStyle(fontSize: 20, fontWeight: FontWeight.w900, color: Colors.amber)),
                                  const Divider(color: Colors.white24, height: 18),
                                  SwitchListTile(
                                    contentPadding: EdgeInsets.zero,
                                    dense: true,
                                    title: const Text("تحويل المستحقات تلقائياً إلى محفظتي", style: TextStyle(fontSize: 13, fontWeight: FontWeight.bold)),
                                    subtitle: const Text("إيداع حصة كل دفعة 100MB فوراً في رصيدك النقدي", style: TextStyle(fontSize: 11, color: Colors.white70)),
                                    value: autoTransfer,
                                    activeColor: const Color(0xFF10B981),
                                    onChanged: (val) async {
                                      await widget.engine.toggleHostAutoTransfer(hostId, val);
                                      setState(() => _feedback = val ? "✅ تم تفعيل التحويل التلقائي لمستحقات الشبكة إلى محفظتك" : "تم ضبط السحب ليكون يدوياً بطلب منك");
                                    },
