            Widget _buildFuelPumpTunnelTab(Map<String, dynamic> w, Map<String, dynamic> cfg, bool ecoMode) {
              final double liveBalanceYer = widget.engine.fuelPumpRealtimeBalanceYer;
              final double sessionSpentYer = widget.engine.currentSessionConsumedYer;
              final double remMb = widget.engine.remainingChunkMb;
              final double usedMb = widget.engine.consumedChunkMb;
              final int chunkMaxMb = widget.engine.serverChunkSizeMb;
              final int triggerMb = widget.engine.serverRefillTriggerMb;
              final double tankProgress = widget.engine.activeChunkTotalBytes > 0
                  ? (remMb / chunkMaxMb).clamp(0.0, 1.0)
                  : 0.0;

              return SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        gradient: const LinearGradient(
                          colors: [Color(0xFF0F172A), Color(0xFF1E293B)],
                          begin: Alignment.topCenter,
                          end: Alignment.bottomCenter,
                        ),
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(
                          color: widget.engine.isVpnActive ? const Color(0xFF10B981) : Colors.white12,
                          width: 2,
                        ),
                      ),
                      child: Column(
                        children: [
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceBetween,
                            children: [
                              Row(
                                children: [
                                  Icon(
                                    Icons.local_gas_station,
                                    color: widget.engine.isVpnActive ? const Color(0xFF10B981) : Colors.white54,
                                  ),
                                  const SizedBox(width: 8),
                                  Text(
                                    widget.engine.isVpnActive ? "عداد النفق يعمل لحظياً" : "العداد متوقف",
                                    style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15),
                                  ),
                                ],
                              ),
                              if (widget.engine.isPurchasingChunk)
                                const SizedBox(
                                  width: 18,
                                  height: 18,
                                  child: CircularProgressIndicator(strokeWidth: 2, color: Colors.amber),
                                ),
                            ],
                          ),
                          const SizedBox(height: 18),
                          const Text("الرصيد المتبقي اللحظي (بالفاصلة العشرية)", style: TextStyle(fontSize: 12, color: Colors.white60)),
                          const SizedBox(height: 6),
                          Container(
                            padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 20),
                            decoration: BoxDecoration(
                              color: const Color(0xFF020617),
                              borderRadius: BorderRadius.circular(14),
                              border: Border.all(color: const Color(0xFF10B981).withOpacity(0.5)),
                            ),
