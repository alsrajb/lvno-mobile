                          const SizedBox(height: 10),
                          TextField(
                            controller: _searchContactCtrl,
                            style: const TextStyle(color: kBlack),
                            decoration: const InputDecoration(
                              hintText: "ابحث بالاسم أو الرقم...",
                              prefixIcon: Icon(Icons.search, color: kMandarinOrange),
