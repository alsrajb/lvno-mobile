name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Commercial LVNO V3 (Zero Extra Plugin Conflicts)
        shell: python
        run: |
          import os, shutil, json, subprocess, re

          gs_data = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  if f.startswith("google-services.json"):
                      full_p = os.path.join(root, f)
                      shutil.copy2(full_p, "/tmp/google-services.json")
                      try:
                          gs_data = json.load(open(full_p))
                      except Exception:
                          pass

          proj_info = gs_data.get("project_info", {})
          project_id = proj_info.get("project_id", "netspay-1f0fc")
          sender_id = proj_info.get("project_number", "000000000000")
          client_list = gs_data.get("client", [{}])
          first_client = client_list[0] if client_list else {}
          app_id = first_client.get("client_info", {}).get("mobilesdk_app_id", "1:000000000000:android:000000000000")
          api_key_list = first_client.get("api_key", [{}])
          api_key = api_key_list[0].get("current_key", "") if api_key_list else ""

          for item in os.listdir("."):
              if item not in [".git", ".github"]:
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.lvno", "--project-name", "smartclient", "--platforms=android", "."], check=True)

          if os.path.exists("/tmp/google-services.json"):
              shutil.copy2("/tmp/google-services.json", "android/app/google-services.json")

          def write_clean(path, text):
              lines = [l[10:] if l.startswith("          ") else l for l in text.splitlines()]
              open(path, "w", encoding="utf-8").write("\n".join(lines) + "\n")

          # نفس مكتبات البناء #10 الناجح تماماً بدون أي إضافات تكسر Gradle
          pubspec_txt = '''name: smartclient
          description: Unified Commercial Network App
          publish_to: 'none'
          version: 3.1.0+8

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.6.0
            firebase_auth: ^5.3.1
            cloud_firestore: ^5.4.4
            http: ^1.2.2
            crypto: ^3.0.5
            qr_flutter: ^4.1.0

          flutter:
            uses-material-design: true'''
          write_clean("pubspec.yaml", pubspec_txt)

          kt_dir = "android/app/src/main/kotlin/com/lvno/smartclient"
          os.makedirs(kt_dir, exist_ok=True)

          vpn_kt = '''package com.lvno.smartclient

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.util.Collections
          import java.util.LinkedHashMap
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          class VpnTunnelService : VpnService() {
              companion object {
                  val isRunning = AtomicBoolean(false)
                  val ecoModeEnabled = AtomicBoolean(false)
                  val parentalLocked = AtomicBoolean(false)
                  val wanBytesCount = AtomicLong(0)
                  val cacheBytesCount = AtomicLong(0)

                  val localDnsRamCache: MutableMap<String, String> = Collections.synchronizedMap(
                      object : LinkedHashMap<String, String>(5000, 0.75f, true) {
                          override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, String>?): Boolean {
                              return size > 10000
                          }
                      }
                  )

                  val blockedDomains = ConcurrentHashMap.newKeySet<String>()
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == "STOP_VPN") {
                      stopVpnTunnel()
                      return START_NOT_STICKY
                  }
                  if (action == "UPDATE_POLICY") {
                      val eco = intent.getBooleanExtra("ecoMode", false)
                      val locked = intent.getBooleanExtra("parentalLocked", false)
                      val blockedList = intent.getStringArrayListExtra("blockedDomains") ?: arrayListOf()
                      ecoModeEnabled.set(eco)
                      parentalLocked.set(locked)
                      blockedDomains.clear()
                      blockedDomains.addAll(blockedList)
                      if (locked) {
                          stopVpnTunnel()
                      }
                      return START_STICKY
                  }
                  if (!isRunning.get() && !parentalLocked.get()) {
                      val eco = intent?.getBooleanExtra("ecoMode", false) ?: false
                      ecoModeEnabled.set(eco)
                      startVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  try {
                      val mtuSize = if (ecoModeEnabled.get()) 1280 else 1500
                      val builder = Builder()
                          .setSession("النفق الموحد")
                          .setMtu(mtuSize)
                          .addAddress("10.88.0.2", 24)
                          .addDnsServer("1.1.1.3")
                          .addDnsServer("1.0.0.3")
                          .addRoute("10.99.99.0", 24)
                          .addRoute("10.88.0.0", 24)

                      vpnInterface = builder.establish()
                      if (vpnInterface != null) {
                          isRunning.set(true)
                          startPacketEngine()
                      }
                  } catch (e: Exception) {
                      isRunning.set(false)
                  }
              }

              private fun startPacketEngine() {
                  workerThread = Thread {
                      val fd = vpnInterface?.fileDescriptor ?: return@Thread
                      val inputStream = FileInputStream(fd)
                      val packet = ByteBuffer.allocate(32767)

                      while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                          try {
                              if (parentalLocked.get()) {
                                  stopVpnTunnel()
                                  break
                              }
                              val length = inputStream.read(packet.array())
                              if (length > 20) {
                                  val b0 = packet.get(16).toInt() and 0xFF
                                  val b1 = packet.get(17).toInt() and 0xFF
                                  val b2 = packet.get(18).toInt() and 0xFF

                                  if (b0 == 10 && b1 == 99 && b2 == 99) {
                                      cacheBytesCount.addAndGet(length.toLong())
                                  } else {
                                      wanBytesCount.addAndGet(length.toLong())
                                  }

                                  if (ecoModeEnabled.get() && length > 1100) {
                                      Thread.sleep(6)
                                  }
                                  packet.clear()
                              } else {
                                  Thread.sleep(12)
                              }
                          } catch (e: Exception) {
                              break
                          }
                      }
                  }
                  workerThread?.start()
              }

              private fun stopVpnTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try { vpnInterface?.close() } catch (_: Exception) {}
                  vpnInterface = null
                  stopSelf()
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }'''
          write_clean(os.path.join(kt_dir, "VpnTunnelService.kt"), vpn_kt)

          # MainActivity.kt يتولى التخزين المحلي الأصلي + الـ VPN + مسح الـ QR الأصلي بدون مكتبات خارجية
          main_act_kt = '''package com.lvno.smartclient

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.ArrayList

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.lvno.smartclient/vpn"
              private val VPN_REQUEST_CODE = 1001
              private val QR_REQUEST_CODE = 1002
              private var pendingResult: MethodChannel.Result? = null
              private var pendingQrResult: MethodChannel.Result? = null
              private var pendingEcoMode: Boolean = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val prefs = getSharedPreferences("lvno_local_store", Context.MODE_PRIVATE)
                      when (call.method) {
                          "getDeviceHardwareId" -> {
                              val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown_hw"
                              result.success(androidId)
                          }
                          "getLocalContactsJson" -> {
                              val jsonStr = prefs.getString("contacts_json", "{}") ?: "{}"
                              result.success(jsonStr)
                          }
                          "saveLocalContactsJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("contacts_json", jsonStr).apply()
                              result.success(true)
                          }
                          "scanQrNative" -> {
                              try {
                                  val intent = Intent("com.google.zxing.client.android.SCAN")
                                  intent.putExtra("SCAN_MODE", "QR_CODE_MODE")
                                  pendingQrResult = result
                                  startActivityForResult(intent, QR_REQUEST_CODE)
                              } catch (e: Exception) {
                                  result.success("")
                              }
                          }
                          "isVpnRunning" -> {
                              result.success(VpnTunnelService.isRunning.get())
                          }
                          "startVpn" -> {
                              pendingEcoMode = call.argument<Boolean>("ecoMode") ?: false
                              val prepareIntent = VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  launchVpnService()
                                  result.success(true)
                              }
                          }
                          "updatePolicy" -> {
                              val eco = call.argument<Boolean>("ecoMode") ?: false
                              val locked = call.argument<Boolean>("parentalLocked") ?: false
                              val blocked = call.argument<List<String>>("blockedDomains") ?: emptyList()
                              val intent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "UPDATE_POLICY"
                                  putExtra("ecoMode", eco)
                                  putExtra("parentalLocked", locked)
                                  putStringArrayListExtra("blockedDomains", ArrayList(blocked))
                              }
                              startService(intent)
                              result.success(true)
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "STOP_VPN"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun launchVpnService() {
                  val serviceIntent = Intent(this, VpnTunnelService::class.java).apply {
                      putExtra("ecoMode", pendingEcoMode)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.error("DENIED", "يلزم الموافقة لتفعيل النفق", null)
                      }
                      pendingResult = null
                  } else if (requestCode == QR_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val contents = data.getStringExtra("SCAN_RESULT") ?: ""
                          pendingQrResult?.success(contents)
                      } else {
                          pendingQrResult?.success("")
                      }
                      pendingQrResult = null
                  }
              }
          }'''
          write_clean(os.path.join(kt_dir, "MainActivity.kt"), main_act_kt)

          manifest_xml = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="نت سباي"
                  android:name="${applicationName}"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VpnTunnelService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>'''
          write_clean("android/app/src/main/AndroidManifest.xml", manifest_xml)

          core_code = '''import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/services.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';

          class SmartClientEngine {
            String walletId = "";
            String currentHostId;
            bool isVpnActive = false;
            bool ecoMode = false;

            static const MethodChannel _vpnChannel = MethodChannel('com.lvno.smartclient/vpn');

            static const Map<String, List<String>> presetCategoryDomains = {
              'games': ['roblox.com', 'pubgmobile.com', 'freefiremobile.com', 'epicgames.com', 'steampowered.com', 'supercell.com'],
              'social': ['tiktok.com', 'instagram.com', 'facebook.com', 'snapchat.com', 'twitter.com', 'x.com'],
              'video': ['youtube.com', 'googlevideo.com', 'netflix.com', 'twitch.tv', 'shahid.mbc.net'],
            };

            SmartClientEngine({required this.currentHostId});

            Future<String> getDeviceHardwareId() async {
              try {
                final id = await _vpnChannel.invokeMethod<String>('getDeviceHardwareId');
                return (id != null && id.isNotEmpty) ? id : "dev_default_01";
              } catch (_) {
                return "dev_default_01";
              }
            }

            Future<Map<String, String>> getLocalContacts() async {
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getLocalContactsJson') ?? '{}';
                final Map<String, dynamic> decoded = jsonDecode(raw);
                return decoded.map((k, v) => MapEntry(k, v.toString()));
              } catch (_) {
                return {};
              }
            }

            Future<void> saveLocalContact(String targetId, String aliasName) async {
              if (targetId.trim().isEmpty || aliasName.trim().isEmpty) return;
              try {
                final current = await getLocalContacts();
                current[targetId.trim()] = aliasName.trim();
                await _vpnChannel.invokeMethod('saveLocalContactsJson', {
                  'json': jsonEncode(current),
                });
              } catch (_) {}
            }

            Future<String> tryScanQrNative() async {
              try {
                final res = await _vpnChannel.invokeMethod<String>('scanQrNative');
                return res ?? '';
              } catch (_) {
                return '';
              }
            }

            Future<bool> verifyActiveHostNetwork(String hostId) async {
              final db = FirebaseFirestore.instance;
              final hostSnap = await db.collection('hosts').doc(hostId).get();
              if (!hostSnap.exists) return false;
              final status = (hostSnap.data()?['status'] ?? 'active').toString();
              currentHostId = hostId;
              return status == 'active';
            }

            Future<String> registerOrRecoverDeviceWallet() async {
              final db = FirebaseFirestore.instance;
              final deviceId = await getDeviceHardwareId();
              await _ensureDefaultSystemSettings(db);

              final activeNet = await verifyActiveHostNetwork(currentHostId);
              if (!activeNet) {
                throw Exception("يتطلب التفعيل الاتصال بنقطة معتمدة ومفعلة");
              }

              final devRef = db.collection('device_registry').doc(deviceId);
              final counterRef = db.collection('settings').doc('wallet_counter');
              final configRef = db.collection('settings').doc('global_config');

              return await db.runTransaction((tx) async {
                final devSnap = await tx.get(devRef);
                if (devSnap.exists && devSnap.data()?['wallet_id'] != null) {
                  walletId = devSnap.data()!['wallet_id'].toString();
                  return walletId;
                }

                final counterSnap = await tx.get(counterRef);
                final configSnap = await tx.get(configRef);

                int nextId = 1001;
                if (counterSnap.exists && counterSnap.data()?['last_wallet_number'] != null) {
                  nextId = ((counterSnap.data()!['last_wallet_number'] as num).toInt()) + 1;
                }

                int generalMaxBalance = 10000;
                int generalDailyLimit = 5000;
                if (configSnap.exists) {
                  generalMaxBalance = ((configSnap.data()?['general_tier_max_balance_yer'] ?? 10000) as num).toInt();
                  generalDailyLimit = ((configSnap.data()?['general_tier_daily_limit_yer'] ?? 5000) as num).toInt();
                }

                final newWalletId = nextId.toString();
                final walletRef = db.collection('wallets').doc(newWalletId);

                tx.set(counterRef, {'last_wallet_number': nextId}, SetOptions(merge: true));
                tx.set(devRef, {
                  'device_id': deviceId,
                  'wallet_id': newWalletId,
                  'registered_host_id': currentHostId,
                  'created_at': FieldValue.serverTimestamp(),
                });

                tx.set(walletRef, {
                  'wallet_id': newWalletId,
                  'device_id': deviceId,
                  'display_name': 'حساب $newWalletId',
                  'full_name': '',
                  'cash_balance_yer': 0,
                  'credit_balance_yer': 0,
                  'tier': 'general',
                  'kyc_verified': false,
                  'custom_max_balance_yer': generalMaxBalance,
                  'custom_daily_limit_yer': generalDailyLimit,
                  'daily_transferred_today': 0,
                  'eco_mode': false,
                  'parent_wallet_id': '',
                  'parental_locked': false,
                  'daily_time_limit_mins': 0,
                  'used_time_today_mins': 0,
                  'blocked_categories': <String>[],
                  'custom_blocked_domains': <String>[],
                  'created_at': FieldValue.serverTimestamp(),
                });

                walletId = newWalletId;
                return newWalletId;
              });
            }

            Future<void> _ensureDefaultSystemSettings(FirebaseFirestore db) async {
              final cfgRef = db.collection('settings').doc('global_config');
              if (!(await cfgRef.get()).exists) {
                await cfgRef.set({
                  'gb_price_consumer_yer': 250,
                  'gb_payout_host_yer': 195,
                  'credit_sender_discount_pct': 10.0,
                  'credit_receiver_bonus_pct': 5.0,
                  'general_tier_max_balance_yer': 10000,
                  'general_tier_daily_limit_yer': 5000,
                  'family_filter_enforced': true,
                  'ai_smart_manager_ready': true,
                });
              }
              final hostRef = db.collection('hosts').doc(currentHostId);
              if (!(await hostRef.get()).exists) {
                await hostRef.set({
                  'host_id': currentHostId,
                  'network_name': 'النقطة الرئيسية المعتمدة',
                  'status': 'active',
                  'current_month_wan_mb': 0,
                  'amount_due_yer': 0,
                });
              }
            }

            Future<void> syncDevicePolicyFromWalletDoc(Map<String, dynamic> wData) async {
              ecoMode = (wData['eco_mode'] ?? false) == true;
              final bool locked = (wData['parental_locked'] ?? false) == true;
              final int limitMins = ((wData['daily_time_limit_mins'] ?? 0) as num).toInt();
              final int usedMins = ((wData['used_time_today_mins'] ?? 0) as num).toInt();
              final bool timeExpired = (limitMins > 0 && usedMins >= limitMins);

              final List<dynamic> cats = (wData['blocked_categories'] as List<dynamic>?) ?? [];
              final List<dynamic> customDoms = (wData['custom_blocked_domains'] as List<dynamic>?) ?? [];

              final Set<String> compiledDomains = {};
              for (final c in cats) {
                final list = presetCategoryDomains[c.toString()];
                if (list != null) compiledDomains.addAll(list);
              }
              for (final d in customDoms) {
                if (d.toString().trim().isNotEmpty) compiledDomains.add(d.toString().trim().toLowerCase());
              }

              try {
                await _vpnChannel.invokeMethod('updatePolicy', {
                  'ecoMode': ecoMode,
                  'parentalLocked': locked || timeExpired,
                  'blockedDomains': compiledDomains.toList(),
                });
                if (locked || timeExpired) {
                  isVpnActive = false;
                }
              } catch (_) {}
            }

            Future<bool> startSmartConnection(Map<String, dynamic> wData) async {
              final int creditBal = ((wData['credit_balance_yer'] ?? 0) as num).toInt();
              if (creditBal <= 0) {
                throw Exception("يرجى تغذية رصيد الاستخدام أولاً لتشغيل النفق");
              }
              if ((wData['parental_locked'] ?? false) == true) {
                throw Exception("تم إيقاف الاستخدام مؤقتاً من قِبل المشرف العائلي");
              }
              final int limitMins = ((wData['daily_time_limit_mins'] ?? 0) as num).toInt();
              final int usedMins = ((wData['used_time_today_mins'] ?? 0) as num).toInt();
              if (limitMins > 0 && usedMins >= limitMins) {
                throw Exception("انتهى وقت الاستخدام اليومي المخصص لهذا الجهاز");
              }
              final okHost = await verifyActiveHostNetwork(currentHostId);
              if (!okHost) {
                throw Exception("لا يمكن تشغيل النفق إلا على نقطة مفعلة");
              }
              await syncDevicePolicyFromWalletDoc(wData);
              final ok = await _vpnChannel.invokeMethod<bool>('startVpn', {
                'ecoMode': ecoMode,
              });
              isVpnActive = ok ?? false;
              return isVpnActive;
            }

            Future<void> stopSmartConnection() async {
              try {
                await _vpnChannel.invokeMethod('stopVpn');
              } catch (_) {}
              isVpnActive = false;
            }

            Future<void> toggleMyEcoMode(bool enabled) async {
              ecoMode = enabled;
              await FirebaseFirestore.instance.collection('wallets').doc(walletId).update({
                'eco_mode': enabled,
              });
            }

            Future<void> linkFamilyMemberDevice(String childWalletId, String localNickname) async {
              final cleanId = childWalletId.replaceAll('LINK:', '').trim();
              if (cleanId.isEmpty || cleanId == walletId) {
                throw Exception("معرف الجهاز غير صالح للربط");
              }
              final db = FirebaseFirestore.instance;
              final childRef = db.collection('wallets').doc(cleanId);
              final childSnap = await childRef.get();
              if (!childSnap.exists) {
                throw Exception("الجهاز رقم ($cleanId) غير موجود");
              }

              await childRef.update({'parent_wallet_id': walletId});
              await db.collection('wallets').doc(walletId).set({
                'linked_children': FieldValue.arrayUnion([cleanId]),
              }, SetOptions(merge: true));

              if (localNickname.trim().isNotEmpty) {
                await saveLocalContact(cleanId, localNickname.trim());
              }
            }

            Future<Map<String, dynamic>> executeUnifiedTransfer({
              required String receiverId,
              required int amountYer,
              required String transferMode,
            }) async {
              final cleanReceiver = receiverId.replaceAll('LINK:', '').trim();
              if (cleanReceiver.isEmpty || amountYer <= 0) {
                throw Exception("يرجى إدخال رقم حساب صحيح ومبلغ أكبر من صفر");
              }
              if (cleanReceiver == walletId && transferMode == 'cash') {
                throw Exception("لتحويل النقد إلى رصيد استخدام لنفس حسابك، اختر (رصيد استخدام)");
              }

              final db = FirebaseFirestore.instance;
              final senderRef = db.collection('wallets').doc(walletId);
              final receiverRef = db.collection('wallets').doc(cleanReceiver);
              final configRef = db.collection('settings').doc('global_config');

              final result = await db.runTransaction((tx) async {
                final senderSnap = await tx.get(senderRef);
