            Future> startSession() async {
              if (isStartingSession) return {'ok': false, 'reason': 'عملية جارية'};
              isStartingSession = true;

              try {
                final db = FirebaseFirestore.instance;
                final wRef = db.collection('wallets').doc(walletId);
                final sessionId = 's_${walletId}_${DateTime.now().millisecondsSinceEpoch}';

                final result = await db.runTransaction((tx) async {
                  final wSnap = await tx.get(wRef);
                  if (!wSnap.exists) throw Exception("المحفظة غير موجودة");

                  final w = wSnap.data()!;
                  final portable = ((w['portable_mb'] ?? 0) as num).toDouble();
                  final lifetime = ((w['lifetime_consumed_mb'] ?? 0) as num).toDouble();

                  if (portable < 1.0) {
                    throw Exception("الرصيد العائم فارغ — اشترِ دفعة أولاً");
                  }

                  final sRef = db.collection('sessions').doc(sessionId);
                  tx.set(sRef, {
                    'wallet_id': walletId,
                    'host_id': currentHostId,
                    'session_start_total_mb': lifetime,
                    'current_total_mb': lifetime,
                    'reported_mb': 0.0,
                    'local_mb_since_report': 0.0,
                    'started_at': FieldValue.serverTimestamp(),
                    'last_heartbeat': FieldValue.serverTimestamp(),
                    'last_report_at': FieldValue.serverTimestamp(),
                    'status': 'active',
                  });

                  tx.update(wRef, {
                    'current_session_id': sessionId,
                    'current_host_id': currentHostId,
                    'session_started_mb': lifetime,
                    'pending_mb_since_report': 0.0,
                  });

                  return {
                    'session_id': sessionId,
                    'lifetime_at_start': lifetime,
                  };
                });

                currentSessionId = result['session_id'].toString();
                _pendingMbReport = 0.0;
                _ticksSinceHeartbeat = 0;
                _ticksSinceReport = 0;
                isStartingSession = false;
                return {'ok': true, ...result};
              } catch (e) {
                isStartingSession = false;
                return {'ok': false, 'reason': e.toString().replaceAll('Exception: ', '')};
              }
            }

            Future<void> sendHeartbeat() async {
              if (currentSessionId.isEmpty) return;
              try {
                final db = FirebaseFirestore.instance;
                await db.collection('sessions').doc(currentSessionId).update({
                  'last_heartbeat': FieldValue.serverTimestamp(),
                  'local_mb_since_report': _pendingMbReport,
                  'current_total_mb': FieldValue.increment(_pendingMbReport),
                });
                await db.collection('wallets').doc(walletId).update({
                  'pending_mb_since_report': _pendingMbReport,
                  'last_seen_at': FieldValue.serverTimestamp(),
                });
              } catch (_) {}
            }

            Future<void> reportConsumption(double mbConsumed, {String trigger = 'periodic'}) async {
              if (mbConsumed < 0.1 || currentSessionId.isEmpty) return;
              if (isReporting) return;
              isReporting = true;

              try {
                final db = FirebaseFirestore.instance;
                final wRef = db.collection('wallets').doc(walletId);
                final hRef = db.collection('hosts').doc(currentHostId);
                final cfgRef = db.collection('settings').doc('global_config');
                final sRef = db.collection('sessions').doc(currentSessionId);

                await db.runTransaction((tx) async {
                  final wSnap = await tx.get(wRef);
                  final hSnap = await tx.get(hRef);
                  final cfgSnap = await tx.get(cfgRef);
                  final sSnap = await tx.get(sRef);

                  if (!wSnap.exists || !hSnap.exists || !sSnap.exists) return;

                  final w = wSnap.data()!;
                  final cfg = cfgSnap.data() ?? {};
                  final gbPrice = ((cfg['gb_price_consumer_yer'] ?? 250) as num).toDouble();
                  final sysProfitPct = ((cfg['system_profit_pct'] ?? 10.0) as num).toDouble();

                  final double mbCost = (mbConsumed / 1000.0) * gbPrice;
                  final int mbCostInt = mbCost.round() < 1 ? 1 : mbCost.round();
                  final int sysShare = (mbCostInt * sysProfitPct / 100).round();
                  final int hostShare = mbCostInt - sysShare;

                  final currentPortable = ((w['portable_mb'] ?? 0) as num).toDouble();
                  final currentPortableVal = ((w['portable_value_yer'] ?? 0) as num).toDouble();

                  final actualMb = mbConsumed > currentPortable ? currentPortable : mbConsumed;

                  if (actualMb < 0.01) return;

                  tx.update(wRef, {
                    'portable_mb': currentPortable - actualMb,
                    'portable_value_yer': currentPortableVal - mbCostInt,
                    'lifetime_consumed_mb': FieldValue.increment(actualMb),
                    'pending_mb_since_report': 0.0,
                    'updated_at': FieldValue.serverTimestamp(),
                  });

                  tx.set(hRef, {
                    'current_month_wan_mb': FieldValue.increment(actualMb),
                    'amount_due_yer': FieldValue.increment(hostShare),
                    'last_heartbeat': FieldValue.serverTimestamp(),
                  }, SetOptions(merge: true));

                  tx.set(db.collection('admin_secret_vault').doc('system_income'), {
                    'total_sys_profit_yer': FieldValue.increment(sysShare),
                  }, SetOptions(merge: true));

                  final txRef = db.collection('transactions').doc();
                  tx.set(txRef, {
                    'type': 'consumption',
                    'wallet_id': walletId,
                    'host_id': currentHostId,
                    'session_id': currentSessionId,
                    'mb_delta': actualMb,
                    'mb_cost_yer': mbCostInt,
                    'host_share_yer': hostShare,
                    'sys_profit_yer': sysShare,
                    'trigger': trigger,
                    'data_source': lastDataSource,
                    'timestamp': FieldValue.serverTimestamp(),
                  });

                  tx.update(sRef, {
                    'reported_mb': FieldValue.increment(actualMb),
                    'local_mb_since_report': 0.0,
                    'current_total_mb': FieldValue.increment(actualMb),
                    'last_report_at': FieldValue.serverTimestamp(),
                  });
                });

                _pendingMbReport = 0;
                _ticksSinceReport = 0;
              } catch (_) {
              } finally {
                isReporting = false;
              }
            }

            Future<void> closeSession({String reason = 'user_stop'}) async {
              if (currentSessionId.isEmpty) return;
              try {
                if (_pendingMbReport >= 0.1) {
                  await reportConsumption(_pendingMbReport, trigger: 'session_close');
                }

                final db = FirebaseFirestore.instance;
                final sRef = db.collection('sessions').doc(currentSessionId);
                final wRef = db.collection('wallets').doc(walletId);

                await db.runTransaction((tx) async {
                  final sSnap = await tx.get(sRef);
                  if (!sSnap.exists) return;
                  if (sSnap.data()?['status'] != 'active') return;

                  tx.update(sRef, {
                    'status': 'closed',
                    'closed_at': FieldValue.serverTimestamp(),
                    'closed_reason': reason,
                  });

                  tx.update(wRef, {
                    'current_session_id': '',
                    'current_host_id': '',
                    'pending_mb_since_report': 0.0,
                  });
                });

                currentSessionId = "";
                _pendingMbReport = 0;
              } catch (_) {}
            }

            Future<void> detectTamperOnBoot() async {
              try {
                final db = FirebaseFirestore.instance;
                final wSnap = await db.collection('wallets').doc(walletId).get();
                if (!wSnap.exists) return;
                final w = wSnap.data()!;

                final staleSessionId = (w['current_session_id'] ?? '').toString();
                if (staleSessionId.isEmpty) return;

                final sSnap = await db.collection('sessions').doc(staleSessionId).get();
                if (!sSnap.exists) {
                  await db.collection('wallets').doc(walletId).update({
                    'current_session_id': '',
                    'current_host_id': '',
                    'pending_mb_since_report': 0.0,
                  });
                  return;
                }

                final s = sSnap.data()!;
                if (s['status'] != 'active') return;

                final Timestamp? rawHb = s['last_heartbeat'] as Timestamp?;
                final DateTime? lastHb = rawHb?.toDate();
                final pendingMb = ((s['local_mb_since_report'] ?? 0) as num).toDouble();

                if (lastHb != null && DateTime.now().difference(lastHb).inMinutes >= 2) {
                  if (pendingMb > 0.1) {
                    await _forceSettleStaleSession(staleSessionId, s, pendingMb);
                  }
                  await db.collection('sessions').doc(staleSessionId).update({
                    'status': 'force_closed',
                    'closed_at': FieldValue.serverTimestamp(),
                    'closed_reason': 'stale_on_boot',
                  });
                  await db.collection('wallets').doc(walletId).update({
                    'current_session_id': '',
                    'current_host_id': '',
                    'pending_mb_since_report': 0.0,
                  });

                  await db.collection('alerts').add({
                    'type': 'stale_session',
                    'wallet_id': walletId,
                    'session_id': staleSessionId,
                    'host_id': s['host_id'],
                    'gap_mb': pendingMb,
                    'severity': 'medium',
                    'resolved': false,
                    'created_at': FieldValue.serverTimestamp(),
                  });
                }
              } catch (_) {}
            }

            Future<void> _forceSettleStaleSession(
                String sessionId, Map<String, dynamic> s, double mb) async {
              try {
                final db = FirebaseFirestore.instance;
                final hRef = db.collection('hosts').doc((s['host_id'] ?? '').toString());
                final cfgSnap = await db.collection('settings').doc('global_config').get();
                final gb = ((cfgSnap.data()?['gb_price_consumer_yer'] ?? 250) as num).toDouble();
                final sp = ((cfgSnap.data()?['system_profit_pct'] ?? 10.0) as num).toDouble();

                final cost = (mb / 1000) * gb;
                final hostShare = (cost * (1 - sp / 100)).round();

                await db.runTransaction((tx) async {
                  tx.set(hRef, {
                    'current_month_wan_mb': FieldValue.increment(mb),
                    'amount_due_yer': FieldValue.increment(hostShare),
                  }, SetOptions(merge: true));

                  final txRef = db.collection('transactions').doc();
                  tx.set(txRef, {
                    'type': 'consumption',
                    'wallet_id': walletId,
                    'host_id': s['host_id'],
                    'session_id': sessionId,
                    'mb_delta': mb,
                    'mb_cost_yer': cost.round(),
                    'host_share_yer': hostShare,
                    'sys_profit_yer': cost.round() - hostShare,
                    'trigger': 'stale_recovery',
                    'timestamp': FieldValue.serverTimestamp(),
                  });
                });
              } catch (_) {}
            }

            Future<bool> purchasePortableQuota() async {
              if (isPurchasingChunk) return false;
              isPurchasingChunk = true;
              notifyListeners();

              try {
                final routingCfg = await getHostRoutingConfig();
                final String routedVia = (routingCfg['routing_preference'] ?? 'host_wan').toString();
                final String dataSource = routedVia == 'my_port' ? 'my_port' : 'host_wan';

                final db = FirebaseFirestore.instance;
                final wRef = db.collection('wallets').doc(walletId);
                final hRef = db.collection('hosts').doc(currentHostId);
                final cfgRef = db.collection('settings').doc('global_config');

                final Map<String, dynamic> res = await db.runTransaction((tx) async {
                  final wSnap = await tx.get(wRef);
                  final hSnap = await tx.get(hRef);
                  final cfgSnap = await tx.get(cfgRef);

                  if (!wSnap.exists) throw Exception("الحساب غير موجود");
                  if (!hSnap.exists) throw Exception("الشبكة غير مسجلة");

                  final wData = wSnap.data()!;
                  final hData = hSnap.data()!;
                  final cfg = cfgSnap.data() ?? {};

                  if ((hData['status'] ?? 'inactive') != 'active' || (hData['manual_admin_approved'] ?? true) != true) {
                    throw Exception("الشبكة غير مفعلة يدوياً من النظام");
                  }

                  final double gbPrice = ((cfg['gb_price_consumer_yer'] ?? 250) as num).toDouble();
                  final int chunkMb = ((cfg['quota_chunk_mb'] ?? 100) as num).toInt();
                  final int triggerMb = ((cfg['quota_refill_trigger_mb'] ?? 80) as num).toInt();

                  final double rawChunkPrice = (chunkMb / 1000.0) * gbPrice;
                  final int chunkCostYer = rawChunkPrice.round() < 1 ? 1 : rawChunkPrice.round();

                  final int currentCredit = ((wData['credit_balance_yer'] ?? 0) as num).toInt();
                  if (currentCredit < chunkCostYer) {
                    throw Exception("رصيد الاستخدام ($currentCredit ريال) لا يكفي لشراء دفعة ($chunkCostYer ريال)");
                  }

                  tx.update(wRef, {
                    'credit_balance_yer': currentCredit - chunkCostYer,
                    'portable_mb': FieldValue.increment(chunkMb.toDouble()),
                    'portable_value_yer': FieldValue.increment(chunkCostYer.toDouble()),
                    'updated_at': FieldValue.serverTimestamp(),
                  });

                  final txRec = db.collection('transactions').doc();
                  tx.set(txRec, {
                    'type': 'portable_purchase',
                    'wallet_id': walletId,
                    'host_id': currentHostId,
                    'chunk_mb': chunkMb,
                    'chunk_cost_yer': chunkCostYer,
                    'data_source': dataSource,
                    'routed_via': routedVia,
                    'timestamp': FieldValue.serverTimestamp(),
                  });

                  return <String, dynamic>{
                    'chunkMb': chunkMb,
                    'triggerMb': triggerMb,
                    'chunkCostYer': chunkCostYer,
                    'gbPrice': gbPrice,
                    'newCredit': currentCredit - chunkCostYer,
                  };
                });

                final int addedBytes = ((res['chunkMb'] as num).toInt() * 1024 * 1024);
                final int prevRemainingBytes = (activeChunkTotalBytes - activeChunkConsumedBytes) > 0
                    ? (activeChunkTotalBytes - activeChunkConsumedBytes)
                    : 0;
                activeChunkTotalBytes = prevRemainingBytes + addedBytes;
                activeChunkConsumedBytes = 0;
                serverChunkSizeMb = (res['chunkMb'] as num).toInt();
                serverRefillTriggerMb = (res['triggerMb'] as num).toInt();
                currentGbPriceYer = (res['gbPrice'] as num).toDouble();
                currentChunkPriceYer = (activeChunkTotalBytes / (1024.0 * 1024.0 * 1000.0)) * currentGbPriceYer;
                serverCreditBalanceYer = (res['newCredit'] as num).toInt();
                portableMb = portableMb + (res['chunkMb'] as num).toDouble();
                portableValueYer = portableValueYer + (res['chunkCostYer'] as num).toDouble();
                lastDataSource = dataSource;
                lastRouteType = routedVia;

                await persistQuotaState();
                isPurchasingChunk = false;
                notifyListeners();
                return true;
              } catch (e) {
                isPurchasingChunk = false;
                notifyListeners();
                rethrow;
              }
            }

            Future<int> withdrawHostEarningsToMyWallet(String hostId) async {
              final db = FirebaseFirestore.instance;
              final hRef = db.collection('hosts').doc(hostId);
              final wRef = db.collection('wallets').doc(walletId);

              return await db.runTransaction((tx) async {
                final hSnap = await tx.get(hRef);
                final wSnap = await tx.get(wRef);
                if (!hSnap.exists) throw Exception("الشبكة غير موجودة");
                if (!wSnap.exists) throw Exception("المحفظة غير موجودة");

                final hData = hSnap.data()!;
                final String ownerId = (hData['owner_wallet_id'] ?? '').toString().trim();
                if (ownerId != walletId) {
                  throw Exception("هذه الشبكة غير مربوطة برقم محفظتك (#$walletId)");
                }

                final int dueYer = ((hData['amount_due_yer'] ?? 0) as num).toInt();
                if (dueYer <= 0) {
                  throw Exception("لا توجد مستحقات معلقة للسحب حالياً");
                }

                tx.update(hRef, {
                  'amount_due_yer': 0,
                  'total_settled_to_wallet_yer': FieldValue.increment(dueYer),
                  'updated_at': FieldValue.serverTimestamp(),
                });

                tx.update(wRef, {
                  'cash_balance_yer': FieldValue.increment(dueYer),
                  'updated_at': FieldValue.serverTimestamp(),
                });

