name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Complete LVNO V6 Project
        shell: python
        run: |
          import os, shutil, json, subprocess, re, textwrap

          gs_data = {}
          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  if f.startswith("google-services.json"):
                      full_p = os.path.join(root, f)
                      shutil.copy2(full_p, "/tmp/google-services.json")
                      try:
                          gs_data = json.load(open(full_p))
                      except Exception:
                          pass

          proj_info = gs_data.get("project_info", {})
          project_id = proj_info.get("project_id", "netspay-1f0fc")
          sender_id = proj_info.get("project_number", "000000000000")
          client_list = gs_data.get("client", [{}])
          first_client = client_list[0] if client_list else {}
          app_id = first_client.get("client_info", {}).get("mobilesdk_app_id", "1:000000000000:android:000000000000")
          api_key_list = first_client.get("api_key", [{}])
          api_key = api_key_list[0].get("current_key", "") if api_key_list else ""

          for item in os.listdir("."):
              if item not in [".git", ".github"]:
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.lvno", "--project-name", "smartclient", "--platforms=android", "."], check=True)

          if os.path.exists("test"):
              shutil.rmtree("test")

          if os.path.exists("/tmp/google-services.json"):
              shutil.copy2("/tmp/google-services.json", "android/app/google-services.json")

          def write_clean(path, text):
              norm = text.replace("\u00a0", " ")
              cleaned = textwrap.dedent(norm).strip() + "\n"
              open(path, "w", encoding="utf-8").write(cleaned)

          write_clean("pubspec.yaml", '''
          name: smartclient
          description: Unified Commercial Network App
          publish_to: 'none'
          version: 6.2.0+18

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.6.0
            firebase_auth: ^5.3.1
            cloud_firestore: ^5.4.4
            http: ^1.2.2
            crypto: ^3.0.5
            qr_flutter: ^4.1.0

          flutter:
            uses-material-design: true
          ''')

          kt_dir = "android/app/src/main/kotlin/com/lvno/smartclient"
          os.makedirs(kt_dir, exist_ok=True)

          write_clean(os.path.join(kt_dir, "VpnTunnelService.kt"), '''
          package com.lvno.smartclient

          import android.content.Intent
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.nio.ByteBuffer
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          class VpnTunnelService : VpnService() {
              companion object {
                  val isRunning = AtomicBoolean(false)
                  val ecoModeEnabled = AtomicBoolean(false)
                  val parentalLocked = AtomicBoolean(false)
                  val wanBytesCount = AtomicLong(0L)
                  val cacheBytesCount = AtomicLong(0L)
                  val blockedDomains = ConcurrentHashMap.newKeySet<String>()
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == "STOP_VPN") {
                      stopVpnTunnel()
                      return START_NOT_STICKY
                  }
                  if (action == "UPDATE_POLICY") {
                      val eco = intent.getBooleanExtra("ecoMode", false)
                      val locked = intent.getBooleanExtra("parentalLocked", false)
                      val blockedList = intent.getStringArrayListExtra("blockedDomains") ?: arrayListOf()
                      ecoModeEnabled.set(eco)
                      parentalLocked.set(locked)
                      blockedDomains.clear()
                      blockedDomains.addAll(blockedList)
                      if (locked) stopVpnTunnel()
                      return START_STICKY
                  }
                  if (!isRunning.get() && !parentalLocked.get()) {
                      val eco = intent?.getBooleanExtra("ecoMode", false) ?: false
                      ecoModeEnabled.set(eco)
                      startVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  try {
                      val mtuSize = if (ecoModeEnabled.get()) 1280 else 1500
                      val builder = Builder()
                          .setSession("النفق الموحد")
                          .setMtu(mtuSize)
                          .addAddress("10.88.0.2", 24)
                          .addDnsServer("1.1.1.3")
                          .addDnsServer("1.0.0.3")
                          .addRoute("10.99.99.0", 24)
                          .addRoute("10.88.0.0", 24)

                      try {
                          builder.addDisallowedApplication(packageName)
                      } catch (e: Exception) {}

                      vpnInterface = builder.establish()
                      if (vpnInterface != null) {
                          isRunning.set(true)
                          startPacketEngine()
                      }
                  } catch (e: Exception) {
                      isRunning.set(false)
                  }
              }

              private fun startPacketEngine() {
                  workerThread = Thread {
                      val fd = vpnInterface?.fileDescriptor ?: return@Thread
                      val inputStream = FileInputStream(fd)
                      val packet = ByteBuffer.allocate(32767)

                      while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                          try {
                              if (parentalLocked.get()) {
                                  stopVpnTunnel()
                                  break
                              }
                              val length = inputStream.read(packet.array())
                              if (length > 20) {
                                  val b0 = packet.get(16).toInt() and 0xFF
                                  val b1 = packet.get(17).toInt() and 0xFF
                                  val b2 = packet.get(18).toInt() and 0xFF

                                  if (b0 == 10 && b1 == 99 && b2 == 99) {
                                      cacheBytesCount.addAndGet(length.toLong())
                                  } else {
                                      wanBytesCount.addAndGet(length.toLong())
                                  }
                                  if (ecoModeEnabled.get() && length > 1100) {
                                      Thread.sleep(6)
                                  }
                                  packet.clear()
                              } else {
                                  Thread.sleep(12)
                              }
                          } catch (e: Exception) {
                              break
                          }
                      }
                  }
                  workerThread?.start()
              }

              private fun stopVpnTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try { vpnInterface?.close() } catch (e: Exception) {}
                  vpnInterface = null
                  stopSelf()
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }
          ''')

          write_clean(os.path.join(kt_dir, "MainActivity.kt"), '''
          package com.lvno.smartclient

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.VpnService
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.ArrayList

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.lvno.smartclient/vpn"
              private val VPN_REQUEST_CODE = 1001
              private val QR_REQUEST_CODE = 1002
              private var pendingResult: MethodChannel.Result? = null
              private var pendingQrResult: MethodChannel.Result? = null
              private var pendingEcoMode: Boolean = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val prefs = getSharedPreferences("lvno_local_store", Context.MODE_PRIVATE)
                      when (call.method) {
                          "getDeviceHardwareId" -> {
                              val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown_hw"
                              result.success(androidId)
                          }
                          "getLocalContactsJson" -> {
                              val jsonStr = prefs.getString("contacts_json", "{}") ?: "{}"
                              result.success(jsonStr)
                          }
                          "saveLocalContactsJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("contacts_json", jsonStr).apply()
                              result.success(true)
                          }
                          "scanQrNative" -> {
                              try {
                                  val intent = Intent("com.google.zxing.client.android.SCAN")
                                  intent.putExtra("SCAN_MODE", "QR_CODE_MODE")
                                  pendingQrResult = result
                                  startActivityForResult(intent, QR_REQUEST_CODE)
                              } catch (e: Exception) {
                                  result.success("")
                              }
                          }
                          "isVpnRunning" -> {
                              result.success(VpnTunnelService.isRunning.get())
                          }
                          "getTrafficStats" -> {
                              val wBytes = VpnTunnelService.wanBytesCount.getAndSet(0L)
                              val cBytes = VpnTunnelService.cacheBytesCount.getAndSet(0L)
                              val stats = mapOf("wanBytes" to wBytes, "cacheBytes" to cBytes)
                              result.success(stats)
                          }
                          "startVpn" -> {
                              pendingEcoMode = call.argument<Boolean>("ecoMode") ?: false
                              val prepareIntent = VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  launchVpnService()
                                  result.success(true)
                              }
                          }
                          "updatePolicy" -> {
                              val eco = call.argument<Boolean>("ecoMode") ?: false
                              val locked = call.argument<Boolean>("parentalLocked") ?: false
                              val blocked = call.argument<List<String>>("blockedDomains") ?: emptyList()
                              val intent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "UPDATE_POLICY"
                                  putExtra("ecoMode", eco)
                                  putExtra("parentalLocked", locked)
                                  putStringArrayListExtra("blockedDomains", ArrayList(blocked))
                              }
                              startService(intent)
                              result.success(true)
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "STOP_VPN"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun launchVpnService() {
                  val serviceIntent = Intent(this, VpnTunnelService::class.java).apply {
                      putExtra("ecoMode", pendingEcoMode)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.error("DENIED", "يلزم الموافقة لتفعيل النفق", null)
                      }
                      pendingResult = null
                  } else if (requestCode == QR_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val contents = data.getStringExtra("SCAN_RESULT") ?: ""
                          pendingQrResult?.success(contents)
                      } else {
                          pendingQrResult?.success("")
                      }
                      pendingQrResult = null
                  }
              }
          }
          ''')

          write_clean("android/app/src/main/AndroidManifest.xml", '''
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

              <application
                  android:label="نت سباي"
                  android:name="${applicationName}"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VpnTunnelService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          ''')

          write_clean("lib/smart_client_core.dart", '''
          import 'dart:async';
          import 'dart:convert';
          import 'package:flutter/services.dart';
          import 'package:cloud_firestore/cloud_firestore.dart';
          import 'package:http/http.dart' as http;

          class SmartClientEngine {
            String walletId = "";
            String currentHostId;
            String currentDynamicSecret = "";
            bool isVpnActive = false;
            bool ecoMode = false;
            bool isPurchasingChunk = false;

            int activeChunkTotalBytes = 0;
            int activeChunkConsumedBytes = 0;
            double currentChunkPriceYer = 25.0;
            double currentGbPriceYer = 250.0;
            int serverChunkSizeMb = 100;
            int serverRefillTriggerMb = 80;
            int serverCreditBalanceYer = 0;

            static const MethodChannel _vpnChannel = MethodChannel('com.lvno.smartclient/vpn');

            static const Map<String, List<String>> presetCategoryDomains = {
              'games': ['roblox.com', 'pubgmobile.com', 'freefiremobile.com', 'epicgames.com', 'steampowered.com', 'supercell.com'],
              'social': ['tiktok.com', 'instagram.com', 'facebook.com', 'snapchat.com', 'twitter.com', 'x.com'],
              'video': ['youtube.com', 'googlevideo.com', 'netflix.com', 'twitch.tv', 'shahid.mbc.net'],
            };

            SmartClientEngine({required this.currentHostId});

            double get remainingChunkMb {
              final int rem = activeChunkTotalBytes - activeChunkConsumedBytes;
              if (rem <= 0) return 0.0;
              return rem / (1024.0 * 1024.0);
            }

            double get consumedChunkMb {
              return activeChunkConsumedBytes / (1024.0 * 1024.0);
            }

            double get fuelPumpRealtimeBalanceYer {
              if (activeChunkTotalBytes <= 0) return serverCreditBalanceYer.toDouble();
              double remRatio = (activeChunkTotalBytes - activeChunkConsumedBytes) / activeChunkTotalBytes;
              if (remRatio < 0.0) remRatio = 0.0;
              if (remRatio > 1.0) remRatio = 1.0;
              return serverCreditBalanceYer.toDouble() + (remRatio * currentChunkPriceYer);
            }

            double get currentSessionConsumedYer {
              if (activeChunkTotalBytes <= 0) return 0.0;
              double usedRatio = activeChunkConsumedBytes / activeChunkTotalBytes;
              if (usedRatio < 0.0) usedRatio = 0.0;
              if (usedRatio > 1.0) usedRatio = 1.0;
              return usedRatio * currentChunkPriceYer;
            }

            Future<String> getDeviceHardwareId() async {
              try {
                final id = await _vpnChannel.invokeMethod<String>('getDeviceHardwareId');
                return (id != null && id.isNotEmpty) ? id : "dev_default_01";
              } catch (_) {
                return "dev_default_01";
              }
            }

            Future> getLocalContacts() async {
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getLocalContactsJson') ?? '{}';
                final Map<String, dynamic> decoded = jsonDecode(raw);
                final Map<String, String> out = {};
                decoded.forEach((k, v) {
                  if (!k.startsWith('__')) out[k] = v.toString();
                });
                return out;
              } catch (_) {
                return {};
              }
            }

            Future<void> saveLocalContact(String targetId, String aliasName) async {
              if (targetId.trim().isEmpty || aliasName.trim().isEmpty) return;
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getLocalContactsJson') ?? '{}';
                final Map<String, dynamic> decoded = jsonDecode(raw);
                decoded[targetId.trim()] = aliasName.trim();
                await _vpnChannel.invokeMethod('saveLocalContactsJson', {'json': jsonEncode(decoded)});
              } catch (_) {}
            }

            Future<void> loadSavedQuotaState() async {
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getLocalContactsJson') ?? '{}';
                final Map<String, dynamic> decoded = jsonDecode(raw);
                activeChunkTotalBytes = int.tryParse((decoded['__q_total__'] ?? '0').toString()) ?? 0;
                activeChunkConsumedBytes = int.tryParse((decoded['__q_used__'] ?? '0').toString()) ?? 0;
                currentChunkPriceYer = double.tryParse((decoded['__q_price__'] ?? '25.0').toString()) ?? 25.0;
              } catch (_) {}
            }

            Future<void> persistQuotaState() async {
              try {
                final raw = await _vpnChannel.invokeMethod<String>('getLocalContactsJson') ?? '{}';
                final Map<String, dynamic> decoded = jsonDecode(raw);
                decoded['__q_total__'] = activeChunkTotalBytes.toString();
                decoded['__q_used__'] = activeChunkConsumedBytes.toString();
                decoded['__q_price__'] = currentChunkPriceYer.toStringAsFixed(3);
                await _vpnChannel.invokeMethod('saveLocalContactsJson', {'json': jsonEncode(decoded)});
              } catch (_) {}
            }

            Future<String> tryScanQrNative() async {
              try {
                return await _vpnChannel.invokeMethod<String>('scanQrNative') ?? '';
              } catch (_) {
                return '';
              }
            }

            Future<void> knockMikroTikGateway({required bool unlock}) async {
              final int port = unlock ? 9981 : 9982;
              try {
                await http.get(Uri.parse('http://10.99.99.1:$port')).timeout(const Duration(milliseconds: 600));
              } catch (_) {}
            }

            Future<bool> verifyActiveHostNetwork(String hostId) async {
              final db = FirebaseFirestore.instance;
              final hostSnap = await db.collection('hosts').doc(hostId).get();
              if (!hostSnap.exists) return false;
              final hData = hostSnap.data()!;
              final status = (hData['status'] ?? 'active').toString();
              final bool approved = (hData['manual_admin_approved'] ?? true) == true;
              currentDynamicSecret = (hData['activation_secret'] ?? 'MK-LVNO-2026').toString().trim();
              currentHostId = hostId;
              return status == 'active' && approved && currentDynamicSecret.isNotEmpty;
            }

            Future<String> registerOrRecoverDeviceWallet() async {
              final db = FirebaseFirestore.instance;
              final deviceId = await getDeviceHardwareId();
              await _ensureDefaultSystemSettings(db);
              await loadSavedQuotaState();

              if (!await verifyActiveHostNetwork(currentHostId)) {
                throw Exception("يتطلب التفعيل الاتصال بنقطة معتمدة ومفعلة");
              }

              final devRef = db.collection('device_registry').doc(deviceId);
              final counterRef = db.collection('settings').doc('wallet_counter');
              final configRef = db.collection('settings').doc('global_config');

              return await db.runTransaction((tx) async {
                final devSnap = await tx.get(devRef);
                if (devSnap.exists && devSnap.data()?['wallet_id'] != null) {
                  walletId = devSnap.data()!['wallet_id'].toString();
                  return walletId;
                }
                final counterSnap = await tx.get(counterRef);
                final configSnap = await tx.get(configRef);

                int nextId = 1001;
                if (counterSnap.exists && counterSnap.data()?['last_wallet_number'] != null) {
                  nextId = ((counterSnap.data()!['last_wallet_number'] as num).toInt()) + 1;
                }
                int generalMaxBalance = 10000;
                int generalDailyLimit = 5000;
                if (configSnap.exists) {
                  generalMaxBalance = ((configSnap.data()?['general_tier_max_balance_yer'] ?? 10000) as num).toInt();
                  generalDailyLimit = ((configSnap.data()?['general_tier_daily_limit_yer'] ?? 5000) as num).toInt();
                }

                final newWalletId = nextId.toString();
                tx.set(counterRef, {'last_wallet_number': nextId}, SetOptions(merge: true));
                tx.set(devRef, {
                  'device_id': deviceId,
                  'wallet_id': newWalletId,
                  'registered_host_id': currentHostId,
                  'created_at': FieldValue.serverTimestamp(),
                });
                tx.set(db.collection('wallets').doc(newWalletId), {
                  'wallet_id': newWalletId,
                  'device_id': deviceId,
                  'display_name': 'حساب $newWalletId',
                  'full_name': '',
                  'cash_balance_yer': 0,
                  'credit_balance_yer': 0,
                  'tier': 'general',
                  'kyc_verified': false,
                  'custom_max_balance_yer': generalMaxBalance,
                  'custom_daily_limit_yer': generalDailyLimit,
                  'daily_transferred_today': 0,
                  'eco_mode': false,
                  'parent_wallet_id': '',
                  'parental_locked': false,
                  'daily_time_limit_mins': 0,
                  'used_time_today_mins': 0,
                  'blocked_categories': <String>[],
                  'custom_blocked_domains': <String>[],
                  'created_at': FieldValue.serverTimestamp(),
                });
                walletId = newWalletId;
                return newWalletId;
              });
            }

            Future<void> _ensureDefaultSystemSettings(FirebaseFirestore db) async {
              final cfgRef = db.collection('settings').doc('global_config');
              if (!(await cfgRef.get()).exists) {
                await cfgRef.set({
                  'gb_price_consumer_yer': 250,
                  'quota_chunk_mb': 100,
                  'quota_refill_trigger_mb': 80,
                  'system_profit_pct': 10.0,
                  'credit_sender_discount_pct': 7.0,
                  'credit_receiver_bonus_pct': 3.0,
                  'general_tier_max_balance_yer': 10000,
                  'general_tier_daily_limit_yer': 5000,
                });
              }
              final hostRef = db.collection('hosts').doc(currentHostId);
              if (!(await hostRef.get()).exists) {
                await hostRef.set({
                  'host_id': currentHostId,
                  'network_name': 'شبكة الهدى المفعلة',
                  'owner_wallet_id': '1001',
                  'auto_transfer_to_wallet': false,
                  'activation_secret': 'MK-LVNO-2026',
                  'manual_admin_approved': true,
                  'status': 'active',
                  'current_month_wan_mb': 0,
                  'amount_due_yer': 0,
                  'total_settled_to_wallet_yer': 0,
                });
              }
            }

            Future<void> purchaseQuotaChunkFromServer() async {
              if (isPurchasingChunk) return;
              isPurchasingChunk = true;
              try {
                final db = FirebaseFirestore.instance;
                final wRef = db.collection('wallets').doc(walletId);
                final hRef = db.collection('hosts').doc(currentHostId);
                final cfgRef = db.collection('settings').doc('global_config');

                final Map result = await db.runTransaction((tx) async {
                  final wSnap = await tx.get(wRef);
                  final hSnap = await tx.get(hRef);
                  final cfgSnap = await tx.get(cfgRef);

                  if (!wSnap.exists) throw Exception("الحساب غير موجود");
                  if (!hSnap.exists) throw Exception("الشبكة غير مسجلة");

                  final wData = wSnap.data()!;
                  final hData = hSnap.data()!;
                  final cfg = cfgSnap.data() ?? {};

                  if ((hData['status'] ?? 'inactive') != 'active' || (hData['manual_admin_approved'] ?? true) != true) {
                    throw Exception("الشبكة غير مفعلة حالياً من إدارة النظام");
                  }

                  final String ownerWalletId = (hData['owner_wallet_id'] ?? '').toString().trim();
                  final bool autoSettle = (hData['auto_transfer_to_wallet'] ?? false) == true;
                  final String liveSecret = (hData['activation_secret'] ?? 'MK-LVNO-2026').toString().trim();

                  final double gbPrice = ((cfg['gb_price_consumer_yer'] ?? 250) as num).toDouble();
                  final int chunkMb = ((cfg['quota_chunk_mb'] ?? 100) as num).toInt();
                  final int triggerMb = ((cfg['quota_refill_trigger_mb'] ?? 80) as num).toInt();
                  final double sysProfitPct = ((cfg['system_profit_pct'] ?? 10.0) as num).toDouble();

                  final int chunkCostYer = ((chunkMb / 1000.0) * gbPrice).round();
                  final int safeCost = chunkCostYer < 1 ? 1 : chunkCostYer;

                  final int currentCredit = ((wData['credit_balance_yer'] ?? 0) as num).toInt();
                  if (currentCredit < safeCost) {
                    throw Exception("رصيد الاستخدام ($currentCredit ريال) لا يكفي لشراء دفعة ($safeCost ريال)");
                  }

                  final int sysProfitYer = (safeCost * (sysProfitPct / 100.0)).round();
                  final int hostShareYer = safeCost - sysProfitYer;

                  tx.update(wRef, {
                    'credit_balance_yer': currentCredit - safeCost,
                    'updated_at': FieldValue.serverTimestamp(),
                  });

                  if (autoSettle && ownerWalletId.isNotEmpty) {
                    tx.set(db.collection('wallets').doc(ownerWalletId), {
                      'cash_balance_yer': FieldValue.increment(hostShareYer),
                      'updated_at': FieldValue.serverTimestamp(),
                    }, SetOptions(merge: true));
                    tx.set(hRef, {
                      'current_month_wan_mb': FieldValue.increment(chunkMb),
                      'total_settled_to_wallet_yer': FieldValue.increment(hostShareYer),
                      'last_heartbeat': FieldValue.serverTimestamp(),
                    }, SetOptions(merge: true));
                  } else {
                    tx.set(hRef, {
                      'current_month_wan_mb': FieldValue.increment(chunkMb),
                      'amount_due_yer': FieldValue.increment(hostShareYer),
                      'last_heartbeat': FieldValue.serverTimestamp(),
                    }, SetOptions(merge: true));
                  }

                  tx.set(db.collection('network_usage_logs').doc(), {
                    'host_id': currentHostId,
                    'wallet_id': walletId,
                    'chunk_mb': chunkMb,
                    'charged_yer': safeCost,
                    'host_share_yer': hostShareYer,
                    'sys_profit_yer': sysProfitYer,
                    'used_secret': liveSecret,
                    'timestamp': FieldValue.serverTimestamp(),
                  });

                  return {
                    'chunkMb': chunkMb,
                    'triggerMb': triggerMb,
                    'gbPrice': gbPrice,
                    'newCredit': currentCredit - safeCost,
                    'secret': liveSecret,
                  };
                });

                final int cMb = ((result['chunkMb'] ?? 100) as num).toInt();
                final int addedBytes = cMb * 1024 * 1024;
                final int remBytes = (activeChunkTotalBytes - activeChunkConsumedBytes) > 0
                    ? (activeChunkTotalBytes - activeChunkConsumedBytes)
                    : 0;

                activeChunkTotalBytes = remBytes + addedBytes;
                activeChunkConsumedBytes = 0;
                serverChunkSizeMb = cMb;
                serverRefillTriggerMb = ((result['triggerMb'] ?? 80) as num).toInt();
                currentGbPriceYer = ((result['gbPrice'] ?? 250) as num).toDouble();
                currentChunkPriceYer = (activeChunkTotalBytes / (1024.0 * 1024.0 * 1000.0)) * currentGbPriceYer;
                serverCreditBalanceYer = ((result['newCredit'] ?? 0) as num).toInt();
                currentDynamicSecret = (result['secret'] ?? '').toString();

                await persistQuotaState();
                isPurchasingChunk = false;
              } catch (e) {
                isPurchasingChunk = false;
                rethrow;
              }
            }

            Future<void> pollAndConsumeTrafficTick() async {
              if (!isVpnActive) return;
              try {
                final res = await _vpnChannel.invokeMapMethod<String, dynamic>('getTrafficStats');
                final int wBytes = ((res?['wanBytes'] ?? 0) as num).toInt();
                final int cBytes = ((res?['cacheBytes'] ?? 0) as num).toInt();
                final int delta = wBytes + cBytes;

                if (delta > 0) {
                  activeChunkConsumedBytes += delta;
                  if (activeChunkConsumedBytes > activeChunkTotalBytes) {
                    activeChunkConsumedBytes = activeChunkTotalBytes;
                  }
                  await persistQuotaState();
                }

                final int remBytes = activeChunkTotalBytes - activeChunkConsumedBytes;
                int lowWaterMb = serverChunkSizeMb - serverRefillTriggerMb;
                if (lowWaterMb < 5) lowWaterMb = 5;

                if (remBytes <= lowWaterMb * 1024 * 1024 && !isPurchasingChunk && serverCreditBalanceYer > 0) {
                  try {
                    await purchaseQuotaChunkFromServer();
                  } catch (_) {}
                }
                if (activeChunkTotalBytes - activeChunkConsumedBytes <= 0 && !isPurchasingChunk) {
                  await stopSmartConnection();
                }
              } catch (_) {}
            }

            Future<void> simulateFastFuelConsumption(int megabytesToConsume) async {
              if (!isVpnActive) {
                throw Exception("شغّل النفق أولاً لترى عداد البنزين يتحرك بالفاصلة العشرية");
              }
              activeChunkConsumedBytes += megabytesToConsume * 1024 * 1024;
              if (activeChunkConsumedBytes > activeChunkTotalBytes) {
                activeChunkConsumedBytes = activeChunkTotalBytes;
              }
              await persistQuotaState();

              final int remBytes = activeChunkTotalBytes - activeChunkConsumedBytes;
              int lowWaterMb = serverChunkSizeMb - serverRefillTriggerMb;
              if (lowWaterMb < 5) lowWaterMb = 5;
              if (remBytes <= lowWaterMb * 1024 * 1024 && !isPurchasingChunk && serverCreditBalanceYer > 0) {
                await purchaseQuotaChunkFromServer();
              }
              if (activeChunkTotalBytes - activeChunkConsumedBytes <= 0) {
                await stopSmartConnection();
              }
            }

            Future<int> withdrawHostEarningsToMyWallet(String hostId) async {
              final db = FirebaseFirestore.instance;
              final hRef = db.collection('hosts').doc(hostId);
              final wRef = db.collection('wallets').doc(walletId);

              final Map res = await db.runTransaction((tx) async {
                final hSnap = await tx.get(hRef);
                final wSnap = await tx.get(wRef);
                if (!hSnap.exists) throw Exception("الشبكة غير موجودة");
                if (!wSnap.exists) throw Exception("المحفظة غير موجودة");

                final hData = hSnap.data()!;
                if ((hData['owner_wallet_id'] ?? '').toString().trim() != walletId) {
                  throw Exception("هذه الشبكة غير مربوطة بمحفظتك (#$walletId)");
                }
                final int dueYer = ((hData['amount_due_yer'] ?? 0) as num).toInt();
                if (dueYer <= 0) throw Exception("لا توجد مستحقات معلقة للسحب حالياً");

                tx.update(hRef, {
                  'amount_due_yer': 0,
                  'total_settled_to_wallet_yer': FieldValue.increment(dueYer),
                  'updated_at': FieldValue.serverTimestamp(),
                });
                tx.update(wRef, {
                  'cash_balance_yer': FieldValue.increment(dueYer),
                  'updated_at': FieldValue.serverTimestamp(),
                });
                return {'pulled': dueYer};
              });
              return ((res['pulled'] ?? 0) as num).toInt();
            }

            Future<void> toggleHostAutoTransfer(String hostId, bool autoEnabled) async {
              await FirebaseFirestore.instance.collection('hosts').doc(hostId).update({
                'auto_transfer_to_wallet': autoEnabled,
              });
            }

            Future<void> syncDevicePolicyFromWalletDoc(Map<String, dynamic> wData) async {
              ecoMode = (wData['eco_mode'] ?? false) == true;
              serverCreditBalanceYer = ((wData['credit_balance_yer'] ?? 0) as num).toInt();
              final bool locked = (wData['parental_locked'] ?? false) == true;
              final int limitMins = ((wData['daily_time_limit_mins'] ?? 0) as num).toInt();
              final int usedMins = ((wData['used_time_today_mins'] ?? 0) as num).toInt();
              final bool timeExpired = (limitMins > 0 && usedMins >= limitMins);

              final List<dynamic> cats = (wData['blocked_categories'] as List<dynamic>?) ?? [];
              final List<dynamic> customDoms = (wData['custom_blocked_domains'] as List<dynamic>?) ?? [];

              final Set<String> compiledDomains = {};
              for (final c in cats) {
                final list = presetCategoryDomains[c.toString()];
                if (list != null) compiledDomains.addAll(list);
              }
              for (final d in customDoms) {
                if (d.toString().trim().isNotEmpty) compiledDomains.add(d.toString().trim().toLowerCase());
              }

              try {
                await _vpnChannel.invokeMethod('updatePolicy', {
                  'ecoMode': ecoMode,
                  'parentalLocked': locked || timeExpired,
                  'blockedDomains': compiledDomains.toList(),
                });
                if (locked || timeExpired) isVpnActive = false;
              } catch (_) {}
            }

            Future<bool> startSmartConnection(Map<String, dynamic> wData) async {
              if ((wData['parental_locked'] ?? false) == true) {
                throw Exception("تم إيقاف الاستخدام مؤقتاً من قِبل المشرف العائلي");
              }
              final int limitMins = ((wData['daily_time_limit_mins'] ?? 0) as num).toInt();
              final int usedMins = ((wData['used_time_today_mins'] ?? 0) as num).toInt();
              if (limitMins > 0 && usedMins >= limitMins) {
                throw Exception("انتهى وقت الاستخدام اليومي المخصص لهذا الجهاز");
              }
              if (!await verifyActiveHostNetwork(currentHostId)) {
                throw Exception("لا يمكن تشغيل النفق إلا على شبكة مفعلة");
              }
              await syncDevicePolicyFromWalletDoc(wData);

              if ((activeChunkTotalBytes - activeChunkConsumedBytes) <= 512 * 1024) {
                await purchaseQuotaChunkFromServer();
              }

              final ok = await _vpnChannel.invokeMethod<bool>('startVpn', {'ecoMode': ecoMode});
              isVpnActive = ok ?? false;
              if (isVpnActive) await knockMikroTikGateway(unlock: true);
              return isVpnActive;
            }

            Future<void> stopSmartConnection() async {
              await persistQuotaState();
              await knockMikroTikGateway(unlock: false);
              try {
                await _vpnChannel.invokeMethod('stopVpn');
              } catch (_) {}
              isVpnActive = false;
            }

            Future<void> toggleMyEcoMode(bool enabled) async {
              ecoMode = enabled;
              await FirebaseFirestore.instance.collection('wallets').doc(walletId).update({'eco_mode': enabled});
            }

            Future<void> linkFamilyMemberDevice(String childWalletId, String localNickname) async {
              final cleanId = childWalletId.replaceAll('LINK:', '').trim();
              if (cleanId.isEmpty || cleanId == walletId) throw Exception("معرف الجهاز غير صالح للربط");
              final db = FirebaseFirestore.instance;
              final childRef = db.collection('wallets').doc(cleanId);
              if (!(await childRef.get()).exists) throw Exception("الجهاز رقم ($cleanId) غير موجود");

              await childRef.update({'parent_wallet_id': walletId});
              await db.collection('wallets').doc(walletId).set({
                'linked_children': FieldValue.arrayUnion([cleanId]),
              }, SetOptions(merge: true));

              if (localNickname.trim().isNotEmpty) await saveLocalContact(cleanId, localNickname.trim());
