                                        width: 12, height: 12,
                                        child: CircularProgressIndicator(strokeWidth: 2, color: kWarning),
                                      ),
                                      SizedBox(width: 6),
                                      Text("جاري الشراء",
                                          style: TextStyle(fontSize: 10, color: kBlack, fontWeight: FontWeight.bold)),
                                    ],
                                  ),
                                ),
                            ],
                          ),
                          const SizedBox(height: 20),

                          const Text("الرصيد المتبقي اللحظي",
                              style: TextStyle(fontSize: 12, color: kSoftGray, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 8),
                          Container(
                            padding: const EdgeInsets.symmetric(vertical: 16, horizontal: 24),
                            decoration: BoxDecoration(
                              gradient: LinearGradient(
                                colors: isActive
                                    ? [kMandarinOrange, kMandarinDark]
