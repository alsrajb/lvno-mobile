                  }
                } catch (_) {}

                await _engine.registerOrRecoverDeviceWallet();
                if (mounted) setState(() => _isReady = true);
              } catch (e) {
                if (mounted) setState(() => _errorMsg = e.toString());
              }
            }

            @override
            Widget build(BuildContext context) {
              if (_errorMsg != null) {
                return Scaffold(
                  body: Center(
                    child: Padding(
                      padding: const EdgeInsets.all(24),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const Icon(Icons.error_outline, color: Colors.amber, size: 54),
                          const SizedBox(height: 14),
                          const Text("تنبيه التفعيل", style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 8),
                          Text(_errorMsg!, textAlign: TextAlign.center, style: const TextStyle(fontSize: 13, color: Colors.white70)),
                          const SizedBox(height: 20),
                          ElevatedButton(
                            onPressed: () {
                              setState(() => _errorMsg = null);
                              _initSystem();
                            },
                            child: const Text("إعادة المحاولة"),
                          ),
                        ],
                      ),
                    ),
                  ),
                );
              }
              if (!_isReady) {
                return const Scaffold(
                  body: Center(
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        CircularProgressIndicator(color: Color(0xFF10B981)),
                        SizedBox(height: 16),
                        Text("جاري فتح الحساب والتحقق من الشبكة...", style: TextStyle(fontSize: 15)),
                      ],
                    ),
                  ),
                );
              }
              return MainCommercialShell(engine: _engine);
            }
          }

          class MainCommercialShell extends StatefulWidget {
            final SmartClientEngine engine;
            const MainCommercialShell({super.key, required this.engine});

            @override
            State<MainCommercialShell> createState() => _MainCommercialShellState();
          }

          class _MainCommercialShellState extends State<MainCommercialShell> {
            int _currentTab = 0;
            final TextEditingController _receiverCtrl = TextEditingController();
            final TextEditingController _amountCtrl = TextEditingController(text: "1000");
            final TextEditingController _searchContactCtrl = TextEditingController();
