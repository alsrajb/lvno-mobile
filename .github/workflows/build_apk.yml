                          const SizedBox(height: 14),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              Column(
                                children: [
                                  const Text("صرف الدفعة الحالية", style: TextStyle(fontSize: 11, color: Colors.white54)),
                                  Text(
                                    "${sessionSpentYer.toStringAsFixed(3)} ريال",
                                    style: const TextStyle(fontSize: 15, fontWeight: FontWeight.bold, fontFamily: 'monospace', color: Colors.amber),
                                  ),
                                ],
                              ),
                              Column(
                                children: [
                                  const Text("المستهلك من الدفعة", style: TextStyle(fontSize: 11, color: Colors.white54)),
                                  Text(
                                    "${usedMb.toStringAsFixed(2)} MB",
