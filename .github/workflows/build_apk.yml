name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup Safe Build Environment
        run: |
          mkdir -p /tmp/backup
          if [ -d "lib" ]; then cp -r lib /tmp/backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/backup/; fi
          if [ -f "android/app/google-services.json" ]; then cp android/app/google-services.json /tmp/backup/; fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then cp android/app/src/main/AndroidManifest.xml /tmp/backup/; fi
          
          # إنشاء هيكل أندرويد قياسي نظيف
          flutter create --org com.lvno --project-name lvno_smart_client . --overwrite

          # استعادة ملفاتنا
          if [ -d "/tmp/backup/lib" ]; then cp -r /tmp/backup/lib/* lib/; fi
          if [ -f "/tmp/backup/pubspec.yaml" ]; then cp /tmp/backup/pubspec.yaml pubspec.yaml; fi
          if [ -f "/tmp/backup/google-services.json" ]; then cp /tmp/backup/google-services.json android/app/google-services.json; fi
          if [ -f "/tmp/backup/AndroidManifest.xml" ]; then cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml; fi

          # نسخ ملفات Kotlin إن وجدت
          mkdir -p android/app/src/main/kotlin/com/lvno/smartclient
          find . -name "VpnTunnelService.kt" -exec cp {} android/app/src/main/kotlin/com/lvno/smartclient/ \; 2>/dev/null || true
          find . -name "MainActivity.kt" -exec cp {} android/app/src/main/kotlin/com/lvno/smartclient/ \; 2>/dev/null || true

      - name: Configure Gradle & MinSdk
        run: |
          python3 - << 'EOF'
          import os, re
          
          # ضبط minSdk 23 لدعم مكتبات Firebase
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_gradle):
              txt = open(app_gradle).read()
              txt = re.sub(r'minSdk\s*=?\s*flutter\.minSdkVersion', 'minSdk = 23', txt)
              txt = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 23', txt)
              open(app_gradle, "w").write(txt)
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-shrink

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: LVNO-SmartClient-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
