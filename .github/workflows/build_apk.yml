          class _CameraQrScannerModal extends StatefulWidget {
            final String title;
            const _CameraQrScannerModal({required this.title});

            @override
            State<_CameraQrScannerModal> createState() => _CameraQrScannerModalState();
          }

          class _CameraQrScannerModalState extends State<_CameraQrScannerModal> {
            final MobileScannerController _scannerController = MobileScannerController();
            final TextEditingController _manualInputCtrl = TextEditingController();
            bool _detected = false;

            @override
            void dispose() {
              _scannerController.dispose();
              _manualInputCtrl.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Padding(
                padding: EdgeInsets.only(
                  left: 16,
                  right: 16,
                  top: 16,
                  bottom: MediaQuery.of(context).viewInsets.bottom + 16,
                ),
                child: Column(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    Row(
                      children: [
                        const Icon(Icons.qr_code_scanner, color: kMandarinOrange, size: 24),
                        const SizedBox(width: 8),
                        Expanded(
                          child: Text(
                            widget.title,
                            style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16, color: Colors.white),
                          ),
                        ),
                        IconButton(
                          icon: const Icon(Icons.flash_on, color: kMandarinOrange),
                          onPressed: () => _scannerController.toggleTorch(),
                        ),
                        IconButton(
                          icon: const Icon(Icons.close, color: Colors.white70),
                          onPressed: () => Navigator.pop(context),
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    SizedBox(
                      height: 300,
                      child: ClipRRect(
                        borderRadius: BorderRadius.circular(18),
                        child: Stack(
                          alignment: Alignment.center,
                          children: [
                            MobileScanner(
                              controller: _scannerController,
                              onDetect: (capture) {
                                if (_detected) return;
                                for (final barcode in capture.barcodes) {
                                  final raw = barcode.rawValue;
                                  if (raw != null && raw.trim().isNotEmpty) {
                                    _detected = true;
                                    Navigator.pop(context, raw.trim());
                                    break;
                                  }
                                }
                              },
                            ),
                            Container(
                              width: 220,
                              height: 220,
                              decoration: BoxDecoration(
                                borderRadius: BorderRadius.circular(18),
                                border: Border.all(color: kMandarinOrange, width: 3.5),
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    Row(
                      children: [
                        Expanded(
                          child: TextField(
                            controller: _manualInputCtrl,
                            keyboardType: TextInputType.number,
                            decoration: _dec("أو اكتب الرقم يدوياً..."),
                          ),
                        ),
                        const SizedBox(width: 8),
                        ElevatedButton(
                          onPressed: () {
                            final v = _manualInputCtrl.text.trim();
                            if (v.isNotEmpty) Navigator.pop(context, v);
                          },
                          child: const Text("تأكيد"),
                        ),
                      ],
                    ),
                  ],
                ),
              );
            }
          }
