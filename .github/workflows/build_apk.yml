                                      activeColor: const Color(0xFF10B981),
                                      onChanged: (val) async {
                                        try {
                                          if (val) {
                                            final started = await _engine.startSmartConnection();
                                            setState(() {
                                              _statusMessage = started
                                                  ? "✅ تم تشغيل نفق VPN أندرويد الحقيقي (انظر علامة المفتاح 🔑 أعلى الشاشة)"
