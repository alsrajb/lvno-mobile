name: Build LVNO SmartClient APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Compact LVNO V6 Project (100MB Sync + Auto-Reconnect + Camera QR + Dark Orange UI)
        shell: python
        run: |
          import os, sys, shutil, json, subprocess, re, textwrap

          gs_data = {}
          icon_found = False

          for root, dirs, files in os.walk("."):
              if ".git" in root: continue
              for f in files:
                  full_p = os.path.join(root, f)
                  if f.startswith("google-services.json"):
                      shutil.copy2(full_p, "/tmp/google-services.json")
                      try:
                          gs_data = json.load(open(full_p))
                      except Exception:
                          pass
                  if f in ["app_icon.png", "app_icon", "app_icon.jpg", "app_icon.jpeg"] and not icon_found:
                      shutil.copy2(full_p, "/tmp/app_icon_src")
                      icon_found = True

          proj_info = gs_data.get("project_info", {})
          project_id = proj_info.get("project_id", "netspay-1f0fc")
          sender_id = proj_info.get("project_number", "000000000000")
          client_list = gs_data.get("client", [{}])
          first_client = client_list[0] if client_list else {}
          app_id = first_client.get("client_info", {}).get("mobilesdk_app_id", "1:000000000000:android:000000000000")
          api_key_list = first_client.get("api_key", [{}])
          api_key = api_key_list[0].get("current_key", "") if api_key_list else ""

          for item in os.listdir("."):
              if item not in [".git", ".github"]:
                  if os.path.isdir(item): shutil.rmtree(item)
                  else: os.remove(item)

          subprocess.run(["flutter", "create", "--org", "com.lvno", "--project-name", "smartclient", "--platforms=android", "."], check=True)

          if icon_found and os.path.exists("/tmp/app_icon_src"):
              res_dir = "android/app/src/main/res"
              try:
                  subprocess.run([sys.executable, "-m", "pip", "install", "--break-system-packages", "--quiet", "Pillow"], check=True)
                  from PIL import Image, ImageDraw
                  img = Image.open("/tmp/app_icon_src").convert("RGBA")
                  w, h = img.size
                  for corner in [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]:
                      ImageDraw.floodfill(img, corner, (0, 0, 0, 0), thresh=45)
                  for folder, size in [("mipmap-mdpi", 48), ("mipmap-hdpi", 72), ("mipmap-xhdpi", 96), ("mipmap-xxhdpi", 144), ("mipmap-xxxhdpi", 192)]:
                      target_dir = os.path.join(res_dir, folder)
                      os.makedirs(target_dir, exist_ok=True)
                      resized = img.resize((size, size), Image.Resampling.LANCZOS)
                      resized.save(os.path.join(target_dir, "ic_launcher.png"), "PNG")
              except Exception:
                  for folder in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                      target_dir = os.path.join(res_dir, folder)
                      os.makedirs(target_dir, exist_ok=True)
                      shutil.copy2("/tmp/app_icon_src", os.path.join(target_dir, "ic_launcher.png"))
              for anydpi in ["mipmap-anydpi-v26", "mipmap-anydpi"]:
                  any_dir = os.path.join(res_dir, anydpi)
                  if os.path.exists(any_dir):
                      shutil.rmtree(any_dir)

          if os.path.exists("test"):
              shutil.rmtree("test")

          if os.path.exists("/tmp/google-services.json"):
              shutil.copy2("/tmp/google-services.json", "android/app/google-services.json")

          def write_clean(path, text):
              norm = text.replace("\u00a0", " ")
              cleaned = textwrap.dedent(norm).strip() + "\n"
              open(path, "w", encoding="utf-8").write(cleaned)

          write_clean("pubspec.yaml", r'''
          name: smartclient
          description: Unified Commercial Network App
          publish_to: 'none'
          version: 6.6.0+23

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            firebase_core: ^3.6.0
            firebase_auth: ^5.3.1
            cloud_firestore: ^5.4.4
            http: ^1.2.2
            crypto: ^3.0.5
            qr_flutter: ^4.1.0
            mobile_scanner: ^5.2.3

          flutter:
            uses-material-design: true
          ''')

          kt_dir = "android/app/src/main/kotlin/com/lvno/smartclient"
          os.makedirs(kt_dir, exist_ok=True)

          write_clean(os.path.join(kt_dir, "VpnTunnelService.kt"), r'''
          package com.lvno.smartclient

          import android.content.Intent
          import android.net.TrafficStats
          import android.net.VpnService
          import android.os.ParcelFileDescriptor
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress
          import java.nio.ByteBuffer
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.atomic.AtomicBoolean
          import java.util.concurrent.atomic.AtomicLong

          class VpnTunnelService : VpnService() {
              companion object {
                  val isRunning = AtomicBoolean(false)
                  val ecoModeEnabled = AtomicBoolean(false)
                  val parentalLocked = AtomicBoolean(false)
                  val wanBytesCount = AtomicLong(0L)
                  val cacheBytesCount = AtomicLong(0L)
                  val blockedDnsCount = AtomicLong(0L)
                  var lastTotalBytes: Long = 0L
                  val blockedDomains = ConcurrentHashMap.newKeySet<String>()
              }

              private var vpnInterface: ParcelFileDescriptor? = null
              private var workerThread: Thread? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val action = intent?.action
                  if (action == "STOP_VPN") {
                      stopVpnTunnel()
                      return START_NOT_STICKY
                  }
                  if (action == "UPDATE_POLICY") {
                      val eco = intent.getBooleanExtra("ecoMode", false)
                      val locked = intent.getBooleanExtra("parentalLocked", false)
                      val csv = intent.getStringExtra("blockedCsv") ?: ""
                      ecoModeEnabled.set(eco)
                      parentalLocked.set(locked)
                      blockedDomains.clear()
                      for (part in csv.split(",")) {
                          val d = part.trim().lowercase()
                          if (d.isNotEmpty()) blockedDomains.add(d)
                      }
                      if (locked) stopVpnTunnel()
                      return START_STICKY
                  }
                  if (!isRunning.get() && !parentalLocked.get()) {
                      val eco = intent?.getBooleanExtra("ecoMode", false) ?: false
                      ecoModeEnabled.set(eco)
                      startVpnTunnel()
                  }
                  return START_STICKY
              }

              private fun startVpnTunnel() {
                  try {
                      val rx = TrafficStats.getTotalRxBytes()
                      val tx = TrafficStats.getTotalTxBytes()
                      lastTotalBytes = if (rx > 0L && tx > 0L) (rx + tx) else 0L
                      wanBytesCount.set(0L)
                      cacheBytesCount.set(0L)

                      val mtuSize = if (ecoModeEnabled.get()) 1280 else 1500
                      val builder = Builder()
                          .setSession("النفق الموحد")
                          .setMtu(mtuSize)
                          .addAddress("10.88.0.2", 24)
                          .addDnsServer("1.1.1.3")
                          .addDnsServer("1.0.0.3")
                          .addRoute("10.99.99.0", 24)
                          .addRoute("10.88.0.0", 24)

                      if (blockedDomains.isNotEmpty()) {
                          builder.addRoute("1.1.1.3", 32)
                          builder.addRoute("1.0.0.3", 32)
                      }

                      try {
                          builder.addDisallowedApplication(packageName)
                      } catch (e: Exception) {}

                      vpnInterface = builder.establish()
                      if (vpnInterface != null) {
                          isRunning.set(true)
                          startPacketEngine()
                      }
                  } catch (e: Exception) {
                      isRunning.set(false)
                  }
              }

              private fun startPacketEngine() {
                  workerThread = Thread {
                      val fd = vpnInterface?.fileDescriptor ?: return@Thread
                      val inputStream = FileInputStream(fd)
                      val outputStream = FileOutputStream(fd)
                      val packet = ByteBuffer.allocate(32767)

                      while (isRunning.get() && !Thread.currentThread().isInterrupted) {
                          try {
                              if (parentalLocked.get()) {
                                  stopVpnTunnel()
                                  break
                              }
                              val arr = packet.array()
                              val length = inputStream.read(arr)
                              if (length > 20) {
                                  val version = (arr[0].toInt() ushr 4) and 0x0F
                                  val ihl = (arr[0].toInt() and 0x0F) * 4
                                  val protocol = arr[9].toInt() and 0xFF

                                  if (version == 4 && protocol == 17 && length > ihl + 20) {
                                      val dstPort = ((arr[ihl + 2].toInt() and 0xFF) shl 8) or (arr[ihl + 3].toInt() and 0xFF)
                                      if (dstPort == 53) {
                                          handleBlockOnlyDns(arr.copyOf(length), length, ihl, outputStream)
                                          packet.clear()
                                          continue
                                      }
                                  }

                                  val b0 = arr[16].toInt() and 0xFF
                                  val b1 = arr[17].toInt() and 0xFF
                                  val b2 = arr[18].toInt() and 0xFF

                                  if (b0 == 10 && b1 == 99 && b2 == 99) {
                                      cacheBytesCount.addAndGet(length.toLong())
                                  } else {
                                      wanBytesCount.addAndGet(length.toLong())
                                  }
                                  if (ecoModeEnabled.get() && length > 1100) {
                                      Thread.sleep(6L)
                                  }
                                  packet.clear()
                              } else {
                                  Thread.sleep(12L)
                              }
                          } catch (e: Exception) {
                              isRunning.set(false)
                              try { vpnInterface?.close() } catch (_: Exception) {}
                              vpnInterface = null
                              break
                          }
                      }
                  }
                  workerThread?.start()
              }

              private fun handleBlockOnlyDns(ipPacket: ByteArray, totalLen: Int, ihl: Int, outStream: FileOutputStream) {
                  val dnsOffset = ihl + 8
                  if (totalLen - dnsOffset < 12) return

                  val dnsQuery = ipPacket.copyOfRange(dnsOffset, totalLen)
                  val domain = extractDomainName(dnsQuery)

                  if (domain.isNotEmpty() && isDomainBlocked(domain)) {
                      val nxResp = buildNxDomainResponse(dnsQuery)
                      val replyIp = buildIpv4UdpReply(ipPacket, ihl, nxResp)
                      synchronized(outStream) { outStream.write(replyIp) }
                      blockedDnsCount.incrementAndGet()
                      return
                  }

                  val dstIpBytes = ipPacket.copyOfRange(16, 20)
                  Thread {
                      var upstreamSocket: DatagramSocket? = null
                      try {
                          upstreamSocket = DatagramSocket()
                          protect(upstreamSocket)
                          upstreamSocket.soTimeout = 2500
                          val upPkt = DatagramPacket(dnsQuery, dnsQuery.size, InetAddress.getByAddress(dstIpBytes), 53)
                          upstreamSocket.send(upPkt)

                          val respBuf = ByteArray(1500)
                          val respPkt = DatagramPacket(respBuf, respBuf.size)
                          upstreamSocket.receive(respPkt)
                          val validResp = respBuf.copyOf(respPkt.length)

                          val replyIp = buildIpv4UdpReply(ipPacket, ihl, validResp)
                          synchronized(outStream) { outStream.write(replyIp) }
                      } catch (_: Exception) {
                      } finally {
                          try { upstreamSocket?.close() } catch (_: Exception) {}
                      }
                  }.start()
              }

              private fun isDomainBlocked(domain: String): Boolean {
                  val lower = domain.lowercase()
                  for (b in blockedDomains) {
                      if (lower == b || lower.endsWith(".$b")) return true
                  }
                  return false
              }

              private fun extractDomainName(dns: ByteArray): String {
                  return try {
                      var pos = 12
                      val sb = StringBuilder()
                      while (pos < dns.size) {
                          val len = dns[pos].toInt() and 0xFF
                          if (len == 0) break
                          if (len >= 0xC0 || pos + 1 + len > dns.size) break
                          if (sb.isNotEmpty()) sb.append('.')
                          for (i in 0 until len) {
                              sb.append((dns[pos + 1 + i].toInt() and 0xFF).toChar())
                          }
                          pos += len + 1
                      }
                      sb.toString()
                  } catch (_: Exception) { "" }
              }

              private fun buildNxDomainResponse(query: ByteArray): ByteArray {
                  val resp = query.copyOf()
                  if (resp.size >= 4) {
                      resp[2] = ((resp[2].toInt() and 0xFF) or 0x81).toByte()
                      resp[3] = 0x83.toByte()
                  }
                  return resp
              }

              private fun buildIpv4UdpReply(origIp: ByteArray, ihl: Int, udpPayload: ByteArray): ByteArray {
                  val udpLen = 8 + udpPayload.size
                  val totalIpLen = 20 + udpLen
                  val out = ByteArray(totalIpLen)

                  out[0] = 0x45.toByte()
                  out[1] = 0x00.toByte()
                  out[2] = ((totalIpLen ushr 8) and 0xFF).toByte()
                  out[3] = (totalIpLen and 0xFF).toByte()
                  out[4] = 0x00.toByte()
                  out[5] = 0x00.toByte()
                  out[6] = 0x40.toByte()
                  out[7] = 0x00.toByte()
                  out[8] = 64.toByte()
                  out[9] = 17.toByte()

                  System.arraycopy(origIp, 16, out, 12, 4)
                  System.arraycopy(origIp, 12, out, 16, 4)

                  var sum = 0
                  for (i in 0 until 20 step 2) {
                      if (i == 10) continue
                      val word = ((out[i].toInt() and 0xFF) shl 8) or (out[i + 1].toInt() and 0xFF)
                      sum += word
                  }
                  while ((sum ushr 16) != 0) {
                      sum = (sum and 0xFFFF) + (sum ushr 16)
                  }
                  val ipCsum = sum.inv() and 0xFFFF
                  out[10] = ((ipCsum ushr 8) and 0xFF).toByte()
                  out[11] = (ipCsum and 0xFF).toByte()

                  out[20] = origIp[ihl + 2]
                  out[21] = origIp[ihl + 3]
                  out[22] = origIp[ihl]
                  out[23] = origIp[ihl + 1]
                  out[24] = ((udpLen ushr 8) and 0xFF).toByte()
                  out[25] = (udpLen and 0xFF).toByte()
                  out[26] = 0x00.toByte()
                  out[27] = 0x00.toByte()

                  System.arraycopy(udpPayload, 0, out, 28, udpPayload.size)
                  return out
              }

              private fun stopVpnTunnel() {
                  isRunning.set(false)
                  workerThread?.interrupt()
                  workerThread = null
                  try { vpnInterface?.close() } catch (e: Exception) {}
                  vpnInterface = null
                  stopSelf()
              }

              override fun onRevoke() {
                  stopVpnTunnel()
                  super.onRevoke()
              }

              override fun onDestroy() {
                  stopVpnTunnel()
                  super.onDestroy()
              }
          }
          ''')

          write_clean(os.path.join(kt_dir, "MainActivity.kt"), r'''
          package com.lvno.smartclient

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.net.TrafficStats
          import android.net.VpnService
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.ByteArrayOutputStream
          import java.net.DatagramPacket
          import java.net.DatagramSocket
          import java.net.InetAddress

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.lvno.smartclient/vpn"
              private val VPN_REQUEST_CODE = 1001
              private val QR_REQUEST_CODE = 1002
              private var pendingResult: MethodChannel.Result? = null
              private var pendingQrResult: MethodChannel.Result? = null
              private var pendingEcoMode: Boolean = false

              private fun verifyMikroTikSignature(routerIp: String, domainToQuery: String): Boolean {
                  var socket: DatagramSocket? = null
                  try {
                      socket = DatagramSocket()
                      socket.soTimeout = 1500
                      val out = ByteArrayOutputStream()
                      out.write(byteArrayOf(0x12, 0x34, 0x01, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00))
                      for (part in domainToQuery.split(".")) {
                          val b = part.toByteArray()
                          out.write(b.size)
                          out.write(b)
                      }
                      out.write(byteArrayOf(0x00, 0x00, 0x01, 0x00, 0x01))
                      val req = out.toByteArray()
                      val pkt = DatagramPacket(req, req.size, InetAddress.getByName(routerIp), 53)
                      socket.send(pkt)

                      val buf = ByteArray(512)
                      val resp = DatagramPacket(buf, buf.size)
                      socket.receive(resp)
                      val len = resp.length
                      if (len >= 16) {
                          val b0 = buf[len - 4].toInt() and 0xFF
                          val b1 = buf[len - 3].toInt() and 0xFF
                          val b2 = buf[len - 2].toInt() and 0xFF
                          val b3 = buf[len - 1].toInt() and 0xFF
                          if (b0 == 10 && b1 == 99 && b2 == 99 && b3 == 1) {
                              return true
                          }
                      }
                      return false
                  } catch (e: Exception) {
                      return false
                  } finally {
                      try { socket?.close() } catch (e: Exception) {}
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val prefs = getSharedPreferences("lvno_local_store", Context.MODE_PRIVATE)
                      when (call.method) {
                          "getDeviceHardwareId" -> {
                              val androidId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "unknown_hw"
                              result.success(androidId)
                          }
                          "getLocalContactsJson" -> {
                              val jsonStr = prefs.getString("contacts_json", "{}") ?: "{}"
                              result.success(jsonStr)
                          }
                          "saveLocalContactsJson" -> {
                              val jsonStr = call.argument<String>("json") ?: "{}"
                              prefs.edit().putString("contacts_json", jsonStr).apply()
                              result.success(true)
                          }
                          "checkPhysicalRouter" -> {
                              val gatewayIp = call.argument<String>("gatewayIp") ?: "10.99.99.1"
                              val hostId = call.argument<String>("hostId") ?: "host_alhuda_01"
                              Thread {
                                  var matched = verifyMikroTikSignature(gatewayIp, "$hostId.lvno.local")
                                  if (!matched) {
                                      matched = verifyMikroTikSignature(gatewayIp, "gateway.lvno.local")
                                  }
                                  if (!matched && gatewayIp != "10.99.99.1") {
                                      matched = verifyMikroTikSignature("10.99.99.1", "gateway.lvno.local")
                                  }
                                  runOnUiThread { result.success(matched) }
                              }.start()
                          }
                          "scanQrNative" -> {
                              try {
                                  val intent = Intent("com.google.zxing.client.android.SCAN")
                                  intent.putExtra("SCAN_MODE", "QR_CODE_MODE")
                                  pendingQrResult = result
                                  startActivityForResult(intent, QR_REQUEST_CODE)
                              } catch (e: Exception) {
                                  result.success("")
                              }
                          }
                          "isVpnRunning" -> {
                              result.success(VpnTunnelService.isRunning.get())
                          }
                          "getTrafficStats" -> {
                              var wBytes = VpnTunnelService.wanBytesCount.getAndSet(0L)
                              val cBytes = VpnTunnelService.cacheBytesCount.getAndSet(0L)
                              if (VpnTunnelService.isRunning.get()) {
                                  val rx = TrafficStats.getTotalRxBytes()
                                  val tx = TrafficStats.getTotalTxBytes()
                                  if (rx > 0L && tx > 0L) {
                                      val nowTotal = rx + tx
                                      if (VpnTunnelService.lastTotalBytes > 0L && nowTotal > VpnTunnelService.lastTotalBytes) {
                                          val osDelta = nowTotal - VpnTunnelService.lastTotalBytes
                                          if (osDelta > wBytes) {
                                              wBytes = osDelta
                                          }
                                      }
                                      VpnTunnelService.lastTotalBytes = nowTotal
                                  }
                              }
                              val stats = mapOf<String, Any>(
                                  "wanBytes" to wBytes,
                                  "cacheBytes" to cBytes,
                                  "blockedDns" to VpnTunnelService.blockedDnsCount.get(),
                                  "blockedRules" to VpnTunnelService.blockedDomains.size
                              )
                              result.success(stats)
                          }
                          "startVpn" -> {
                              pendingEcoMode = call.argument<Boolean>("ecoMode") ?: false
                              val prepareIntent = VpnService.prepare(this)
                              if (prepareIntent != null) {
                                  pendingResult = result
                                  startActivityForResult(prepareIntent, VPN_REQUEST_CODE)
                              } else {
                                  launchVpnService()
                                  result.success(true)
                              }
                          }
                          "updatePolicy" -> {
                              val eco = call.argument<Boolean>("ecoMode") ?: false
                              val locked = call.argument<Boolean>("parentalLocked") ?: false
                              val blockedCsv = call.argument<String>("blockedCsv") ?: ""
                              val intent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "UPDATE_POLICY"
                                  putExtra("ecoMode", eco)
                                  putExtra("parentalLocked", locked)
                                  putExtra("blockedCsv", blockedCsv)
                              }
                              startService(intent)
                              result.success(true)
                          }
                          "stopVpn" -> {
                              val stopIntent = Intent(this, VpnTunnelService::class.java).apply {
                                  action = "STOP_VPN"
                              }
                              startService(stopIntent)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun launchVpnService() {
                  val serviceIntent = Intent(this, VpnTunnelService::class.java).apply {
                      putExtra("ecoMode", pendingEcoMode)
                  }
                  startService(serviceIntent)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VPN_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK) {
                          launchVpnService()
                          pendingResult?.success(true)
                      } else {
                          pendingResult?.error("DENIED", "يلزم الموافقة لتفعيل النفق", null)
                      }
                      pendingResult = null
                  } else if (requestCode == QR_REQUEST_CODE) {
                      if (resultCode == Activity.RESULT_OK && data != null) {
                          val contents = data.getStringExtra("SCAN_RESULT") ?: ""
                          pendingQrResult?.success(contents)
                      } else {
                          pendingQrResult?.success("")
                      }
                      pendingQrResult = null
                  }
              }
          }
          ''')

          write_clean("android/app/src/main/AndroidManifest.xml", r'''
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>

              <application
                  android:label="نت سباي"
                  android:name="${applicationName}"
                  android:usesCleartextTraffic="true"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VpnTunnelService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>

                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          ''')

          main_code = r'''
