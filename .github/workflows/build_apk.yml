            Widget _buildChildControlCard(String childId) {
              final db = FirebaseFirestore.instance;
              final localName = _localContacts[childId] ?? "جهاز #$childId";

              return StreamBuilder<DocumentSnapshot>(
                stream: db.collection('wallets').doc(childId).snapshots(),
                builder: (context, snap) {
                  if (!snap.hasData || !snap.data!.exists) return const SizedBox.shrink();
                  final c = snap.data!.data() as Map<String, dynamic>;
                  final bool locked = (c['parental_locked'] ?? false) == true;
                  final bool childEco = (c['eco_mode'] ?? false) == true;
                  final int timeLimit = ((c['daily_time_limit_mins'] ?? 0) as num).toInt();
                  final int usedMins = ((c['used_time_today_mins'] ?? 0) as num).toInt();
                  final List<String> blockedCats = List<String>.from((c['blocked_categories'] as List<dynamic>?) ?? []);

                  return Container(
                    margin: const EdgeInsets.only(bottom: 14),
                    padding: const EdgeInsets.all(16),
                    decoration: BoxDecoration(
                      color: kWhite,
                      borderRadius: BorderRadius.circular(16),
                      border: Border.all(
                        color: locked ? kDanger.withOpacity(0.5) : kMandarinOrange,
                        width: 2,
                      ),
                    ),
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Row(
                          children: [
                            Container(
                              padding: const EdgeInsets.all(10),
                              decoration: BoxDecoration(
                                color: locked ? kDanger.withOpacity(0.15) : kMandarinOrange.withOpacity(0.15),
                                shape: BoxShape.circle,
                              ),
                              child: Icon(
                                locked ? Icons.lock : Icons.phone_android,
                                color: locked ? kDanger : kMandarinOrange,
                                size: 20,
                              ),
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: Column(
                                crossAxisAlignment: CrossAxisAlignment.start,
                                children: [
                                  Text(localName,
                                      style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 15, color: kBlack)),
                                  Text("#$childId",
                                      style: const TextStyle(fontSize: 11, color: kSoftGray, fontFamily: 'monospace')),
                                ],
                              ),
                            ),
                            Switch(
                              value: !locked,
                              activeColor: kSuccess,
                              inactiveThumbColor: kDanger,
                              onChanged: (allow) {
                                db.collection('wallets').doc(childId).update({'parental_locked': !allow});
                              },
                            ),
                          ],
                        ),

                        if (locked)
                          Container(
                            margin: const EdgeInsets.only(top: 10),
                            padding: const EdgeInsets.all(10),
                            decoration: BoxDecoration(
                              color: kDanger.withOpacity(0.1),
                              borderRadius: BorderRadius.circular(8),
                              border: Border.all(color: kDanger.withOpacity(0.3)),
                            ),
                            child: const Row(
                              children: [
                                Icon(Icons.block, color: kDanger, size: 16),
                                SizedBox(width: 6),
                                Text("الاستخدام موقوف حالياً",
                                    style: TextStyle(fontSize: 12, color: kDanger, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ),

                        const Divider(color: kMidGray, height: 20),

                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          dense: true,
                          secondary: const Icon(Icons.eco, color: kSuccess, size: 20),
                          title: const Text("الوضع الاقتصادي",
                              style: TextStyle(color: kBlack, fontSize: 13, fontWeight: FontWeight.bold)),
                          subtitle: const Text("توفير الرصيد",
                              style: TextStyle(fontSize: 10, color: kSoftGray)),
                          value: childEco,
                          activeColor: kMandarinOrange,
                          onChanged: (v) => db.collection('wallets').doc(childId).update({'eco_mode': v}),
                        ),

                        Container(
                          padding: const EdgeInsets.all(12),
                          decoration: BoxDecoration(
                            color: kLightGray,
                            borderRadius: BorderRadius.circular(10),
                          ),
                          child: Row(
                            children: [
                              const Icon(Icons.timer, color: kMandarinOrange, size: 20),
                              const SizedBox(width: 8),
                              Expanded(
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    const Text("الحد اليومي",
                                        style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: kBlack)),
                                    Text(
                                      timeLimit == 0
                                          ? "مفتوح (بلا حد)"
                                          : "$usedMins / $timeLimit دقيقة مستخدمة",
                                      style: TextStyle(
                                        fontSize: 11,
                                        color: (timeLimit > 0 && usedMins >= timeLimit) ? kDanger : kSoftGray,
                                        fontWeight: FontWeight.bold,
                                      ),
                                    ),
                                  ],
                                ),
                              ),
                              DropdownButton<int>(
                                value: [0, 60, 120, 180, 300].contains(timeLimit) ? timeLimit : 0,
                                dropdownColor: kWhite,
                                underline: Container(),
                                items: const [
                                  DropdownMenuItem(value: 0, child: Text("مفتوح", style: TextStyle(color: kBlack, fontSize: 12))),
                                  DropdownMenuItem(value: 60, child: Text("ساعة", style: TextStyle(color: kBlack, fontSize: 12))),
                                  DropdownMenuItem(value: 120, child: Text("ساعتان", style: TextStyle(color: kBlack, fontSize: 12))),
                                  DropdownMenuItem(value: 180, child: Text("3 ساعات", style: TextStyle(color: kBlack, fontSize: 12))),
                                  DropdownMenuItem(value: 300, child: Text("5 ساعات", style: TextStyle(color: kBlack, fontSize: 12))),
                                ],
                                onChanged: (val) {
                                  if (val != null) db.collection('wallets').doc(childId).update({'daily_time_limit_mins': val});
                                },
                              ),
                            ],
                          ),
                        ),

                        const SizedBox(height: 10),

                        const Text("حظر الفئات",
                            style: TextStyle(fontSize: 12, fontWeight: FontWeight.bold, color: kBlack)),
                        const SizedBox(height: 6),
                        Wrap(
                          spacing: 6, runSpacing: 6,
                          children: [
                            _filterChip(childId, blockedCats, 'games', '🎮 الألعاب'),
                            _filterChip(childId, blockedCats, 'social', '📱 التواصل'),
                            _filterChip(childId, blockedCats, 'video', '🎬 الفيديو'),
                          ],
                        ),
                      ],
                    ),
                  );
                },
              );
            }

            Widget _filterChip(String childId, List<String> cats, String key, String label) {
              final selected = cats.contains(key);
              return GestureDetector(
                onTap: () {
                  final next = List<String>.from(cats);
                  selected ? next.remove(key) : next.add(key);
                  FirebaseFirestore.instance.collection('wallets').doc(childId).update({'blocked_categories': next});
                },
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                  decoration: BoxDecoration(
                    color: selected ? kMandarinOrange : kLightGray,
                    borderRadius: BorderRadius.circular(20),
                    border: Border.all(color: selected ? kMandarinOrange : kMidGray),
                  ),
                  child: Text(label,
                      style: TextStyle(
                          fontSize: 12,
                          color: kBlack,
                          fontWeight: selected ? FontWeight.bold : FontWeight.normal)),
                ),
              );
            }

