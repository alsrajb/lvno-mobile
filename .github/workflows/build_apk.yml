          class _QrScannerSheetState extends State<_QrScannerSheet> {
            final MobileScannerController _controller = MobileScannerController();
            bool _hasScanned = false;

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Container(
                padding: const EdgeInsets.all(16),
                height: 560,
                decoration: const BoxDecoration(
                  color: kWhite,
                  borderRadius: BorderRadius.vertical(top: Radius.circular(24)),
                ),
                child: Column(
                  children: [
                    Container(
                      width: 40, height: 4,
                      decoration: BoxDecoration(color: kMidGray, borderRadius: BorderRadius.circular(2)),
                    ),
                    const SizedBox(height: 12),
                    Row(
                      children: [
                        Container(
                          padding: const EdgeInsets.all(8),
                          decoration: BoxDecoration(
                            color: kMandarinOrange.withOpacity(0.15),
                            shape: BoxShape.circle,
                          ),
                          child: const Icon(Icons.qr_code_scanner, color: kMandarinOrange, size: 24),
                        ),
                        const SizedBox(width: 10),
                        Expanded(
                          child: Text(widget.title,
                              style: const TextStyle(
                                  color: kBlack, fontWeight: FontWeight.bold, fontSize: 16)),
                        ),
                        IconButton(
                          icon: const Icon(Icons.close, color: kBlack),
                          onPressed: () => Navigator.pop(context),
                        ),
                      ],
                    ),
                    const SizedBox(height: 12),
                    Expanded(
                      child: ClipRRect(
                        borderRadius: BorderRadius.circular(20),
                        child: Stack(
                          children: [
                            MobileScanner(
                              controller: _controller,
                              onDetect: (capture) {
                                if (_hasScanned) return;
                                final barcodes = capture.barcodes;
                                if (barcodes.isNotEmpty) {
                                  final code = barcodes.first.rawValue;
                                  if (code != null && code.isNotEmpty) {
                                    _hasScanned = true;
                                    Navigator.pop(context, code);
                                  }
                                }
                              },
                            ),
                            Container(
                              alignment: Alignment.center,
                              child: Container(
                                width: 240, height: 240,
                                decoration: BoxDecoration(
                                  borderRadius: BorderRadius.circular(20),
                                  border: Border.all(color: kMandarinOrange, width: 4),
                                  boxShadow: [
                                    BoxShadow(
                                      color: kMandarinOrange.withOpacity(0.5),
                                      blurRadius: 20,
                                      spreadRadius: 2,
                                    ),
                                  ],
                                ),
                              ),
                            ),
                            Positioned(
                              top: 20, left: 20,
                              child: _cornerMarker(Alignment.topLeft),
                            ),
                            Positioned(
                              top: 20, right: 20,
                              child: _cornerMarker(Alignment.topRight),
                            ),
                            Positioned(
                              bottom: 20, left: 20,
                              child: _cornerMarker(Alignment.bottomLeft),
                            ),
                            Positioned(
                              bottom: 20, right: 20,
                              child: _cornerMarker(Alignment.bottomRight),
                            ),
                          ],
                        ),
                      ),
                    ),
                    const SizedBox(height: 12),
                    const Text("وجّه الكاميرا نحو رمز QR",
                        style: TextStyle(fontSize: 13, color: kSoftGray, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 14),
                    Container(
                      padding: const EdgeInsets.all(12),
                      decoration: BoxDecoration(
                        color: kLightGray,
                        borderRadius: BorderRadius.circular(12),
                        border: Border.all(color: kMidGray),
                      ),
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: widget.manualCtrl,
