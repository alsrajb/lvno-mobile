            Widget _buildFuelPumpTunnelTab(Map<String, dynamic> w, bool ecoMode) {
              final double liveBalanceYer = widget.engine.fuelPumpRealtimeBalanceYer;
              final double sessionSpentYer = widget.engine.currentSessionConsumedYer;
              final double remMb = widget.engine.remainingChunkMb;
              final double usedMb = widget.engine.consumedChunkMb;
              final int chunkMaxMb = widget.engine.serverChunkSizeMb;
              final int triggerMb = widget.engine.serverRefillTriggerMb;

              double tankProgress = 0.0;
              if (widget.engine.activeChunkTotalBytes > 0 && chunkMaxMb > 0) {
                tankProgress = remMb / chunkMaxMb;
                if (tankProgress < 0.0) tankProgress = 0.0;
                if (tankProgress > 1.0) tankProgress = 1.0;
              }

              return SingleChildScrollView(
                padding: const EdgeInsets.all(16),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    Container(
                      padding: const EdgeInsets.all(22),
                      decoration: BoxDecoration(
                        color: const Color(0xFF1E293B),
                        borderRadius: BorderRadius.circular(24),
                        border: Border.all(
                          color: widget.engine.isVpnActive ? const Color(0xFF10B981) : Colors.white12,
                          width: 2,
                        ),
                      ),
                      child: Column(
                        children: [
                          Text(
                            widget.engine.isVpnActive ? "النفق المجزأ والعداد نشط" : "الإنترنت مقفول (النفق متوقف)",
                            style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 16),
                          ),
                          const SizedBox(height: 16),
                          const Text("الرصيد المتبقي اللحظي (عداد البنزين بالفاصلة)", style: TextStyle(fontSize: 12, color: Colors.white60)),
                          const SizedBox(height: 6),
                          Container(
                            padding: const EdgeInsets.symmetric(vertical: 12, horizontal: 20),
                            decoration: BoxDecoration(
                              color: const Color(0xFF020617),
                              borderRadius: BorderRadius.circular(14),
                            ),
                            child: Text(
                              "${liveBalanceYer.toStringAsFixed(3)} ريال",
                              style: const TextStyle(fontSize: 32, fontWeight: FontWeight.w900, fontFamily: 'monospace', color: Color(0xFF10B981)),
                            ),
                          ),
                          const SizedBox(height: 14),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.spaceAround,
                            children: [
                              Column(
                                children: [
                                  const Text("صرف الدفعة", style: TextStyle(fontSize: 11, color: Colors.white54)),
                                  Text("${sessionSpentYer.toStringAsFixed(3)} ريال", style: const TextStyle(fontWeight: FontWeight.bold, color: Colors.amber)),
                                ],
                              ),
                              Column(
                                children: [
                                  const Text("المستهلك", style: TextStyle(fontSize: 11, color: Colors.white54)),
                                  Text("${usedMb.toStringAsFixed(2)} MB", style: const TextStyle(fontWeight: FontWeight.bold)),
                                ],
                              ),
                              Column(
                                children: [
                                  const Text("متبقي بالخزان", style: TextStyle(fontSize: 11, color: Colors.white54)),
                                  Text("${remMb.toStringAsFixed(2)} MB", style: const TextStyle(fontWeight: FontWeight.bold, color: Color(0xFF6EE7B7))),
                                ],
                              ),
                            ],
                          ),
                          const SizedBox(height: 14),
                          LinearProgressIndicator(
                            value: tankProgress,
                            minHeight: 8,
                            backgroundColor: Colors.white12,
                            color: const Color(0xFF10B981),
                          ),
                          const SizedBox(height: 6),
                          Text("الدفعة: $chunkMaxMb MB | التجديد التلقائي عند استهلاك: $triggerMb MB", style: const TextStyle(fontSize: 11, color: Colors.white54)),
                          const SizedBox(height: 18),
                          SizedBox(
                            width: double.infinity,
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(
                                backgroundColor: widget.engine.isVpnActive ? Colors.redAccent : const Color(0xFF10B981),
                                foregroundColor: Colors.white,
                                padding: const EdgeInsets.symmetric(vertical: 16),
                              ),
                              onPressed: () async {
                                try {
                                  if (!widget.engine.isVpnActive) {
                                    await widget.engine.startSmartConnection(w);
                                    setState(() => _feedback = "✅ تم جلب الشفرة المتغيرة وفتح الإنترنت والعداد");
                                  } else {
                                    await widget.engine.stopSmartConnection();
                                    setState(() => _feedback = "🔒 تم إيقاف الإنترنت وحفظ قراءة العداد");
                                  }
                                } catch (e) {
                                  setState(() => _feedback = "⚠️ ${e.toString().replaceAll('Exception: ', '')}");
                                }
                              },
                              child: Text(
                                widget.engine.isVpnActive ? "إيقاف الإنترنت والنفق فوراً" : "تشغيل الإنترنت والعداد الآن",
                                style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold),
